<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyProject</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<!-- 선택: 이 폴더에 mermaid.min.js를 두면 다이어그램이 그림으로 렌더링됩니다. 없으면 소스 코드로 표시됩니다. -->
<script src="mermaid.min.js" onerror="window.__noMermaid=true"></script>
<style>
  :root{
    /* 서고(library) 팔레트 — 종이·먹빛에 사서 램프의 초록을 포인트로 */
    --bg:#f6f4ec; --panel:#ece8db; --fg:#1e2119; --muted:#6d7263; --line:#ddd7c4;
    --accent:#2f6b4f; --accent-fg:#f6f9f5; --code-bg:#ece9dd; --code-fg:#242820;
    --bad:#a6402f; --good:#2f6b4f; --quote:#eceee0;
    --font-display:'Noto Serif KR', ui-serif, Georgia, serif;
    --font-body:'Noto Sans KR', system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    --font-mono:ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160f; --panel:#1a2016; --fg:#e6ebdf; --muted:#94a08b; --line:#2a331f;
      --accent:#6fcf97; --accent-fg:#0d1a12; --code-bg:#1c2417; --code-fg:#dce6d3;
      --bad:#e0947f; --good:#6fcf97; --quote:#1a2216;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160f; --panel:#1a2016; --fg:#e6ebdf; --muted:#94a08b; --line:#2a331f;
    --accent:#6fcf97; --accent-fg:#0d1a12; --code-bg:#1c2417; --code-fg:#dce6d3;
    --bad:#e0947f; --good:#6fcf97; --quote:#1a2216;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:var(--font-body);
    font-size:15px; line-height:1.75;
  }
  #app{display:flex; height:100%}

  /* ── 사이드바 ───────────────────────── */
  aside{
    width:290px; min-width:290px; height:100%; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--line); padding:16px 14px;
  }
  aside h1{
    font-family:var(--font-display); font-weight:700; font-size:19px; margin:0 0 2px;
    letter-spacing:.01em; padding-bottom:10px; border-bottom:2px solid var(--accent);
  }
  aside .sub{font-size:12px; color:var(--muted); margin:8px 0 16px; line-height:1.5}
  #search{
    width:100%; padding:7px 9px; margin-bottom:10px; font-size:13px; font-family:var(--font-body);
    background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px;
  }
  .navgroup{
    font-family:var(--font-display); font-weight:600; font-size:11.5px; color:var(--accent);
    margin:16px 0 4px; text-transform:uppercase; letter-spacing:.1em;
  }
  .navitem{
    display:block; width:100%; text-align:left; padding:6px 9px; margin:1px 0;
    background:none; border:0; border-radius:6px; color:var(--fg);
    font:inherit; font-size:13px; cursor:pointer;
  }
  .navitem:hover{background:var(--bg)}
  .navitem.active{background:var(--accent); color:var(--accent-fg)}
  .navitem:focus-visible,#search:focus-visible,#picker:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .navitem.hide{display:none}
  #loader{margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
  #loader label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
  #picker{font-size:12px; width:100%}
  #hint{font-size:11px; color:var(--muted); margin-top:8px; line-height:1.6}

  /* ── 본문 ───────────────────────────── */
  main{flex:1; height:100%; overflow-y:auto; padding:40px 48px 120px; max-width:980px}
  #drop{
    border:2px dashed var(--line); border-radius:12px; padding:44px 24px; text-align:center; color:var(--muted);
  }
  #drop.over{border-color:var(--accent); color:var(--fg)}
  .md h1,.md h2,.md h3,.md h4{font-family:var(--font-display); line-height:1.35; margin:1.6em 0 .6em; text-wrap:balance}
  .md h1{font-size:1.9em; font-weight:700; border-bottom:2px solid var(--accent); padding-bottom:.35em; margin-top:0}
  .md h2{font-size:1.4em; font-weight:600; border-bottom:1px solid var(--line); padding-bottom:.3em}
  .md h3{font-size:1.15em; font-weight:600}
  .md h4{font-size:1em; color:var(--muted); font-weight:600}
  .md p{margin:.7em 0}
  .md ul,.md ol{margin:.6em 0 .6em 1.3em; padding:0}
  .md li{margin:.25em 0}
  .md a{color:var(--accent); text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md hr{border:0; border-top:1px solid var(--line); margin:2em 0}
  .md blockquote{
    margin:.9em 0; padding:.6em 1em; background:var(--quote);
    border-left:3px solid var(--accent); border-radius:0 6px 6px 0;
  }
  .md blockquote p{margin:.3em 0}
  .md code{
    background:var(--code-bg); color:var(--code-fg); padding:.12em .38em;
    border-radius:4px; font-family:var(--font-mono); font-size:.88em;
  }
  .md pre{
    background:var(--code-bg); color:var(--code-fg); padding:14px 16px; border-radius:8px;
    overflow-x:auto; border:1px solid var(--line); margin:.9em 0;
  }
  .md pre code{background:none; padding:0; font-size:.86em; line-height:1.6}
  .tablewrap{overflow-x:auto; margin:1em 0}
  .md table{border-collapse:collapse; width:100%; font-size:.92em; font-variant-numeric:tabular-nums}
  .md th,.md td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top}
  .md th{background:var(--panel); font-weight:600; font-family:var(--font-display)}
  .md .task{list-style:none; margin-left:.2em}
  .mermaid{background:transparent; margin:1em 0; text-align:center}
  .diagram-src{position:relative}
  .diagram-src .tag{
    position:absolute; top:8px; right:10px; font-size:10px; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase;
  }
  .md strong{font-weight:650}
  footer.meta{margin-top:48px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--muted)}
  @media (max-width:820px){
    #app{flex-direction:column}
    aside{width:100%; min-width:0; height:auto; max-height:44vh; border-right:0; border-bottom:1px solid var(--line)}
    main{padding:22px 18px 80px}
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>StudyProject</h1>
    <p class="sub">Study with DevelopPrompt — 주제별 학습 문서</p>
    <input id="search" type="search" placeholder="문서 검색…" autocomplete="off">
    <nav id="nav"></nav>
    <div id="loader">
      <label for="picker">md 파일 불러오기</label>
      <input id="picker" type="file" accept=".md,.markdown,.txt" multiple>
      <p id="hint">
        폴더의 <code>.md</code> 파일을 전부 선택하거나 오른쪽 영역에 끌어다 놓으세요.<br>
        같은 폴더에 <code>mermaid.min.js</code>를 두면 다이어그램이 그림으로 표시됩니다.
      </p>
    </div>
  </aside>
  <main id="main">
    <div id="drop">
      <h2 style="margin:0 0 8px;font-size:1.15em">문서를 불러오세요</h2>
      <p style="margin:0">왼쪽에서 <b>md 파일 불러오기</b>로 선택하거나, 이 영역에 파일을 끌어다 놓으면 됩니다.</p>
    </div>
  </main>
</div>

<!--DOCS_EMBED_START-->
<!--DOCS_EMBED_END-->

<script>
/* ────────────────────────────────────────────────────────────
   초경량 마크다운 렌더러 (외부 의존 0)
   지원: 제목 · 목록 · 체크박스 · 표 · 코드펜스 · 인용 · hr ·
        링크 · 강조 · 인라인코드 · mermaid 블록
   ──────────────────────────────────────────────────────────── */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function inline(s){
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  return t;
}

function splitRow(line){
  return line.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
}

let diagramSeq = 0;

function renderMarkdown(src){
  const lines = src.replace(/\r\n?/g,'\n').split('\n');
  const out = [];
  let i = 0;

  while(i < lines.length){
    const line = lines[i];

    /* 코드 펜스 */
    const fence = line.match(/^\s*```+\s*([\w-]*)\s*$/);
    if(fence){
      const lang = fence[1] || '';
      const buf = [];
      i++;
      while(i < lines.length && !/^\s*```+\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      const body = buf.join('\n');
      if(lang === 'mermaid'){
        if(window.mermaid && !window.__noMermaid){
          out.push('<div class="mermaid" id="mmd'+(++diagramSeq)+'">'+esc(body)+'</div>');
        }else{
          out.push('<div class="diagram-src"><span class="tag">diagram source</span><pre><code>'+esc(body)+'</code></pre></div>');
        }
      }else{
        out.push('<pre><code>'+esc(body)+'</code></pre>');
      }
      continue;
    }

    /* 표 */
    if(/^\s*\|/.test(line) && i+1 < lines.length && /^\s*\|?[\s:-|]+\|[\s:-|]*$/.test(lines[i+1])){
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(splitRow(lines[i++]));
      let html = '<div class="tablewrap"><table><thead><tr>';
      head.forEach(h => html += '<th>'+inline(h)+'</th>');
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr>';
        for(let c=0;c<head.length;c++) html += '<td>'+inline(r[c]||'')+'</td>';
        html += '</tr>';
      });
      out.push(html + '</tbody></table></div>');
      continue;
    }

    /* 제목 */
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const lv = h[1].length; out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'); i++; continue; }

    /* 수평선 */
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    /* 인용 */
    if(/^\s*>/.test(line)){
      const buf = [];
      while(i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+renderMarkdown(buf.join('\n'))+'</blockquote>');
      continue;
    }

    /* 목록 (체크박스 포함) */
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while(i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let text = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');
        i++;
        // 이어지는 들여쓰기 줄 합치기
        while(i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) && !/^\s*```/.test(lines[i])){
          text += ' ' + lines[i].trim(); i++;
        }
        const task = text.match(/^\[([ xX])\]\s*(.*)$/);
        if(task){
          const mark = task[1].toLowerCase()==='x' ? '☑' : '☐';
          items.push('<li class="task">'+mark+' '+inline(task[2])+'</li>');
        }else{
          items.push('<li>'+inline(text)+'</li>');
        }
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push('<'+tag+'>'+items.join('')+'</'+tag+'>');
      continue;
    }

    /* 빈 줄 */
    if(/^\s*$/.test(line)){ i++; continue; }

    /* 단락 */
    const buf = [];
    while(i < lines.length && !/^\s*$/.test(lines[i])
          && !/^\s*(#{1,6}\s|>|```|\||[-*+]\s|\d+\.\s|---+\s*$)/.test(lines[i])){
      buf.push(lines[i++]);
    }
    if(buf.length) out.push('<p>'+inline(buf.join('\n'))+'</p>');
    else i++;
  }
  return out.join('\n');
}

/* ────────────────────────────────────────────────────────────
   문서 저장소 · 네비게이션
   StudyProject는 ComputerScience/{분야}/{주제}.md 카테고리 트리를 쓴다 —
   내장된 문서의 data-name(저장소 루트 기준 상대경로)에서 분야 폴더를 그룹으로 뽑는다.
   ──────────────────────────────────────────────────────────── */
const docs = [];   // {name, text}

const GROUP_ORDER = ['시작', 'Architecture', 'Database', 'Infrastructure', 'Network', 'Security', 'WebDevelopment', '기타'];

function groupOf(name){
  if(/README/i.test(name)) return '시작';
  const m = name.match(/^ComputerScience\/([^/]+)\//);
  if(m) return m[1];
  return '기타';
}

function groupRank(g){
  const idx = GROUP_ORDER.indexOf(g);
  return idx === -1 ? GROUP_ORDER.length : idx;
}

function labelOf(d){
  // "ComputerScience/Network/CORS.md" → "CORS", 루트 파일은 확장자만 뗀다
  const base = d.name.split('/').pop();
  return base.replace(/\.md$/i,'');
}

function sortDocs(){
  docs.sort((a,b)=>{
    const ga = groupRank(groupOf(a.name)), gb = groupRank(groupOf(b.name));
    if(ga !== gb) return ga - gb;
    return labelOf(a).localeCompare(labelOf(b), 'en');
  });
}

function buildNav(activeName){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  let lastGroup = null;
  docs.forEach(d => {
    // .flow.md 별첨 파일은 사이드바에 따로 안 두고, 본문 안 링크로만 이동한다
    if(/\.flow\.md$/i.test(d.name)) return;
    const g = groupOf(d.name);
    if(g !== lastGroup){
      const h = document.createElement('div');
      h.className = 'navgroup'; h.textContent = g;
      nav.appendChild(h); lastGroup = g;
    }
    const b = document.createElement('button');
    b.className = 'navitem' + (d.name === activeName ? ' active' : '');
    b.textContent = labelOf(d);
    b.dataset.name = d.name;
    b.onclick = () => show(d.name);
    nav.appendChild(b);
  });
  applyFilter();
}

function show(name){
  const doc = docs.find(d => d.name === name);
  if(!doc) return;
  const main = document.getElementById('main');
  main.innerHTML =
    '<article class="md">' + renderMarkdown(doc.text) + '</article>' +
    '<footer class="meta">' + escHtmlAttr(doc.name) +
    ' · 이 뷰어는 md 원본을 그대로 렌더링합니다. 내용 수정은 md 파일에서 하세요.</footer>';
  main.scrollTop = 0;
  buildNav(name);
  if(window.mermaid && !window.__noMermaid){
    try{ window.mermaid.run({ querySelector:'.mermaid' }); }catch(e){}
  }
  // 문서 간 상대 링크(같은 폴더 ./X.md, 다른 폴더 ../Y/X.md)를 뷰어 내부 이동으로 처리
  const dir = name.includes('/') ? name.slice(0, name.lastIndexOf('/')) : '';
  main.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if(!/\.md$/i.test(href) || /^https?:\/\//i.test(href)) return;
    const resolved = resolvePath(dir, href);
    if(docs.some(d => d.name === resolved)){
      a.addEventListener('click', ev => { ev.preventDefault(); show(resolved); });
    }
  });
}

function resolvePath(baseDir, relHref){
  const baseParts = baseDir ? baseDir.split('/') : [];
  const relParts = relHref.split('/');
  for(const part of relParts){
    if(part === '.' || part === '') continue;
    if(part === '..') baseParts.pop();
    else baseParts.push(part);
  }
  return baseParts.join('/');
}

function escHtmlAttr(s){ return s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function applyFilter(){
  const q = (document.getElementById('search').value || '').toLowerCase();
  document.querySelectorAll('.navitem').forEach(b => {
    const name = b.dataset.name.toLowerCase();
    const doc = docs.find(d => d.name === b.dataset.name);
    const hit = !q || name.includes(q) || (doc && doc.text.toLowerCase().includes(q));
    b.classList.toggle('hide', !hit);
  });
}
document.getElementById('search').addEventListener('input', applyFilter);

function addDocs(list, autoShow){
  list.forEach(d => {
    const exist = docs.findIndex(x => x.name === d.name);
    if(exist >= 0) docs[exist] = d; else docs.push(d);
  });
  sortDocs();
  if(docs.length && autoShow){
    const first = docs.find(d => !/\.flow\.md$/i.test(d.name)) || docs[0];
    show(first.name);
  }else buildNav();
}

/* 파일 선택 */
document.getElementById('picker').addEventListener('change', async e => {
  const files = [...e.target.files];
  const loaded = await Promise.all(files.map(async f => ({ name:f.name, text:await f.text() })));
  addDocs(loaded, true);
});

/* 드래그 앤 드롭 */
const main = document.getElementById('main');
['dragenter','dragover'].forEach(t => main.addEventListener(t, e => {
  e.preventDefault(); document.getElementById('drop')?.classList.add('over');
}));
main.addEventListener('dragleave', () => document.getElementById('drop')?.classList.remove('over'));
main.addEventListener('drop', async e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  if(!files.length) return;
  const loaded = await Promise.all(files.map(async f => ({ name:f.name, text:await f.text() })));
  addDocs(loaded, true);
});

/* mermaid 초기화 — 문서 렌더링보다 먼저 해야 테마가 적용된다 */
if(window.mermaid && !window.__noMermaid){
  try{
    window.mermaid.initialize({
      startOnLoad:false,
      theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
  }catch(e){ window.__noMermaid = true; }
}

/* ① 번들에 내장된 문서가 있으면 그것을 쓴다 */
(function loadEmbedded(){
  const nodes = [...document.querySelectorAll('script[type="text/markdown"]')];
  if(!nodes.length) return;
  addDocs(nodes.map(n => ({ name:n.dataset.name, text:n.textContent })), true);
  document.getElementById('loader').style.display = 'none';
})();

/* 이 엔진은 DevelopPrompt/VIEWER의 것을 그대로 재사용한다(ComputerScience/{분야} 카테고리
   그룹핑만 추가). file:// 로 열었을 때 문서가 안 보이면 DOCS_BUNDLE.html(내장 번들)을 대신
   여세요 — README 참고. */
</script>
</body>
</html>
