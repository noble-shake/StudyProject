# CRA(Create React App) → Vite 마이그레이션

---

- **카테고리**: 웹 개발, 프런트엔드 빌드 도구
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

- `RottenNobleProject` `STUDY-02` — `DevelopPrompt/CurrentProject/_RottenNobleProject/Study.md`

## 정의

React 앱을 만들 때, React 코드(JSX)를 브라우저가 이해할 수 있는 JS로 변환하고, 여러 파일을 하나로
묶고(번들링), 개발 중엔 변경사항을 즉시 반영해주는 도구가 필요하다 — 이런 일을 해주는 게 "빌드
도구"다. Create React App(CRA)과 Vite는 둘 다 이 역할을 하는 도구지만, 내부에서 쓰는 기술과
설계 철학이 다르다. CRA는 Webpack을, Vite는 네이티브 ES 모듈과 esbuild/Rollup을 기반으로 한다.

## 요약

CRA는 2022년 이후 사실상 유지보수가 끊긴 도구인데, RottenNobleProject는 이미 그 대가로 실제 버그를
겪었다(`react-router-dom`을 테스트에서만 못 찾는 문제) — React 자체를 바꾸는 게 아니라, React를
감싸는 빌드 도구만 Vite로 바꾸면 이 문제 자체가 사라진다.

## 상세

### CRA가 왜 생겼고, 왜 저물었나

2016년 등장한 CRA는 "Webpack 설정을 하나도 몰라도 `npx create-react-app`만 치면 React 개발을
바로 시작할 수 있다"는 게 핵심 가치였다. 당시엔 획기적이었다 — Webpack 설정 파일을 처음부터
직접 작성하는 건 상당한 학습 곡선이 있었기 때문이다. 하지만 시간이 지나며 두 가지 일이 동시에
일어났다. 첫째, React 생태계 자체가 CRA 없이도 쉽게 시작할 수 있는 대안(Vite 등)을 갖추게 됐다.
둘째, CRA를 유지보수하던 팀의 활동이 사실상 멈췄다 — 마지막 주요 릴리스(`react-scripts` 5.0.1)가
2022년에 나온 뒤로 큰 업데이트가 없다. 그 결과 React 공식 문서도 이제 신규 프로젝트에 CRA를
권장하지 않는 쪽으로 안내를 바꿨다.

### 실제로 겪은 문제 — `exports` 필드와 Jest

이 프로젝트가 CRA의 노후화를 추상적으로만 아는 게 아니라 **실제로 부딪힌** 지점이 있다.
`react-router-dom`(v6/v7)을 앱에 붙였는데, 화면은 멀쩡히 뜨지만(`npm start`) 테스트만 실행하면
(`npm test`) 이런 에러로 죽었다:

```
Cannot find module 'react-router/dom' from 'node_modules/react-router-dom/dist/index.js'
```

원인은 이렇다. 최신 npm 패키지들은 `package.json`의 `exports` 필드로 "이 패키지의 어느 경로를
import하면 실제로 어느 파일이 로드되는지"를 명시적으로 매핑한다. `react-router-dom`도 이 방식을
쓴다. **개발 서버(webpack 5)는 이 `exports` 필드를 정상적으로 읽지만**, CRA(`react-scripts 5.0.1`)
안에 번들된 Jest 버전은 이 필드를 이해하지 못하고 옛날 방식(`package.json`의 `main` 필드)으로만
모듈을 찾다가 실패한다. 즉, 같은 코드가 화면에서는 되고 테스트에서는 안 되는 상황이 벌어진 것 —
이건 `react-router-dom`이라는 라이브러리의 버그가 아니라, **CRA가 최신 패키지 생태계의 관례를
못 따라가고 있다는 증거**다. 버전을 내려도(v6로) 다른 패키지에서 같은 계열 문제가 또 나올 수
있다는 뜻이기도 하다.

당장의 대응은 "라우터를 쓰는 컴포넌트는 CRA 테스트 대상에서 빼고, 라우터를 안 거치는 순수 로직만
테스트한다"였다 — 근본 원인을 고치는 게 아니라 우회한 것이다.

### Vite가 이 문제를 원천적으로 안 겪는 이유

Vite는 애초에 설계 자체가 다르다. 개발 중에는 브라우저의 네이티브 ES 모듈(`import`) 기능을 그대로
활용해서 번들링 없이 파일을 그대로 서빙하고(그래서 개발 서버 시작이 즉각적이다), 프로덕션
빌드에는 Rollup을 쓴다. 테스트 러너로는 보통 Vitest를 같이 쓰는데, Vitest는 Vite와 같은 모듈
해석 엔진을 공유하기 때문에 `exports` 필드 같은 최신 패키지 관례를 처음부터 정확히 지원한다 —
"webpack은 되는데 Jest는 안 되는" 종류의 불일치 자체가 생길 구조가 아니다.

### 검토했지만 채택하지 않은 대안들

- **React를 다른 프레임워크(Vue, Svelte)로 교체** — 검토 범위 밖으로 판단했다. 이 프로젝트의 목표
  자체가 "React를 실제로 익히는 것"이라, React를 바꾸는 건 학습 목적과 정면으로 어긋난다. 문제는
  React가 아니라 그걸 감싼 빌드 도구였다는 걸 구분하는 게 중요하다.
- **Next.js로 전환** — Next.js는 프런트엔드뿐 아니라 API 라우트까지 갖는 풀스택 프레임워크다.
  하지만 이 프로젝트는 "PHP 백엔드를 별도로 두고 그걸 직접 익힌다"는 목표가 있어서, 백엔드
  역할까지 흡수하는 Next.js는 오히려 이 프로젝트의 학습 목표와 충돌한다.
- **`craco`/`react-app-rewired`로 CRA의 Jest 설정만 오버라이드** — 가능은 하지만, 이것도 결국
  "낡은 도구 위에 패치를 얹는" 접근이라 이 프로젝트 규모에서 들일 만한 복잡도는 아니라고 보류했다.

## 비교표

| 항목 | CRA (`react-scripts`, 현재 사용 중) | Vite |
|---|---|---|
| 내부 번들러 | Webpack 5 | 개발: 네이티브 ESM / 빌드: Rollup |
| 개발 서버 시작 속도 | 프로젝트 규모에 비례해 느려짐 | 파일을 그대로 서빙해 훨씬 빠름 |
| `package.json exports` 필드 지원 | 개발 서버는 지원, 번들된 Jest는 미지원 | 네이티브로 지원 |
| 유지보수 상태 | 사실상 중단(마지막 주요 릴리스 2022) | 활발히 유지보수 중 |
| React 공식 문서 권장 여부 | 신규 프로젝트에 비권장 | 대안으로 언급됨 |
| 이 프로젝트가 실제로 겪은 문제 | `react-router-dom` 테스트 실패(`exports` 미지원) | (해당 문제 없음) |

## 질문

- **Q. 지금 당장 문제가 있는 건 아닌데(우회책으로 넘어감), 굳이 마이그레이션이 필요한가?**
  A. `Study.md`의 철학대로, 이건 "지금 당장 처리해야 할 일"이 아니라 "언젠가 제대로 배우고
  판단하고 싶은 후보"로 남겨둔 것이다. 다만 CRA가 유지보수되지 않는다는 사실 자체는 시간이
  지날수록(새 라이브러리를 더 붙일수록) 같은 계열 문제가 반복될 가능성을 키운다 — 언제
  마이그레이션할지는 별도 판단이 필요하지만, "왜 필요할 수도 있는지"는 이미 실측으로 확인됐다.
  **(2026-09-09 갱신) 실제로 마이그레이션이 이루어졌다** — 백엔드를 Spring Boot로 전면
  재작성하는 김에 프런트 빌드 도구도 같이 옮겼다. 결과: `npm install` 의존성 개수가
  1188개 → 64개로 줄었고, 위에서 겪은 `react-router-dom`/Jest `exports` 문제 자체가 재현되지
  않는다(Vite+Vitest 조합에선 이 문제가 애초에 발생할 구조가 아니라는 "Vite가 이 문제를
  원천적으로 안 겪는 이유" 절의 설명이 실측으로 확인됨).

- **Q. CRA에서 Vite로 옮기면 코드를 얼마나 고쳐야 하나?**
  A. React 컴포넌트 코드 자체는 거의 그대로 유지된다. 주로 바뀌는 건 환경변수 접근 방식
  (`process.env.REACT_APP_*` → `import.meta.env.VITE_*`), `public/index.html`의 스크립트
  주입 방식, 그리고 `package.json`의 `proxy` 필드 대신 Vite의 `server.proxy` 설정으로 옮기는
  작업이다. 이 프로젝트는 `REACT_APP_API_BASE_URL`을 여러 곳에서 쓰고 있어(`frontend/src/api/*.js`),
  환경변수 이름 변경이 실제 마이그레이션 작업의 상당 부분을 차지할 것으로 보인다.

## 예시 코드

```json
// 현재: package.json (CRA)
"scripts": {
  "start": "react-scripts start",
  "build": "react-scripts build",
  "test": "react-scripts test"
}
```

```js
// Vite로 옮기면 환경변수 접근 방식이 바뀐다
// CRA: process.env.REACT_APP_API_BASE_URL
// Vite: import.meta.env.VITE_API_BASE_URL
const API_BASE_URL = import.meta.env.VITE_API_BASE_URL;
```

(생략 — "번들러가 다르다"는 이 주제의 핵심이 도구 하나를 다른 도구로 치환하는 것뿐이라 순서·분기가
없다. 표로 이미 충분하다.)

## 실무

실무에서는 이미 Vite가 새 React 프로젝트의 사실상 표준 스캐폴딩 도구로 자리잡았다 — React 공식
문서의 "시작하기" 안내도 CRA 대신 Vite(또는 Next.js 같은 프레임워크)를 언급하는 쪽으로 바뀌었다.
기존에 CRA로 시작한 대규모 프로젝트들은 당장 마이그레이션하지 않고 유지보수 모드로 두는 경우도
많지만, 새로 시작하는 프로젝트에서 CRA를 고르는 경우는 실무에서 거의 사라졌다. 이 프로젝트처럼
"이미 CRA로 시작했고, 실제 문제를 한 번 겪었다"는 상황은 마이그레이션을 진지하게 고려할 만한 신호에
해당한다.

# PHP

---

- **카테고리**: 웹 개발, 서버 사이드
- **상태**: 완료
- **기준 시점**: 2026-09-08, PHP 8.x 기준
- **관련 레포지토리**: `RottenNoble-Project`

---

> **2026-09-08 갱신**: `RottenNoble-Project`의 실제 백엔드는 이 문서 작성 이후 Java Spring
> Boot로 교체됐다([Spring Boot](./Spring-Boot.md) 참고) — 이 문서를 지우지 않고 남겨둔 이유는
> "그때 왜 PHP를 선택했는지"와 "프레임워크 없이 짜보면 뭘 배우는지"가 스택이 바뀌어도 여전히
> 유효한 학습 내용이기 때문이다. 아래 본문은 PHP 백엔드가 실제로 운영되던 시점 기준으로 남겨둔다.

## 출처

`RottenNobleProject` — `STUDY-nn` 백로그 항목이 아니라, `RottenNobleProject-Architecture.md` 코드
직접 학습 세션(1회차, 환경/스택)에서 나온 주제.

## 정의

PHP는 웹 서버에서 HTML이나 JSON 같은 응답을 만들어내기 위해 만들어진 서버 사이드 스크립트 언어다.
"서버 사이드"라는 말이 핵심인데, PHP 코드는 사용자의 브라우저가 아니라 웹 서버(우리 경우엔 Apache)
위에서 실행되고, 그 실행 결과(완성된 HTML이나 JSON 텍스트)만 브라우저로 전송된다. 자바스크립트가
브라우저 안에서 실행되는 것과 정반대 위치에 있는 언어라고 생각하면 된다.

PHP의 가장 큰 특징은 "요청마다 새로 실행된다"는 점이다. 사용자가 `get_posts.php`에 접속하면, 서버는
그 요청 하나를 위해 `get_posts.php` 파일을 처음부터 끝까지 다시 실행하고, 끝나면 메모리에서 사라진다.
Node.js처럼 서버 프로세스가 계속 떠 있으면서 요청을 하나씩 처리하는 방식과는 실행 모델 자체가 다르다.

## 요약

PHP는 "요청 하나 = 스크립트 한 번 실행"이라는 모델을 가진 서버 사이드 언어이고, 이 프로젝트는
그 위에 아무 프레임워크도 얹지 않은 채로 직접 썼다 — 그 결과 "파일 경로가 곧 URL 경로"가 되는
가장 원초적인 형태의 라우팅을 갖게 됐다.

## 상세

### 왜 이런 실행 모델을 갖게 됐나

PHP는 1990년대 중반, "홈페이지에 방문자 수 세는 스크립트를 붙이고 싶다"는 아주 실용적인 동기에서
출발했다. 그래서 처음부터 "이 파일 하나가 하나의 요청을 처리한다"는 단순한 모델을 택했고, Apache 같은
웹 서버에 모듈로 꽂히면서 "URL 경로 = 서버의 실제 파일 경로"라는 관례가 자연스럽게 생겼다. 이 관례가
지금 RottenNobleProject의 백엔드 구조를 그대로 설명한다.

### 프레임워크 없이 쓴다는 것의 실제 의미

Laravel이나 Symfony 같은 PHP 프레임워크를 쓰면, 라우터가 URL을 분석해서 어떤 컨트롤러 함수를
호출할지 정해주고, ORM이 DB 접근을 대신해주고, 미들웨어 체인이 인증 같은 공통 처리를 앞뒤로
끼워준다. RottenNobleProject는 이런 걸 하나도 쓰지 않았다. 그 대신:

- **라우팅**: `backend/get_posts.php`라는 파일이 있으면 `/get_posts.php`가 곧 그 엔드포인트다.
  라우터가 URL을 해석하는 과정 자체가 없다 — 웹 서버(Apache)가 그냥 그 경로의 파일을 실행할 뿐이다.
- **컨트롤러**: 각 `.php` 파일 자체가 컨트롤러 역할을 한다. `get_posts.php`를 열어보면
  `require`로 공통 유틸을 불러오고, SQL을 실행하고, JSON으로 응답하는 게 전부다 — 딱 20줄
  안팎이다.
- **미들웨어**: `auth.php`의 `require_admin()` 함수를 보호가 필요한 엔드포인트 맨 위에서 그냥
  호출한다. Express나 Laravel의 미들웨어 체인처럼 "요청이 여러 겹의 함수를 자동으로 통과하는"
  구조가 아니라, 개발자가 매 파일마다 "여기서 로그인 확인해줘"라고 직접 한 줄을 적어 넣는 방식이다.
  빼먹으면 그 엔드포인트는 그냥 보호가 안 된다 — 프레임워크였다면 라우트 정의에서 강제할 수 있었을
  실수를, 여기서는 개발자의 습관에 맡기고 있다는 뜻이다.

### 반복을 뽑아내는 방식

프레임워크가 없다 보니, 여러 엔드포인트 파일에서 매번 반복되는 코드가 생긴다. 이 프로젝트에서는
CORS 헤더를 붙이고 JSON으로 응답하는 코드가 세 번째 파일에서도 똑같이 나타나자, 그걸
`response.php`라는 공용 파일로 뽑아냈다. 이건 프레임워크가 "미리 정해준" 구조가 아니라, 코드를
짜다가 중복을 발견하고 그때그때 손으로 리팩터링한 결과다.

```php
// backend/response.php — 실제 코드
function send_json($data, int $httpCode = 200): void
{
    header('Content-Type: application/json; charset=UTF-8');
    http_response_code($httpCode);
    echo json_encode(['status' => 'ok', 'data' => $data]);
    exit;
}
```

이런 식으로 "필요할 때 뽑아내는" 접근은 프레임워크가 처음부터 강제하는 구조보다 자유롭지만, 그만큼
"언제 뽑아낼지"를 사람이 계속 판단해야 한다는 대가가 있다.

## 비교표

| 항목 | PHP (프레임워크 없음, 이 프로젝트) | PHP + 프레임워크 (Laravel 등) | Node.js/Express |
|---|---|---|---|
| 실행 모델 | 요청마다 스크립트 새로 실행 | 요청마다 스크립트 새로 실행(프레임워크 부트스트랩 포함) | 프로세스가 계속 떠서 요청을 순차 처리 |
| 라우팅 | 파일 경로 = URL 경로 | 라우트 정의 파일에서 URL→컨트롤러 매핑 | 코드로 명시적 라우트 등록 |
| 공통 처리(인증 등) | 파일마다 함수 호출로 직접 삽입 | 미들웨어 체인이 자동 적용 | 미들웨어 체인이 자동 적용 |
| 학습 난이도 | 낮음(개념이 거의 없음) — 대신 "프레임워크가 원래 해주던 일"을 직접 알아야 함 | 프레임워크 고유 개념(ORM, 서비스 컨테이너 등)을 따로 배워야 함 | 이벤트 루프, 비동기 개념을 배워야 함 |
| 이 프로젝트가 고른 이유 | 엔드포인트가 10여 개뿐인 규모 + "PHP 자체를 직접 익힌다"는 학습 목표 | (선택 안 함) | (선택 안 함, 백엔드는 PHP로 고정) |

## 질문

- **Q. 왜 `require_admin()`을 매 파일마다 호출해야 하나? 자동으로 걸 수는 없나?**
  A. 프레임워크의 미들웨어 체인이 없으니 "요청이 들어오면 항상 거치는 공통 관문"이 없다. Apache
  설정(`.htaccess`)에서 특정 경로 패턴에 대해 인증을 강제하는 것도 이론적으로는 가능하지만, 이
  프로젝트는 그렇게까지 하지 않고 각 파일에 `require_admin();` 한 줄을 직접 넣는 쪽을 택했다 —
  엔드포인트가 몇 개 안 되니 실수로 빼먹을 위험보다 구조를 단순하게 유지하는 쪽을 우선한 것으로
  보인다.

- **Q. 파일 하나 = 엔드포인트 하나 구조는 엔드포인트가 많아지면 안 무너지나?**
  A. 무너진다. 지금은 10여 개라 폴더 하나에 다 펼쳐놔도 훑어보는 데 문제가 없지만, 엔드포인트가
  수십 개로 늘어나면 파일 이름만으로 구조를 파악하기 어려워지고, `response.php`처럼 뽑아낼 공통
  로직도 더 많아진다 — 이 지점이 보통 "이제 프레임워크나 최소한의 라우터가 필요하다"는 신호가 되는
  경계선이다.

## 예시 코드

실제 `backend/get_posts.php` 전체 — 프레임워크 없는 PHP 엔드포인트가 얼마나 짧을 수 있는지 보여준다.

```php
<?php
// backend/get_posts.php
require 'response.php';
require 'db.php';

allow_cors();

$sql = "SELECT id, title, content, created_at FROM posts ORDER BY created_at DESC";
$result = $conn->query($sql);

$posts = [];
if ($result->num_rows > 0) {
    while ($row = $result->fetch_assoc()) {
        $posts[] = $row;
    }
}

$conn->close();
send_json($posts);
```

`require`로 공용 유틸 두 개를 불러온 다음, CORS를 허용하고, SQL을 돌리고, JSON으로 응답한다 — 이
네 줄짜리 흐름이 이 프로젝트의 거의 모든 GET 엔드포인트에서 반복되는 뼈대다.

## 실무

실무에서는 신규 프로젝트에 프레임워크 없는 PHP를 쓰는 경우가 많지 않다 — Laravel이 사실상 PHP
생태계의 표준 프레임워크로 자리잡았고, 라우팅·ORM·인증·검증 같은 걸 직접 짜는 대신 프레임워크가
제공하는 규약을 따르는 쪽이 유지보수 비용이 훨씬 낮기 때문이다. 다만 이 프로젝트처럼 규모가 아주
작고(엔드포인트 10여 개), 목적 자체가 "PHP 언어와 웹 서버가 어떻게 맞물려 동작하는지 직접 익히는
것"이라면, 프레임워크가 대신 해주는 부분을 일부러 걷어내고 직접 짜보는 것도 합리적인 선택이다.
프레임워크는 "이미 이해한 것을 빠르게 반복하기 위한 도구"에 가깝다 — 처음 배우는 단계에서는 오히려
무엇이 자동으로 되는지가 안 보여서 방해가 될 수 있다.

최근 동향으로는 PHP 자체도 8.x 버전대에서 타입 선언, `match` 표현식, 성능 개선(JIT 컴파일러)이
계속 들어가고 있고, "레거시 언어"라는 이미지와 달리 워드프레스 등 대규모 서비스가 여전히 PHP
위에서 돌아가고 있다.

# React

---

- **카테고리**: 웹 개발, 프런트엔드
- **상태**: 완료
- **기준 시점**: 2026-09-08, React 19 기준
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `RottenNobleProject-Architecture.md` 1~3회차 코드 학습에서 나온 주제.

## 정의

React는 사용자 인터페이스(UI)를 **컴포넌트** 단위로 만드는 자바스크립트 라이브러리다. 컴포넌트란
"화면의 한 조각을 만드는 함수"라고 생각하면 된다 — 데이터(props나 상태)를 받아서, 그 데이터에
맞는 화면 구조(JSX)를 반환한다. 데이터가 바뀌면 React가 알아서 화면의 필요한 부분만 다시
그려준다.

## 요약

이 프로젝트는 페이지마다 컴포넌트를 하나씩 두고(`PostList`, `PostEditor` 등), 각 컴포넌트가
`useState`로 자기 상태를 관리하고 `useEffect`로 API를 호출하는, React의 가장 기본적이고 표준적인
패턴만으로 이루어져 있다 — Redux 같은 전역 상태 관리 라이브러리도, 복잡한 커스텀 훅 체계도 없다.

## 상세

### 컴포넌트와 JSX

```jsx
// frontend/src/pages/Login/Login.jsx의 일부
function Login() {
  const [username, setUsername] = useState('');
  // ...
  return (
    <div className="page page-narrow">
      <h1>관리자 로그인</h1>
      <form onSubmit={handleSubmit}>
        {/* ... */}
      </form>
    </div>
  );
}
```

`function Login() { ... }`이 컴포넌트다. 함수 안의 `return`문에 있는 것처럼 생긴 HTML 비슷한
코드가 **JSX**인데, 이건 실제 HTML이 아니라 자바스크립트 문법의 확장이다 — 빌드 도구(이
프로젝트에서는 CRA/Webpack)가 이걸 `React.createElement(...)` 호출로 변환한다. JSX 안에서
`{}`로 감싼 부분은 순수 자바스크립트 표현식이라는 게 핵심 규칙이다.

### `useState` — 컴포넌트가 스스로 기억하는 값

```jsx
// frontend/src/pages/PostEditor/PostEditor.jsx
const [title, setTitle] = useState('');
```

`useState('')`는 "초깃값이 빈 문자열인 상태 하나"를 만든다. `title`은 지금 값을, `setTitle`은
그 값을 바꾸는 함수다. **핵심은 `setTitle`을 호출하면 React가 이 컴포넌트를 다시 실행해서 화면을
새로 그린다**는 것 — 일반 변수를 바꾸는 것과 근본적으로 다르다. 일반 변수(`let title = ''`)를
바꾸면 화면엔 아무 변화도 안 생긴다. React가 "이 값이 바뀌면 화면을 다시 그려야 한다"는 걸 알
수 있는 유일한 방법이 `useState`가 제공하는 setter 함수이기 때문이다.

### `useEffect` — 컴포넌트가 화면에 나타난 뒤에 할 일

```jsx
// frontend/src/pages/PostEditor/PostEditor.jsx
useEffect(() => {
  if (!isEdit) return;
  fetchPost(id)
    .then((post) => { setTitle(post.title); setContent(post.content); })
    .catch((err) => setError(err.message))
    .finally(() => setLoading(false));
}, [id, isEdit]);
```

컴포넌트 함수 자체(위의 JSX를 반환하는 부분)는 "지금 이 데이터로 화면이 어떻게 생겨야 하는가"만
설명해야 하고, API 호출 같은 **부수 효과(side effect)**는 별도로 다뤄야 한다는 게 React의
설계다. `useEffect`가 그 자리다 — 두 번째 인자인 배열(`[id, isEdit]`, "의존성 배열")에 적힌
값이 바뀔 때만 이 함수를 다시 실행한다. 이 프로젝트는 "수정 모드(`isEdit`)일 때만, `id`가 바뀔
때마다 그 글을 다시 불러온다"는 걸 이 한 줄로 표현하고 있다.

### 이 프로젝트가 안 쓰는 것들

React 생태계에는 이 프로젝트가 쓰지 않은 것들이 많다:

- **전역 상태 관리(Redux, Zustand, Context API)** — `Login.jsx`의 주석을 보면 로그인 성공 후
  `navigate()` 대신 `window.location.href = '/'`로 전체 새로고침을 쓰는데, 그 이유가 바로 "Nav의
  로그인 상태를 새로고침 없이 갱신하려면 전역 상태가 필요한데, 이 규모엔 과하다"는 판단이다. 즉
  안 쓴 게 아니라, 안 써도 되는 방법으로 우회한 것이다.
- **TypeScript** — `.jsx` 확장자를 쓰고 있어 타입 검사가 없다. props나 상태 값의 타입은 코드를
  직접 읽어야 알 수 있다.
- **커스텀 훅** — `useState`/`useEffect`를 여러 컴포넌트에서 비슷하게 반복해서 쓰고 있지만
  (`error`/`submitting` 상태 패턴이 `Login.jsx`와 `PostEditor.jsx`에서 거의 동일하다), 이걸
  `useAsyncForm()` 같은 커스텀 훅으로 뽑아내지는 않았다 — 페이지가 5개뿐인 지금 규모에서는 중복이
  아직 리팩터링을 정당화할 만큼 크지 않다고 볼 수 있다.

## 비교표

| 개념 | 역할 | 이 프로젝트에서 쓰인 곳 |
|---|---|---|
| 컴포넌트(함수) | 화면 조각 하나를 만든다 | `pages/*/**.jsx` 각각 |
| `useState` | 컴포넌트가 스스로 값을 기억하고, 바뀌면 다시 그린다 | 폼 입력값, `loading`/`error`/`submitting` 상태 |
| `useEffect` | 화면에 나타난 뒤(또는 특정 값이 바뀐 뒤) 할 일 | `PostEditor`가 수정 모드일 때 글 데이터 불러오기 |
| `useNavigate`/`useParams` (react-router) | 페이지 이동, URL 파라미터 읽기 | 글 저장 후 상세 페이지로 이동, `:id` 읽기 |

## 질문

- **Q. `useEffect`의 의존성 배열을 빠뜨리면 어떻게 되나?**
  A. React는 컴파일 타임에 이걸 강제로 막지는 않지만(ESLint 규칙이 경고는 해준다), 실제로
  빠뜨리면 그 값이 바뀌어도 effect가 다시 실행되지 않아서 화면이 오래된 데이터를 계속 보여주는
  버그가 생긴다. `PostEditor.jsx`가 `[id, isEdit]`을 정확히 넣어둔 건, `/posts/1/edit`에서
  `/posts/2/edit`으로 바로 이동했을 때도(컴포넌트가 언마운트되지 않고 재사용될 수 있음) 새
  `id`로 다시 데이터를 불러오게 하기 위함이다.

- **Q. React 19는 이전 버전과 뭐가 다른가?**
  A. React 19는 `use()` 훅, 폼 관련 새 훅(`useActionState`, `useFormStatus`) 등 서버 연동을
  더 매끄럽게 하는 기능들을 추가했다. 다만 이 프로젝트는 이런 신규 기능을 쓰지 않고
  `useState`/`useEffect` 같은 이전부터 있던 기본 훅만으로 구성돼 있다 — 최신 버전을 쓰고 있지만
  실제로는 오래전부터 안정적으로 쓰이던 패턴만 활용하고 있는 셈이다.

## 예시 코드

```jsx
// frontend/src/pages/PostList/PostList.jsx 패턴 요약 — 목록을 불러와 렌더링하는 전형적인 형태
function PostList() {
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetchPosts()
      .then(setPosts)
      .finally(() => setLoading(false));
  }, []);

  if (loading) return <p>불러오는 중…</p>;
  return (
    <ul>
      {posts.map((post) => <li key={post.id}>{post.title}</li>)}
    </ul>
  );
}
```

`useEffect`의 의존성 배열이 빈 배열(`[]`)이면 "컴포넌트가 처음 화면에 나타날 때 딱 한 번만
실행"이라는 뜻이다 — 목록을 한 번만 불러오면 되는 이런 경우의 표준 패턴이다.

## 플로우차트

(생략 — 컴포넌트/훅 개념은 "무엇이 무엇을 트리거하는가"보다 "각 개념이 무슨 역할인가"가 핵심이라
표로 이미 충분히 정리된다.)

## 실무

React는 현재 프런트엔드 라이브러리 중 가장 널리 쓰이는 선택지 중 하나이고, 실무에서는 이
프로젝트처럼 순수 `useState`/`useEffect`만 쓰기보다 상태 관리 라이브러리(Redux Toolkit,
Zustand, TanStack Query 등)를 함께 쓰는 경우가 많다 — 특히 서버 데이터를 다루는 부분은
TanStack Query 같은 라이브러리가 로딩/에러/캐싱 상태 관리를 대신해줘서, 이 프로젝트가 각
페이지마다 손으로 반복하고 있는 `loading`/`error` 상태 패턴을 크게 줄여준다. 다만 이 프로젝트
규모(페이지 5개)에서는 그런 라이브러리 없이도 코드가 아직 읽기 어렵지 않다 — "언제부터 상태
관리 라이브러리가 필요해지는가"를 실감하기에 좋은 기준점이 되는 프로젝트다.

# React Router — HashRouter vs BrowserRouter

---

- **카테고리**: 웹 개발, 프런트엔드
- **상태**: 완료
- **기준 시점**: 2026-09-08, react-router-dom v7 기준
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `CODE_MEMO.md`의 `MEMO-WEB-05`, `RottenNobleProject-Architecture.md`
2회차(아키텍처 계층)에서 나온 주제.

## 정의

React는 원래 "페이지 이동"이라는 개념이 없다 — 하나의 HTML 페이지 안에서 컴포넌트를 바꿔치기하는
방식(SPA, Single Page Application)이 기본이다. React Router는 이 SPA 안에서 "URL이 이렇게
바뀌면 이 컴포넌트를 보여준다"는 규칙을 정의할 수 있게 해주는 라이브러리다. 이때 URL을 실제로
어떻게 관리할지에 두 가지 방식이 있는데, 하나가 `BrowserRouter`(진짜 URL 경로를 씀), 다른 하나가
`HashRouter`(URL에 `#`을 붙여 그 뒤를 씀)다.

## 요약

이 프로젝트는 원래 `BrowserRouter`를 쓰려 했지만, Synology Web Station에서 "알 수 없는 경로는
`index.html`로 돌려보내라"는 서버 설정(rewrite rule)을 만질 방법을 못 찾아서, 서버 설정이 아예
필요 없는 `HashRouter`로 우회했다 — URL에 `#`이 붙는 걸 감수하고 인프라 제약을 회피한 사례다.

## 상세

### 왜 `BrowserRouter`는 서버 설정이 필요한가

`BrowserRouter`를 쓰면 URL이 `https://rotten-noble.com/posts/3`처럼 진짜 경로처럼 보인다. 이건
자바스크립트의 History API를 이용해서, 실제로는 페이지를 새로 안 불러오면서 브라우저 주소창의
URL만 바꾸는 방식이다. 문제는 **사용자가 그 URL을 새로고침하거나, 그 링크로 직접 접속**할 때
생긴다 — 이때는 브라우저가 서버에 진짜로 `/posts/3`이라는 경로를 요청한다. 하지만 서버(Apache)
입장에서는 `/posts/3`이라는 실제 파일이나 폴더가 없다 — 이건 오직 React Router가 자바스크립트로
해석해야 하는 "가짜 경로"이기 때문이다. 그래서 서버가 반드시 "이런 알 수 없는 경로는 그냥
`index.html`을 대신 응답해라"는 **rewrite 규칙**을 갖고 있어야, React 앱이 로드된 뒤 React
Router가 그 경로를 보고 알맞은 컴포넌트를 보여줄 수 있다.

### 이 프로젝트가 부딪힌 것 — Web Station GUI의 한계

`MEMO-WEB-05`에 남은 이유는 이렇다: Nginx나 Apache의 rewrite 설정을 직접 만지려면 보통 설정
파일에 직접 규칙을 써야 하는데, Synology DSM의 Web Station GUI에는 이런 세밀한 rewrite 규칙을
직접 넣을 방법이 마땅치 않았다. 방법이 아예 없는 건 아닐 수 있지만(예: Web Station이 커스텀
설정 파일을 지원하는 버전으로 업데이트되면 가능할 수도 있음), 지금 당장 찾은 방법으로는
막혀 있었다.

### `HashRouter`가 이 문제를 피하는 방법

```jsx
// frontend/src/App.js
import { HashRouter, Routes, Route } from 'react-router-dom';

function App() {
  return (
    <HashRouter>
      <Routes>
        <Route path="/" element={<PostList />} />
        <Route path="/posts/:id" element={<PostDetail />} />
      </Routes>
    </HashRouter>
  );
}
```

`HashRouter`를 쓰면 URL이 `https://rotten-noble.com/#/posts/3`처럼 된다. 핵심은 **`#` 뒤에
오는 부분은 브라우저가 서버로 아예 전송하지 않는다**는 URL 스펙 자체의 성질이다. 브라우저는
`https://rotten-noble.com/#/posts/3`을 새로고침해도, 서버에는 그냥 `https://rotten-noble.com/`
(`#` 앞부분)만 요청한다 — 서버는 항상 같은 `index.html` 하나만 서빙하면 되고, `#` 뒤의 경로
해석은 전적으로 브라우저 안의 자바스크립트(React Router)가 담당한다. 그래서 서버 쪽에 어떤
rewrite 설정도 필요 없다.

### 감수한 대가

URL에 `#`이 보이는 건 사용자 경험 관점에서 약간의 단점이다 — 일부 사용자에게는 "덜 정돈된"
URL로 보일 수 있고, `#` 이후 부분은 검색엔진 크롤러가 예전에는 잘 못 읽던 시절도 있었다(지금은
구글 등 주요 크롤러가 처리하지만, 모든 도구가 동등하게 지원하는 건 아니다). `MEMO-WEB-05`는
이걸 "지금은 URL에 `#`이 붙는 것을 감수하고 우회한 상태"라고 명시적으로 기록해뒀고, 나중에
Web Station에서 rewrite 설정을 직접 만질 방법을 찾으면 `BrowserRouter`로 되돌리는 걸 재검토할
수 있다고 남겨뒀다 — 영구적인 결정이 아니라 "지금 찾은 방법으로는 이게 최선"이라는 임시 우회임을
분명히 한 것이다.

## 비교표

| 항목 | `HashRouter` (이 프로젝트) | `BrowserRouter` |
|---|---|---|
| URL 형태 | `example.com/#/posts/3` | `example.com/posts/3` |
| 서버 rewrite 설정 필요 여부 | 불필요 | 필요(알 수 없는 경로 → `index.html`) |
| 새로고침/직접 접속 시 동작 | 항상 안전(서버는 `#` 이전만 봄) | rewrite 설정 없으면 404 |
| 검색엔진 최적화(SEO) | 상대적으로 불리(과거 이력 때문에 도구 지원이 갈릴 수 있음) | 유리(일반 URL 구조) |
| 이 프로젝트가 고른 이유 | Web Station GUI로 rewrite 설정 불가 | (원래 의도했으나 인프라 제약으로 포기) |

## 질문

- **Q. `HashRouter`를 쓰면 정말 서버 설정을 하나도 안 만져도 되나?**
  A. 그렇다 — 이게 정확히 이 방식을 고른 이유다. 서버는 `/`(루트) 하나만 응답할 수 있으면
  되고, 그 안의 모든 경로 해석은 클라이언트(브라우저의 React Router)가 담당한다. 인프라를
  건드릴 권한이나 방법이 제한적인 환경(공유 호스팅, GUI만 제공하는 관리 콘솔 등)에서 SPA
  라우팅을 붙일 때 흔히 쓰이는 우회법이다.

- **Q. Web Station이 나중에 rewrite 설정을 지원하게 되면 정말 `BrowserRouter`로 바꿔야 하나?**
  A. `MEMO-WEB-05`는 그럴 가능성을 열어뒀지만 필수는 아니다. `HashRouter`도 기능적으로는
  완전히 동작하고 있고, 개인 블로그 규모에서 SEO(검색엔진 노출)가 핵심 목표가 아니라면 URL의
  `#` 하나 때문에 마이그레이션 비용을 들일 필요는 크지 않다 — 다만 만약 이 프로젝트가 나중에
  검색 노출이 중요한 방향으로 바뀐다면 재검토할 만한 항목이다.

## 예시 코드

```jsx
// 만약 BrowserRouter를 쓴다면 이렇게 바뀌고
import { BrowserRouter } from 'react-router-dom';
// <HashRouter> → <BrowserRouter>로 컴포넌트 하나만 바꾸면 코드 자체는 끝난다

// 하지만 서버(Apache) 쪽에 이런 rewrite 규칙이 반드시 있어야 한다 (.htaccess 예시)
// RewriteEngine On
// RewriteCond %{REQUEST_FILENAME} !-f
// RewriteRule ^ index.html [QSA,L]
```

## 플로우차트

(생략 — "URL의 `#` 앞/뒤를 서버가 보는지 안 보는지"라는 단일 차이가 핵심이라, 위 설명과 비교표로
충분히 전달된다.)

## 실무

실무에서는 새 프로젝트라면 대부분 `BrowserRouter`(또는 그 후속인 `createBrowserRouter`)를
기본으로 쓴다 — Vercel, Netlify 같은 정적 호스팅 플랫폼들은 애초에 "알 수 없는 경로는
index.html로"라는 rewrite 규칙을 기본 설정이나 한 줄짜리 설정 파일(`vercel.json`,
`_redirects` 등)로 쉽게 지원하기 때문이다. `HashRouter`는 이 프로젝트처럼 "서버 설정을 만질
권한/방법이 제한적인 환경"이나, GitHub Pages처럼 애초에 커스텀 서버 설정을 지원하지 않는
정적 호스팅에 배포할 때 실무에서도 여전히 쓰이는 실용적인 대안이다.

## 같이 보기

- [React](./React.md) — React Router가 얹히는 기반 라이브러리
- [자체 호스팅(NAS) vs 클라우드](../Infrastructure/Self-Hosting-vs-Cloud.md) — 이 라우팅 제약이 발생한 근본
  원인(관리 콘솔의 한계)

- [React Router 공식 문서](https://reactrouter.com/)

# REST 스타일 API 설계 (응답 봉투 패턴)

---

- **카테고리**: 웹 개발, 네트워크
- **상태**: 완료
- **기준 시점**: 2026-09-08
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

`RottenNobleProject` — `RottenNobleProject-Architecture.md` 2~3회차(아키텍처 계층, 프런트-백엔드
통신) 코드 학습에서 나온 주제.

## 정의

REST(REpresentational State Transfer)는 웹 API를 설계할 때 흔히 따르는 관례의 모음이다 — "자원
(resource)을 URL로 표현하고, HTTP 메서드(GET/POST/PUT/DELETE)로 그 자원에 대해 무엇을 할지
표현한다"는 게 핵심 아이디어다. "응답 봉투(envelope)"는 그 위에 얹는 또 다른 관례로, 모든 API
응답을 `{status: ..., data: ...}` 같은 일관된 형태로 감싸서, 클라이언트가 매번 같은 방식으로
성공/실패를 판단할 수 있게 하는 패턴이다.

## 요약

이 프로젝트의 모든 백엔드 엔드포인트는 정확히 같은 두 가지 응답 모양(`{status:'ok', data}` /
`{status:'error', message}`)만 쓰고, 프런트엔드는 그 모양 하나만 알면 모든 API를 다룰 수 있다 —
작은 규모지만 "일관성"이라는 REST API 설계의 핵심 가치를 제대로 지키고 있는 사례다.

## 상세

### 이 프로젝트가 실제로 쓰는 봉투 형식

```php
// backend/response.php
function send_json($data, int $httpCode = 200): void
{
    http_response_code($httpCode);
    echo json_encode(['status' => 'ok', 'data' => $data]);
    exit;
}

function send_error(string $message, int $httpCode = 400): void
{
    http_response_code($httpCode);
    echo json_encode(['status' => 'error', 'message' => $message]);
    exit;
}
```

성공이면 `data` 필드 안에 실제 값(글 목록, 새로 만든 글 정보 등)이 들어가고, 실패면 `message`
필드에 사람이 읽을 수 있는 에러 메시지가 들어간다. 이 프로젝트의 모든 엔드포인트가 예외 없이 이
두 함수 중 하나로만 응답한다 — 그래서 프런트엔드의 `request()` 헬퍼(`frontend/src/api/posts.js`)가
`body.status !== 'ok'`인지만 확인하면, 어떤 엔드포인트를 호출했든 실패를 똑같은 방식으로 잡아낼
수 있다.

### HTTP 상태 코드도 같이 쓴다는 것

봉투 안의 `status` 필드와는 별개로, 이 프로젝트는 실제 HTTP 상태 코드도 의미에 맞게 구분해서
쓴다:

| 상태 코드 | 쓰이는 곳 | 의미 |
|---|---|---|
| 200 | 조회 성공(`get_posts.php` 등 기본값) | 정상 처리 |
| 201 | `create_post.php` 성공 | 새 자원이 생성됨 |
| 204 | CORS 프리플라이트 응답 | 내용 없이 성공 |
| 400 | 잘못된 입력(`id` 누락, 제목 길이 초과 등) | 클라이언트 요청 자체가 잘못됨 |
| 401 | 로그인 필요/세션 무효 | 인증 실패 |
| 404 | 존재하지 않는 글 조회 | 자원 없음 |
| 405 | 잘못된 HTTP 메서드(POST 엔드포인트에 GET 요청 등) | 메서드 허용 안 됨 |
| 500 | Redis 연결 실패 등 서버 내부 오류 | 서버 오류 |

**왜 봉투의 `status` 필드가 있는데 HTTP 코드도 따로 신경 쓰나?** 이 둘은 서로 다른 계층의 정보다.
HTTP 상태 코드는 브라우저, 프록시, 로그 수집기처럼 **응답 본문(JSON)을 파싱하지 않는 도구들**도
바로 이해할 수 있는 신호다 — 예를 들어 브라우저 개발자 도구의 네트워크 탭에서 실패한 요청이
빨간색으로 표시되는 것도, CDN이나 모니터링 도구가 에러율을 집계하는 것도 이 코드를 본다. 봉투의
`status`/`message`는 반대로 애플리케이션 코드(자바스크립트)가 실제로 무엇이 잘못됐는지 사람이 읽을
문장으로 알아야 할 때 쓰인다. 둘 다 있어야 각자의 소비자에게 맞는 정보를 줄 수 있다.

### 왜 봉투 패턴을 쓰는가 (안 쓰면 어떻게 되나)

봉투 없이 그냥 데이터를 그대로 반환하는 API도 많다 — 예를 들어 `get_posts.php`가
`{status:'ok', data:[...]}`가 아니라 그냥 `[...]`(배열 그대로)를 반환할 수도 있었다. 문제는
에러가 났을 때다. 봉투가 없으면 "이 응답이 성공인지 실패인지"를 HTTP 상태 코드에만 의존해서
판단해야 하는데, 네트워크 장애나 프록시 설정에 따라 상태 코드가 애매해지는 경우가 실무에서
종종 있다. 봉투 패턴은 응답 본문 자체에 성공/실패 표시를 이중으로 남겨서, 이런 애매한 상황에서도
클라이언트가 명확하게 판단할 수 있게 해준다.

## 비교표

| 방식 | 성공/실패 판단 근거 | 이 프로젝트 사용 여부 |
|---|---|---|
| 봉투 없이 데이터 그대로 반환 | HTTP 상태 코드에만 의존 | 사용 안 함 |
| `{status, data\|message}` 봉투(이 프로젝트) | HTTP 코드 + 본문의 `status` 필드, 이중 확인 | **사용 중** |
| GraphQL 스타일(`{data, errors}`) | 항상 200을 반환하고 `errors` 배열 유무로 판단 | 사용 안 함(REST/JSON 방식) |
| JSON:API 표준(`{data, errors, meta}` 등 세분화) | 표준화된 필드 구조 | 사용 안 함(자체 최소 규격) |

## 질문

- **Q. 이 프로젝트의 봉투 형식은 업계 표준(JSON:API 등)을 따른 건가?**
  A. 아니다. `{status, data}` / `{status, message}`는 이 프로젝트가 자체적으로 정한 최소한의
  규칙이다. JSON:API 같은 정식 표준은 페이지네이션, 관계(relationship) 표현 등 훨씬 세분화된
  규격을 갖고 있는데, 이 프로젝트 규모(엔드포인트 10여 개, 글/방명록 두 종류 자원)에서는 그런
  규격이 과하다 — "일관성만 지키면 충분하다"는 판단으로 자체 최소 규격을 쓴 것으로 보인다.

- **Q. 페이지네이션(목록을 나눠서 가져오기)은 어떻게 처리하나?**
  A. `get_posts.php`를 보면 현재는 페이지네이션이 없다 — 전체 글을 한 번에 다 가져온다. 글
  개수가 아주 많아지면 이 부분이 먼저 손봐야 할 지점이 될 것이다(응답 봉투 안에 `data`와 별도로
  `meta: {page, totalCount}` 같은 필드를 추가하는 식으로 확장 가능).

## 예시 코드

```json
// 성공 응답 (get_post.php?id=3)
{
  "status": "ok",
  "data": { "id": 3, "title": "...", "content": "...", "created_at": "..." }
}
```

```json
// 실패 응답 (같은 엔드포인트, 존재하지 않는 id)
{
  "status": "error",
  "message": "게시글을 찾을 수 없습니다."
}
```

```js
// frontend/src/api/posts.js — 이 봉투를 소비하는 프런트 쪽 코드
async function request(path, options = {}) {
  const res = await fetch(`${API_BASE_URL}${path}`, options);
  const body = await res.json();
  if (body.status !== 'ok') {
    throw new Error(body.message || '요청에 실패했습니다.');
  }
  return body.data;
}
```

## 플로우차트

(생략 — 봉투 형식은 "응답 하나의 모양"에 대한 규약이라 순서나 분기가 없다. 표로 이미 충분하다.)

## 실무

실무에서는 이 프로젝트처럼 자체적인 최소 봉투 규격을 쓰는 팀도 많고, JSON:API나 OpenAPI 스펙을
엄격히 따르는 팀도 있다 — 조직 규모와 API 소비자 수에 따라 갈린다. 외부에 공개하는 API일수록
표준 규격을 따르는 게 문서화·클라이언트 SDK 자동 생성 등에서 유리하고, 이 프로젝트처럼 프런트-백엔드
를 같은 사람(팀)이 관리하는 내부용 API는 최소 규격으로도 충분한 경우가 많다. 최근 동향으로는
GraphQL이나 tRPC(TypeScript 풀스택 환경)처럼 "REST + 봉투"라는 관례 자체를 다른 방식으로
대체하려는 흐름도 있지만, REST + JSON 봉투는 여전히 가장 보편적인 선택지다.

## 같이 보기

# Spring Boot — 요청 하나가 지나가는 경로

> `Spring-Boot.md`의 별첨 플로우차트. 작성 규칙은
> `DevelopPrompt/Unity/VISUALIZE_RULE/04_MERMAID_STYLE.md`를 따른다.
> 기준 시점: 2026-09-08

```mermaid
flowchart TD
    REQ["HTTP 요청 (예: POST /api/posts)"] --> CORS{"CorsConfig 허용 origin?"}

    CORS -->|"아니오"| BLOCKED["브라우저가 응답 읽기 차단"]:::bad
    CORS -->|"예"| CTRL["PostController.create()"]

    CTRL --> AUTH["sessionService.requireAdmin()"]
    AUTH -->|"토큰 없음/무효"| APIEX1["ApiException(401)"]:::bad
    AUTH -->|"통과"| RATE["rateLimiter.check()"]

    RATE -->|"한도 초과"| APIEX2["ApiException(429)"]:::bad
    RATE -->|"통과"| VALIDATE["제목/내용 검증"]

    VALIDATE -->|"invalid"| APIEX3["ApiException(400)"]:::bad
    VALIDATE -->|"valid"| REPO["postRepository.save()"]

    REPO --> DB[("MariaDB · posts 테이블")]
    DB --> RESP["ApiResponse.ok(saved)"]:::good

    APIEX1 --> GEH["GlobalExceptionHandler"]
    APIEX2 --> GEH
    APIEX3 --> GEH
    GEH --> ERRRESP["{status:'error', message} + 상태 코드"]:::hi

    classDef bad  fill:#3a1f1f,stroke:#c0392b,color:#f5d5d5
    classDef good fill:#1f3a2a,stroke:#27ae60,color:#d5f5e3
    classDef hi   fill:#3a3320,stroke:#c19a5b,color:#f0e4c8
```

**읽는 법**: 컨트롤러 메서드 안에서 순서대로 일어나는 세 가지 방어(인증 → rate limit → 검증)
중 어디서든 실패하면 `ApiException`을 던지고, 그 예외들은 전부 한 곳(`GlobalExceptionHandler`)
으로 모여 같은 모양의 에러 응답으로 바뀐다(주황). CORS는 이보다 앞단, 프레임워크 레벨에서
걸러진다 — 컨트롤러 코드에 도달하기 전에 브라우저가 자체적으로 막는다(빨강, 서버 로그에도
안 남는 경우가 많다).

**핵심**: PHP 버전은 이 세 가지 방어를 각 파일 맨 위에 순서대로 나열해서 호출했다
(`allow_cors()` → `require_admin()` → `rate_limit_check()` → 검증). Spring 버전도 컨트롤러
메서드 안에서 겉보기엔 똑같은 순서로 호출하지만, 예외 처리 부분만 프레임워크가 한 곳으로
모아준다 — "무엇을 검사하는가"의 순서는 그대로 두고 "실패했을 때 응답을 어떻게 만드는가"만
프레임워크에 위임한 셈이다.

# Spring Boot — 프레임워크가 "대신 해주는 일"이 정확히 뭔가

---

- **카테고리**: 웹 개발, 서버 사이드
- **상태**: 완료
- **기준 시점**: 2026-09-09
- **관련 레포지토리**: `RottenNoble-Project`

---

## 출처

2026-09-08, 시니어 백엔드 개발자로부터 "PHP를 프레임워크 없이 손으로 짠 것과 CRA 둘 다 안 좋은
선택"이라는 피드백을 받은 뒤, 사용자가 백엔드를 Java Spring Boot로 전면 교체하기로 결정하면서
`server/` 모듈을 처음부터 새로 짜며 정리한 주제. [PHP](./PHP.md) 문서와 나란히 놓고 비교하는 게
목적이라, 그 문서는 지우지 않고 그대로 남겨뒀다 — 스택이 바뀌어도 이전 선택이 왜 있었는지는
여전히 배울 거리다.

## 정의

Spring Boot는 순수 자바로 웹 서버를 짤 때 반복되는 배선(라우팅 등록, DB 커넥션 관리, JSON
직렬화, 에러를 HTTP 응답으로 바꾸는 일 등)을 "관례(convention)"로 대신 처리해주는 프레임워크다.
핵심 메커니즘은 **의존성 주입(DI)**과 **자동 설정(auto-configuration)** 두 가지다 — 클래스에
`@Service`/`@Repository`/`@RestController` 같은 표시만 해두면, 프레임워크가 그 객체들을
필요한 곳에 알아서 연결해준다.

## 요약

`RottenNoble-Project`의 PHP 백엔드는 "파일 하나 = 엔드포인트 하나"였고, CORS·인증·DB 연결처럼
반복되는 코드를 `response.php`/`auth.php`/`db.php`로 손수 뽑아 재사용했다. Spring Boot는 그
"뽑아서 재사용하는" 일 자체를 프레임워크가 표준화된 방식(어노테이션 + DI)으로 대신해준다 —
장점은 실수할 여지가 줄어드는 것(CORS 프리플라이트 처리를 직접 안 짜도 됨), 단점은 그 관례를
먼저 배워야 코드를 읽을 수 있다는 것이다.

## 상세

### 의존성 주입 — "new를 누가 대신 해주는가"

```java
@RestController
@RequestMapping("/api/posts")
public class PostController {
    private final PostRepository postRepository;
    private final SessionService sessionService;

    public PostController(PostRepository postRepository, SessionService sessionService) {
        this.postRepository = postRepository;
        this.sessionService = sessionService;
    }
}
```

PHP 쪽 `create_post.php`는 `require 'db.php';`로 전역 `$conn` 변수를 만들어 쓴다. Spring에서는
`PostController`가 "나는 `PostRepository`와 `SessionService`가 필요하다"고 생성자에 선언만 하면,
스프링 컨테이너가 시작 시점에 그 객체들을 만들어서 넣어준다(생성자 주입) — 컨트롤러는 그
객체들이 "어떻게 만들어지는지"(DB 커넥션 풀 설정 등)를 전혀 몰라도 된다. 이 프로젝트는 필드에
`@Autowired`를 붙이는 방식 대신 항상 생성자 주입을 썼다 — 어떤 의존성이 필요한지 생성자
시그니처만 보면 바로 드러나고, 테스트할 때도 가짜 객체를 생성자로 그냥 넣어주면 되기 때문이다.

### 자동 설정 — "왜 Redis 연결 코드가 하나도 없는가"

`backend/lib/redis_client.php`는 RESP 프로토콜을 소켓으로 직접 구현한 60줄짜리 클래스였다.
`server/` 쪽에는 그런 코드가 아예 없다 — `spring-boot-starter-data-redis`를 의존성에 넣고
`application.yml`에 `spring.data.redis.host/port`만 써두면, `StringRedisTemplate`이라는 준비된
객체가 자동으로 만들어져서 아무 곳에나 주입해 쓸 수 있다. 이게 "자동 설정"이다 — 클래스패스에
뭐가 있는지, 설정 파일에 뭐가 적혀 있는지를 보고 필요한 빈(bean)들을 프레임워크가 알아서 등록해준다.

### 필요한 만큼만 가져오기 — `spring-boot-starter-security`를 안 쓴 이유

관리자 로그인 검증에 bcrypt 비교(`BCryptPasswordEncoder`) 하나만 필요했는데, 이걸 위해
`spring-boot-starter-security`(전체 자동 보안 필터 체인)를 넣으면 **기본값으로 모든 엔드포인트가
잠기고, 콘솔에 매번 랜덤 생성되는 임시 비밀번호가 찍히는** 스프링의 유명한 기본 동작이 같이
딸려온다. 이 프로젝트는 관리자가 1명이고 이미 Bearer 토큰 + Redis 세션이라는 직접 검증 로직이
있으므로, 전체 필터 체인 대신 `spring-security-crypto`(그 안의 `BCryptPasswordEncoder`)만
따로 의존성에 넣었다. "프레임워크가 다 해준다"는 걸 무조건 다 갖다 쓰는 게 아니라, **어떤 조각이
필요한지 판단하고 그 조각만 가져오는 것**도 프레임워크를 쓰는 능력의 일부라는 걸 보여주는
사례다.

### 크로스 언어 암호화 호환 — 가장 실수하기 쉬웠던 지점

PHP `backend/lib/crypto.php`에서 이미 AES-256-GCM으로 암호화해 저장한 방명록 데이터가 있어서,
Java 쪽도 같은 키로 그 값을 복호화할 수 있어야 했다([저장 데이터 암호화](../Security/Encryption-at-Rest.md)
참고). 문제는 두 언어의 GCM 구현이 **암호문과 인증 태그를 다루는 방식이 다르다**는 것이다.

```java
// Java: Cipher.doFinal()은 (암호문 + 태그)를 이어붙여서 반환/기대한다
byte[] ciphertextAndTag = cipher.doFinal(plaintext);
// PHP: openssl_encrypt(..., OPENSSL_RAW_DATA, $iv, $tag)는 태그를 별도 out-파라미터로 준다
$ciphertext = openssl_encrypt($plaintext, 'aes-256-gcm', $key, OPENSSL_RAW_DATA, $iv, $tag);
```

저장 포맷(`iv + tag + ciphertext`)을 두 언어에서 똑같이 맞추려면, Java 쪽에서 `doFinal()`이
반환한 덩어리의 마지막 16바이트(태그)를 잘라내 앞으로 옮기는 작업이 필요하다 — 반대로 복호화할
땐 저장된 (iv, tag, ciphertext)를 다시 (ciphertext + tag) 순서로 재조립해서 Java의 `Cipher`에
넘겨야 한다. 이 재배치를 빼먹으면 "같은 알고리즘, 같은 키인데 복호화가 안 되는" 상황이 되고,
에러 메시지도 "인증 실패"처럼 원인을 바로 알기 어려운 형태로 나온다 — 언어를 넘나드는 암호화
호환성을 다룰 때는 "같은 알고리즘 이름을 쓴다"만으로는 부족하고, 각 언어 라이브러리가 바이트를
정확히 어떤 순서로 주고받는지까지 맞춰야 한다는 걸 보여주는 사례다.

### (2026-09-09 추가) 실제로 컴파일·배포된 뒤 드러난 것들

이 문서를 처음 쓴 세션은 java/maven이 없는 환경이라 `server/` 모듈을 한 번도 컴파일해보지 못한
채 마무리됐다(그 PR #3는 결국 머지 없이 close됨). 실제 컴파일·배포는 다른 세션이 `backend-spring/`
라는 새 모듈명으로 다시 짜서 했고, 그 결과가 지금 프로덕션에서 돌고 있다(Spring Boot 4.1.1,
Java 21). 위 내용(DI, 자동 설정, `spring-boot-starter-security` 미사용, 크로스 언어 암호화)은
설계 시점에 세운 계획이었는데, 실제로 돌려본 뒤 드러난 것들은 다음과 같다.

- **Flyway로 마이그레이션을 관리한다.** `ddl-auto: validate`(JPA가 스키마를 직접 건드리지 않고
  검증만 함)만으로는 "기존 PHP 시절 스키마를 Spring 쪽 마이그레이션 이력에 어떻게 편입시키는가"가
  해결이 안 된다 — Flyway의 `baseline-on-migrate` 옵션으로 "이미 존재하는 스키마를 v1 베이스라인
  으로 인정하고 그 이후 변경분부터 마이그레이션 파일로 관리"하는 방식을 썼다(`V1__init.sql`).
  이건 "새 프로젝트에 마이그레이션 도구를 처음 들이는 것"과 "이미 데이터가 있는 운영 DB 위에
  마이그레이션 도구를 나중에 들이는 것"이 다른 문제라는 걸 보여주는 사례다.
- **경로 기반 라우팅이 안 되는 리버스 프록시를 만났다.** 원래 계획은 `rotten-noble.com/api/**`처럼
  기존 도메인 아래 경로로 새 백엔드를 붙이는 것이었지만, DSM 7.1.1의 리버스 프록시 기능이
  경로(path) 단위 라우팅을 지원하지 않아(호스트/포트 단위로만 갈래를 나눌 수 있음) 결국
  `api.rotten-noble.com`이라는 새 서브도메인을 따로 만들어 그쪽으로 백엔드 컨테이너를 붙였다 —
  `HashRouter`로 우회했던 `MEMO-WEB-05`와 같은 계열의 "인프라 GUI가 원하는 설정을 지원 안 해서
  구조를 바꿔 우회한" 패턴이 이번에도 반복됐다.
- **Lombok을 여전히 안 썼다.** 이번엔 실제로 컴파일이 가능한 환경이었는데도 게터/세터를 손으로
  계속 썼다 — 처음의 "검증할 방법이 없어서 보류"라는 이유는 더 이상 유효하지 않았지만, 이미
  Lombok 없이 시작한 코드베이스를 굳이 중간에 바꿀 이유가 없었던 것으로 보인다.
- **CORS·방명록 암호화는 이 배포에 안 들어갔다** — rate limiting은 이식됐지만 나머지 둘은
  아니다. 자세한 내용과 이유는 [CORS](../Network/CORS.md)와
  [저장 데이터 암호화](../Security/Encryption-at-Rest.md)의 "2026-09-09 갱신" 절 참고.

## 비교표

| | PHP (프레임워크 없음) | Spring Boot |
|---|---|---|
| 라우팅 | 파일 하나 = 엔드포인트 하나 | 어노테이션(`@GetMapping` 등)으로 메서드에 경로 매핑 |
| 의존성 연결 | `require`로 전역 변수/함수 공유 | 생성자 주입 — 프레임워크가 객체 그래프를 구성 |
| CORS 프리플라이트 | `allow_cors()`에서 `OPTIONS`를 직접 분기 처리 | `CorsRegistry` 설정만 하면 프레임워크가 처리 |
| DB 접근 | `mysqli` prepared statement를 직접 작성 | Spring Data JPA — 리포지토리 인터페이스만 선언 |
| 에러 → HTTP 응답 | 각 파일에서 `send_error()` 직접 호출 | 예외를 던지면 `@RestControllerAdvice`가 한 곳에서 변환 |
| 배우는 데 드는 비용 | 언어 문법만 알면 코드가 다 보임 | 프레임워크의 관례(어노테이션이 뭘 하는지)를 먼저 알아야 함 |

## 질문

- **Q. 프레임워크가 다 해주면 뭘 배우는 건가?**
  A. "무엇을 직접 짜야 하는가"의 범위가 바뀔 뿐, 배울 게 없어지는 건 아니다 — 대신 "이
  어노테이션을 붙이면 프레임워크가 정확히 무슨 일을 대신 해주는가"를 이해하는 게 새로운 학습
  대상이 된다. PHP 시절엔 CORS 프리플라이트를 직접 짜면서 그 동작을 배웠다면, Spring에서는
  `CorsRegistry`가 내부적으로 같은 일을 어떻게 처리하는지를 아는 게 그 자리를 대신한다.

- **Q. 왜 Lombok(보일러플레이트 자동 생성 라이브러리)을 안 썼나?**
  A. 이 프로젝트를 짠 환경엔 Java/Maven이 아예 없어서 컴파일 자체를 한 번도 못 해봤다. Lombok은
  애노테이션 프로세서를 pom.xml에 추가로 설정해야 하는데, 컴파일을 검증할 방법이 없는 상태에서
  그 설정이 미묘하게 틀릴 위험을 하나 더 얹고 싶지 않아서, 게터/세터를 그냥 손으로 다 썼다 —
  "프레임워크/라이브러리를 얼마나 들여올지"는 항상 "이걸 검증할 방법이 있는가"와 같이
  판단해야 한다는 것도 이번에 새삼 느낀 지점이다.

## 예시 코드

```java
// backend/response.php의 send_error()에 해당하는 자리 — 컨트롤러는 예외만 던지면 된다
throw new ApiException("게시글을 찾을 수 없습니다.", HttpStatus.NOT_FOUND);

// 한 곳에서 모든 컨트롤러의 예외를 가로채 {status:"error", message} 봉투로 바꾼다
@RestControllerAdvice
public class GlobalExceptionHandler {
    @ExceptionHandler(ApiException.class)
    public ResponseEntity<ApiResponse<Void>> handleApiException(ApiException e) {
        return ResponseEntity.status(e.getStatus()).body(ApiResponse.error(e.getMessage()));
    }
}
```

## 플로우차트

`Spring-Boot.flow.md` 참고 — 요청 하나가 컨트롤러부터 예외 처리까지 어떤 순서로 지나가는지.

## 실무

실무에서 Spring Boot는 자바 서버 생태계의 사실상 표준이라 채용 공고 기준으로도 압도적으로 많이
쓰인다. 다만 "관례를 안다"는 전제가 깔려 있어서, 처음 합류하는 사람에게는 "이 어노테이션이 왜
여기 있는지" 자체가 진입 장벽이 되기도 한다 — 이번처럼 프레임워크 없는 버전을 먼저 짜본 다음에
같은 기능을 Spring으로 다시 짜보면, 그 관례가 "마법"이 아니라 "내가 직접 짰던 코드를 대신
해주는 것"이라는 걸 구체적으로 이해하게 된다는 게 이 학습 순서의 실질적인 장점이었다.

<script>
/* ────────────────────────────────────────────────────────────
   초경량 마크다운 렌더러 (외부 의존 0)
   지원: 제목 · 목록 · 체크박스 · 표 · 코드펜스 · 인용 · hr ·
        링크 · 강조 · 인라인코드 · mermaid 블록
   ──────────────────────────────────────────────────────────── */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function inline(s){
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  return t;
}

function splitRow(line){
  return line.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
}

let diagramSeq = 0;

function renderMarkdown(src){
  const lines = src.replace(/\r\n?/g,'\n').split('\n');
  const out = [];
  let i = 0;

  while(i < lines.length){
    const line = lines[i];

    /* 코드 펜스 */
    const fence = line.match(/^\s*```+\s*([\w-]*)\s*$/);
    if(fence){
      const lang = fence[1] || '';
      const buf = [];
      i++;
      while(i < lines.length && !/^\s*```+\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      const body = buf.join('\n');
      if(lang === 'mermaid'){
        if(window.mermaid && !window.__noMermaid){
          out.push('<div class="mermaid" id="mmd'+(++diagramSeq)+'">'+esc(body)+'</div>');
        }else{
          out.push('<div class="diagram-src"><span class="tag">diagram source</span><pre><code>'+esc(body)+'</code></pre></div>');
        }
      }else{
        out.push('<pre><code>'+esc(body)+'</code></pre>');
      }
      continue;
    }

    /* 표 */
    if(/^\s*\|/.test(line) && i+1 < lines.length && /^\s*\|?[\s:-|]+\|[\s:-|]*$/.test(lines[i+1])){
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(splitRow(lines[i++]));
      let html = '<div class="tablewrap"><table><thead><tr>';
      head.forEach(h => html += '<th>'+inline(h)+'</th>');
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr>';
        for(let c=0;c<head.length;c++) html += '<td>'+inline(r[c]||'')+'</td>';
        html += '</tr>';
      });
      out.push(html + '</tbody></table></div>');
      continue;
    }

    /* 제목 */
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const lv = h[1].length; out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'); i++; continue; }

    /* 수평선 */
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    /* 인용 */
    if(/^\s*>/.test(line)){
      const buf = [];
      while(i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+renderMarkdown(buf.join('\n'))+'</blockquote>');
      continue;
    }

    /* 목록 (체크박스 포함) */
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while(i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let text = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');
        i++;
        // 이어지는 들여쓰기 줄 합치기
        while(i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) && !/^\s*```/.test(lines[i])){
          text += ' ' + lines[i].trim(); i++;
        }
        const task = text.match(/^\[([ xX])\]\s*(.*)$/);
        if(task){
          const mark = task[1].toLowerCase()==='x' ? '☑' : '☐';
          items.push('<li class="task">'+mark+' '+inline(task[2])+'</li>');
        }else{
          items.push('<li>'+inline(text)+'</li>');
        }
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push('<'+tag+'>'+items.join('')+'</'+tag+'>');
      continue;
    }

    /* 빈 줄 */
    if(/^\s*$/.test(line)){ i++; continue; }

    /* 단락 */
    const buf = [];
    while(i < lines.length && !/^\s*$/.test(lines[i])
          && !/^\s*(#{1,6}\s|>|```|\||[-*+]\s|\d+\.\s|---+\s*$)/.test(lines[i])){
      buf.push(lines[i++]);
    }
    if(buf.length) out.push('<p>'+inline(buf.join('\n'))+'</p>');
    else i++;
  }
  return out.join('\n');
}

/* ────────────────────────────────────────────────────────────
   문서 저장소 · 네비게이션
   StudyProject는 ComputerScience/{분야}/{주제}.md 카테고리 트리를 쓴다 —
   내장된 문서의 data-name(저장소 루트 기준 상대경로)에서 분야 폴더를 그룹으로 뽑는다.
   ──────────────────────────────────────────────────────────── */
const docs = [];   // {name, text}

const GROUP_ORDER = ['시작', 'Architecture', 'Database', 'Infrastructure', 'Network', 'Security', 'WebDevelopment', '기타'];

function groupOf(name){
  if(/README/i.test(name)) return '시작';
  const m = name.match(/^ComputerScience\/([^/]+)\//);
  if(m) return m[1];
  return '기타';
}

function groupRank(g){
  const idx = GROUP_ORDER.indexOf(g);
  return idx === -1 ? GROUP_ORDER.length : idx;
}

function labelOf(d){
  // "ComputerScience/Network/CORS.md" → "CORS", 루트 파일은 확장자만 뗀다
  const base = d.name.split('/').pop();
  return base.replace(/\.md$/i,'');
}

function sortDocs(){
  docs.sort((a,b)=>{
    const ga = groupRank(groupOf(a.name)), gb = groupRank(groupOf(b.name));
    if(ga !== gb) return ga - gb;
    return labelOf(a).localeCompare(labelOf(b), 'en');
  });
}

function buildNav(activeName){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  let lastGroup = null;
  docs.forEach(d => {
    // .flow.md 별첨 파일은 사이드바에 따로 안 두고, 본문 안 링크로만 이동한다
    if(/\.flow\.md$/i.test(d.name)) return;
    const g = groupOf(d.name);
    if(g !== lastGroup){
      const h = document.createElement('div');
      h.className = 'navgroup'; h.textContent = g;
      nav.appendChild(h); lastGroup = g;
    }
    const b = document.createElement('button');
    b.className = 'navitem' + (d.name === activeName ? ' active' : '');
    b.textContent = labelOf(d);
    b.dataset.name = d.name;
    b.onclick = () => show(d.name);
    nav.appendChild(b);
  });
  applyFilter();
}

function show(name){
  const doc = docs.find(d => d.name === name);
  if(!doc) return;
  const main = document.getElementById('main');
  main.innerHTML =
    '<article class="md">' + renderMarkdown(doc.text) + '</article>' +
    '<footer class="meta">' + escHtmlAttr(doc.name) +
    ' · 이 뷰어는 md 원본을 그대로 렌더링합니다. 내용 수정은 md 파일에서 하세요.</footer>';
  main.scrollTop = 0;
  buildNav(name);
  if(window.mermaid && !window.__noMermaid){
    try{ window.mermaid.run({ querySelector:'.mermaid' }); }catch(e){}
  }
  // 문서 간 상대 링크(같은 폴더 ./X.md, 다른 폴더 ../Y/X.md)를 뷰어 내부 이동으로 처리
  const dir = name.includes('/') ? name.slice(0, name.lastIndexOf('/')) : '';
  main.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if(!/\.md$/i.test(href) || /^https?:\/\//i.test(href)) return;
    const resolved = resolvePath(dir, href);
    if(docs.some(d => d.name === resolved)){
      a.addEventListener('click', ev => { ev.preventDefault(); show(resolved); });
    }
  });
}

function resolvePath(baseDir, relHref){
  const baseParts = baseDir ? baseDir.split('/') : [];
  const relParts = relHref.split('/');
  for(const part of relParts){
    if(part === '.' || part === '') continue;
    if(part === '..') baseParts.pop();
    else baseParts.push(part);
  }
  return baseParts.join('/');
}

function escHtmlAttr(s){ return s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function applyFilter(){
  const q = (document.getElementById('search').value || '').toLowerCase();
  document.querySelectorAll('.navitem').forEach(b => {
    const name = b.dataset.name.toLowerCase();
    const doc = docs.find(d => d.name === b.dataset.name);
    const hit = !q || name.includes(q) || (doc && doc.text.toLowerCase().includes(q));
    b.classList.toggle('hide', !hit);
  });
}
document.getElementById('search').addEventListener('input', applyFilter);

function addDocs(list, autoShow){
  list.forEach(d => {
    const exist = docs.findIndex(x => x.name === d.name);
    if(exist >= 0) docs[exist] = d; else docs.push(d);
  });
  sortDocs();
  if(docs.length && autoShow){
    const first = docs.find(d => !/\.flow\.md$/i.test(d.name)) || docs[0];
    show(first.name);
  }else buildNav();
}

/* 파일 선택 */
document.getElementById('picker').addEventListener('change', async e => {
  const files = [...e.target.files];
  const loaded = await Promise.all(files.map(async f => ({ name:f.name, text:await f.text() })));
  addDocs(loaded, true);
});

/* 드래그 앤 드롭 */
const main = document.getElementById('main');
['dragenter','dragover'].forEach(t => main.addEventListener(t, e => {
  e.preventDefault(); document.getElementById('drop')?.classList.add('over');
}));
main.addEventListener('dragleave', () => document.getElementById('drop')?.classList.remove('over'));
main.addEventListener('drop', async e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  if(!files.length) return;
  const loaded = await Promise.all(files.map(async f => ({ name:f.name, text:await f.text() })));
  addDocs(loaded, true);
});

/* mermaid 초기화 — 문서 렌더링보다 먼저 해야 테마가 적용된다 */
if(window.mermaid && !window.__noMermaid){
  try{
    window.mermaid.initialize({
      startOnLoad:false,
      theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
  }catch(e){ window.__noMermaid = true; }
}

/* ① 번들에 내장된 문서가 있으면 그것을 쓴다 */
(function loadEmbedded(){
  const nodes = [...document.querySelectorAll('script[type="text/markdown"]')];
  if(!nodes.length) return;
  addDocs(nodes.map(n => ({ name:n.dataset.name, text:n.textContent })), true);
  document.getElementById('loader').style.display = 'none';
})();
